  }
  $('#g-save', d).addEventListener('click', async () => { if (await apply()) d.close('saved'); });
  $('#g-cancel', d).addEventListener('click', () => d.close('cancel'));
  $('#g-add', d).addEventListener('click', async () => { if (await apply()) { d.close('add'); ui.selected = id; addTask(); } });
  $('#g-del', d).addEventListener('click', async () => {
    const n = p.tasks.length;
    const hasAtt = (p.attachments && p.attachments.length) || p.tasks.some((t) => t.attachments && t.attachments.length);
    const ok = await confirmBox('Delete phase?',
      `<p>Delete phase <b>${esc(num.get(id))} ${esc(p.name)}</b>${n ? ` and its <b>${n}</b> task(s)` : ''}?</p>` +
      (n ? '<p>Dependency links from other tasks to these tasks will also be removed.</p>' : '') +
      (hasAtt ? '<p>Attachment list entries will be removed, but the files themselves stay on disk.</p>' : '') +
      '<p class="hint">You can undo this with Ctrl+Z.</p>', 'Delete', true);
    if (ok) { d.close('del'); deletePhase(id); }
  });
  d.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing && (e.target === name || e.target.closest('.linkrow'))) { e.preventDefault(); $('#g-save', d).click(); } });
  if (focusAttachments) { const sec = $('#atc-sec', d); if (sec) sec.scrollIntoView({ block: 'start' }); }
  else { name.focus(); name.select(); }
}

/** "FS +2d" / "SS −1d" / plain "FS" when there is no lag (K3 boxes). */
function linkLagText(dep) {
  const lag = Number(dep.lag) || 0;
  if (!lag) return dep.type;
  return `${dep.type} ${lag > 0 ? '+' : '−'}${Math.abs(lag)}d`;
}

/** Done / In progress / Not started, the same rule used for tasks and phases (K3 boxes). */
function wnState(percent, milestoneDone) {
  if (milestoneDone !== undefined) return milestoneDone ? 'Done' : 'Not started';
  if (percent >= 100) return 'Done';
  if (percent > 0) return 'In progress';
  return 'Not started';
}

/** One "What next?" box worth of display data for a task (also used for a phase's pred/succ, which are always tasks). */
function wnTaskBox(t, num) {
  return { id: t.id, isPhase: false, num: num.get(t.id), name: t.name,
    span: `${dayToDisp(isoToDay(t.start))} – ${dayToDisp(taskEndDay(t))}`,
    pct: t.milestone ? null : t.percent, state: wnState(t.percent, t.milestone ? t.done : undefined) };
}

/** One "What next?" box worth of display data for a phase (dates/% from phaseSummary). */
function wnPhaseBox(p, num) {
  const sm = phaseSummary(p);
  return { id: p.id, isPhase: true, num: num.get(p.id), name: p.name,
    span: sm ? `${dayToDisp(sm.start)} – ${dayToDisp(sm.end)}` : '—',
    pct: sm ? sm.percent : null, state: wnState(sm ? sm.percent : 0) };
}

/** Renders one box of the "What next?" dialog; `entry` null shows the "no predecessor/successor" placeholder. */
function wnBoxHTML(entry, roleLabel, noneText) {
  if (!entry) return `<div class="wn-box wn-none">${esc(noneText)}</div>`;
  const clickable = roleLabel !== 'Selected';
  return `<div class="wn-box${clickable ? ' wn-click' : ' wn-self'}"${clickable ? ` data-wn="${esc(entry.id)}" role="button" tabindex="0" aria-label="Go to ${esc(entry.isPhase ? 'phase' : 'task')} ${esc(entry.num)} ${esc(entry.name)}"` : ''}>` +
    `<div class="wn-role">${esc(entry.label || roleLabel)}</div>` +
    `<div class="wn-num">${esc(entry.num)} <span class="wn-kind">${entry.isPhase ? 'Phase' : 'Task'}</span></div>` +
    `<div class="wn-name">${esc(entry.name)}</div>` +
    `<div class="wn-span">${esc(entry.span)}</div>` +
    `<div class="wn-meta">${entry.pct === null ? '' : entry.pct + '% · '}${esc(entry.state)}</div>` +
    (entry.link ? `<div class="wn-link">${esc(entry.link)}</div>` : '') + `</div>`;
}

/**
 * "WHAT NEXT?" DIALOG (K3): shows the driving predecessor and the earliest
 * successor of the selected task or phase (a phase falls back to the
 * previous/next phase when it has no external link). Read-only - no
 * `commit()`, no undo step. Clicking a predecessor/successor box walks the
 * chain: it selects that item, scrolls it into view and re-opens this
 * dialog for it. While open, the timeline highlights just the two boxed
 * tasks/phases that have a real link and dims everything else.
 */
function openWhatNext(id) {
  id = id || ui.selected;
  const tl = id ? findTask(id) : null, pl = !tl && id ? findPhase(id) : null;
  if (!tl && !pl) { showMessage('What do I do next?', '<p>Select a task or phase first.</p>'); return; }
  const num = numbering();
  const hiIds = new Set([id]), hiLinks = new Set();
  let selfBox, pred = null, succ = null, note = '';

  if (tl) {
    selfBox = wnTaskBox(tl.task, num);
    const dp = drivingPred(id);
    if (dp) {
      pred = { ...wnTaskBox(dp.pred, num), link: linkLagText(dp.dep) };
      hiIds.add(dp.pred.id); hiLinks.add(`${id}|${dp.pred.id}`);
      if (dp.viaSnet) note = `Start set by constraint: Start no earlier than ${dayToDisp(dp.snetDay)}.`;
    }
    const fs = firstSuccessor(id);
    if (fs) { succ = { ...wnTaskBox(fs.task, num), link: linkLagText(fs.dep) }; hiIds.add(fs.task.id); hiLinks.add(`${fs.task.id}|${id}`); }
  } else {
    const p = pl.phase;
    selfBox = wnPhaseBox(p, num);
    const dp = phaseDrivingPred(id);
    if (dp) {
      pred = { ...wnTaskBox(dp.pred, num), link: linkLagText(dp.dep) };
      hiIds.add(dp.pred.id); hiIds.add(dp.task.id); hiLinks.add(`${dp.task.id}|${dp.pred.id}`);
    } else {
      const prev = siblingPhase(id, -1);
      if (prev) { pred = { ...wnPhaseBox(prev, num), label: 'Previous phase' }; hiIds.add(prev.id); }
    }
    const fs = phaseFirstSuccessor(id);
    if (fs) {
      succ = { ...wnTaskBox(fs.task, num), link: linkLagText(fs.dep) };
      hiIds.add(fs.task.id); hiIds.add(fs.from.id); hiLinks.add(`${fs.task.id}|${fs.from.id}`);
    } else {
      const next = siblingPhase(id, 1);
      if (next) { succ = { ...wnPhaseBox(next, num), label: 'Next phase' }; hiIds.add(next.id); }
    }
  }

  setK3Highlight(hiIds, hiLinks);
  const d = openDialog(`
    <h2>What do I do next?</h2>
    <div class="wn-row">
      ${wnBoxHTML(pred, 'Predecessor', 'No predecessor')}
      ${wnBoxHTML(selfBox, 'Selected', '')}
      ${wnBoxHTML(succ, 'Successor', 'No successor')}
    </div>
    ${note ? `<p class="hint wn-note">${esc(note)}</p>` : ''}
    <div class="btns"><button class="primary" id="wn-close">Close</button></div>`,
    () => clearK3Highlight());
  $$('[data-wn]', d).forEach((el) => {
    const go = () => { const target = el.dataset.wn; d.close(); walkTo(target); };
    el.addEventListener('click', go);
    el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
  });
  $('#wn-close', d).addEventListener('click', () => d.close());
  $('#wn-close', d).focus();
}

/**
 * LINK DIALOG (click on an arrow): change the type or lag of one dependency,
 * or delete it. One undo step.
 */
function openLinkDialog(succId, predId) {
  const s = findTask(succId), p = findTask(predId);
  if (!s || !p) return;
  const dep = s.task.deps.find((x) => x.pred === predId);
  if (!dep) return;
  const num = numbering();
  const names = { FS: 'FS – finish-to-start', SS: 'SS – start-to-start', FF: 'FF – finish-to-finish', SF: 'SF – start-to-finish' };
  const d = openDialog(`
    <h2>Link ${esc(num.get(predId))} → ${esc(num.get(succId))}</h2>
    <p><b>${esc(p.task.name)}</b> (predecessor) → <b>${esc(s.task.name)}</b> (successor)</p>
    <div class="grid2">
      <label>Type<select id="l-type">${DEP_TYPES.map((t) => `<option value="${t}"${t === dep.type ? ' selected' : ''}>${names[t]}</option>`).join('')}</select></label>
      <label>Lag in days (negative = lead)<input id="l-lag" type="number" step="1" value="${Number(dep.lag) || 0}"></label>
    </div>
    ${depExamplesHTML(true)}
    <div class="btns">
      <button class="danger" id="l-del">Delete link</button>
      <span class="spacer"></span>
      <button id="l-cancel">Cancel</button>
      <button class="primary" id="l-save">Save</button>
    </div>`);
  const save = () => {
    const type = $('#l-type', d).value, lag = clampInt($('#l-lag', d).value, -100000, 100000, 0);
    commit(() => { const x = findTask(succId)?.task.deps.find((k) => k.pred === predId); if (!x) return false; x.type = type; x.lag = lag; });
    d.close('saved');
  };
  $('#l-save', d).addEventListener('click', save);
  $('#l-cancel', d).addEventListener('click', () => d.close('cancel'));
  $('#l-del', d).addEventListener('click', () => {
    commit(() => { const x = findTask(succId); if (!x) return false; x.task.deps = x.task.deps.filter((k) => k.pred !== predId); });
    d.close('del');
  });
  d.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing && e.target.matches('input')) { e.preventDefault(); save(); } });
  $('#l-type', d).focus();
}

/**
 * PUBLIC HOLIDAYS DIALOG: choose the countries (Slovenia, USA) and switch
 * single holidays off or on again, separately for every year. The settings
 * are part of the project file. One undo step.
 */
function openHolidaysDialog() {
  const draft = JSON.parse(JSON.stringify(state.holidays || defaultHolidays()));
  const off = new Set(draft.off);
  const g = lastLayout ? lastLayout.g : timelineGeom();
  const thisYear = dayParts(todayDay()).y;
  const y0 = Math.min(dayParts(g.start).y, thisYear), y1 = Math.max(dayParts(g.end).y, thisYear) + 1;
  const years = [];
  for (let y = y0; y <= y1; y++) years.push(y);
  const d = openDialog(`
    <h2>Public holidays</h2>
    <p class="hint" style="margin:0 0 8px">Calculated offline and shown as shaded days on the timeline. Durations are not changed (calendar days).</p>
    <div class="grid2">
      ${Object.entries(HOLIDAY_COUNTRIES).map(([cc, name]) => `<label class="chk"><input type="checkbox" data-cc="${cc}"${draft.countries.includes(cc) ? ' checked' : ''}> ${esc(name)}</label>`).join('')}
    </div>
    <div class="grid2">
      <label>Year<select id="h-year">${years.map((y) => `<option${y === thisYear ? ' selected' : ''}>${y}</option>`).join('')}</select></label>
      <div class="btns" style="margin:0;align-self:end;padding-bottom:10px"><button id="h-all">All on</button><button id="h-none">All off</button></div>
    </div>
    <div class="holi" id="h-list"></div>
    <p class="hint">Slovenia: work-free days (dela prosti dnevi) under the ZPDPD act. USA: the 11 federal holidays, on the observed day. Laws can change – switch off what does not apply.</p>
    <div class="btns"><span class="spacer"></span><button id="h-cancel">Cancel</button><button class="primary" id="h-save">Save</button></div>`);
  const list = $('#h-list', d), yearSel = $('#h-year', d);
  const yearItems = () => draft.countries.flatMap((cc) => holidaysForYear(cc, Number(yearSel.value)));
  function renderList() {
    const y = Number(yearSel.value);
    if (!draft.countries.length) { list.innerHTML = '<p class="hint" style="margin:8px 0">No country selected – no holidays are shown.</p>'; return; }
    list.innerHTML = draft.countries.map((cc) => `<h4>${esc(HOLIDAY_COUNTRIES[cc])} ${y}</h4>` +
      holidaysForYear(cc, y).map((x) => `<label class="hr"><input type="checkbox" data-key="${esc(x.key)}"${off.has(x.key) ? '' : ' checked'}>` +
        `<span class="hd">${dayToDisp(x.day)}</span><span class="wd">${WEEKDAYS[mondayIndex(x.day)]}</span><span>${esc(x.name)}</span></label>`).join('')).join('');
  }
  $$('[data-cc]', d).forEach((cb) => cb.addEventListener('change', () => {
    draft.countries = Object.keys(HOLIDAY_COUNTRIES).filter((cc) => $(`[data-cc="${cc}"]`, d).checked);
    renderList();
  }));
  yearSel.addEventListener('change', renderList);
  list.addEventListener('change', (e) => { const k = e.target.dataset.key; if (!k) return; if (e.target.checked) off.delete(k); else off.add(k); });
  $('#h-all', d).addEventListener('click', () => { for (const x of yearItems()) off.delete(x.key); renderList(); });
  $('#h-none', d).addEventListener('click', () => { for (const x of yearItems()) off.add(x.key); renderList(); });
  $('#h-cancel', d).addEventListener('click', () => d.close('cancel'));
  $('#h-save', d).addEventListener('click', () => {
    commit(() => { state.holidays = { countries: draft.countries, off: [...off].sort() }; });
    d.close('saved');
  });
  renderList();
  yearSel.focus();
}

/** Help text; the short variant is used on the welcome screen. */
function helpHTML(short) {
  const k = (s) => `<kbd>${s}</kbd>`;
  const basics = `
    <ul>
      <li><b>+ Phase</b> / <b>+ Task</b> add rows. Edit names, dates, days, % and owner directly in the table.</li>
      <li><b>Open details:</b> Tap a row number (e.g. <b>1.2</b>), double-click the name, or click a bar to see all details: task or milestone, phase, note and predecessors.</li>
      <li><b>Nothing is saved automatically.</b> Use Menu → <b>Save (JSON)</b> and later Menu → <b>Open project</b>.</li>
    </ul>`;
  if (short) return `<div class="help">${basics}<p class="hint">Menu → Help &amp; shortcuts shows this and more at any time.</p></div>`;
  return `<div class="help">${basics}
    <ul>
      <li>Tasks with predecessors are <b>scheduled automatically</b> (as soon as possible): their start follows the links and moves when a predecessor moves. Shift them with a lag (+ days) or lead (− days).</li>
      <li>Link types: <b>FS</b> finish-to-start, <b>SS</b> start-to-start, <b>FF</b> finish-to-finish, <b>SF</b> start-to-finish. Loops are prevented. Examples below.</li>
      <li><b>Linking with the mouse:</b> point at a bar – small circles appear at its start and finish. Drag a circle onto the start or finish of another task: finish → start = FS, start → start = SS, finish → finish = FF, start → finish = SF. Drag the tip of an arrow onto another task to re-connect it; click an arrow to change its type or lag, or to delete it. (On touch screens use the task dialog.)</li>
      <li><b>Start no earlier than:</b> typing a start date on a linked task sets this constraint (orange mark). The task then starts at the later of the link result and that date. Clear the field to remove it.</li>
      <li><b>Public holidays</b> (Menu → Public holidays): Slovenia and/or USA, calculated offline; single holidays can be switched off per year. They are shown only – durations stay in calendar days. Hover (or tap, on touch) a shaded holiday column in the timeline header or body to see its date and name in a small tooltip; it disappears again after about 1.5 seconds.</li>
      <li>Durations are <b>calendar days</b> (weekends included), at least 1 day. An end date before the start is corrected automatically.</li>
      <li><b>Milestones</b> (circles) mark a date and have no links. Tick “reached” to fill the circle.</li>
      <li>Phases: ▾/▸ collapses a phase; its bar spans all of its tasks. Use ↑/↓ to reorder rows – numbers update automatically.</li>
      <li><b>Today line:</b> a red vertical line marks today's date in the timeline. Click <b>Today</b> to scroll to it (and the line blinks three times). Visible in both week and month zoom, and on printed pages.</li>
      <li><b>Web links:</b> the task and phase dialogs have a "Links" section (label + URL, add/remove); only https:, http: and mailto: links are accepted. An item with links shows a 🔗 in its name cell in the table: click it to open the single link, or to see a list when there is more than one. Links are only kept in the JSON file (not in CSV/MS Project exports).</li>
      <li><b>Attachments:</b> the task and phase dialogs have an "Attachments" section ("+ Add file…", "Update snapshot"). Files are never stored inside the JSON – they live next to it, in a folder named "&lt;project name&gt;_Attachments", with one subfolder per task/phase (created the first time a file is added). Every subfolder starts with a "snapshot" PNG picture of that item's schedule; "Update snapshot" adds a newer one without touching the file list. Keep gantt-planner.html, the project's JSON file and its "_Attachments" folder together in one place.
        <ul>
          <li><b>Chrome/Edge:</b> the first "Add file…"/"Update snapshot" asks you to pick the folder that holds the JSON file once; the app then copies files there directly (name clashes get " (2)", " (3)", …) and "Open" reads the file straight from disk. If a file cannot be found any more, it is marked "missing" with a "Re-select…" button.</li>
          <li><b>Safari/Firefox:</b> the browser cannot write to an arbitrary folder, so "Add file…" only records the file's name and target path, downloads the snapshot, and shows exactly what to move into the "_Attachments" subfolder by hand. "Open" then follows a relative link, which only works once the file is actually there next to gantt-planner.html (and the browser may ignore the automatic download below for such a link – open it from the Downloads list instead).</li>
        </ul>
        <b>Opening a file:</b> PDFs, pictures (png/jpg/gif/webp/bmp) and plain text (txt/csv/log) open right in a new browser tab. Everything else – Outlook e-mails (.msg/.eml), Word/Excel/PowerPoint files, .zip and the rest – is downloaded with its original name instead, so your computer opens it with the program it is associated with (e.g. Outlook, Word); the first such download in a session explains this once.
        An item with attachments shows a 📎 with a count in its name cell; click it to jump straight to that item's Attachments section (clicking it again while that dialog is already open just brings it to the front instead of opening a second one). Removing an entry only removes it from the list – the file itself is never deleted. While a file is being added or a snapshot is being updated, the button shows "Adding…"/"Working…" and further clicks are ignored until it finishes; adding the very same file again within a few seconds asks first, so a slow picker or a hesitant double-click cannot silently add it twice.</li>
      <li><b>What next?</b> (toolbar, next to the project name): select a task or phase first, then click it (or the ⏭ icon on narrow screens) to see its driving predecessor and its earliest successor, with the link type and lag between them. A phase without an external link shows the previous/next phase instead. Click a predecessor/successor box to jump to it and see its own "next" links.</li>
      <li><b>Switch Work/Life</b> (toolbar, next to the project name; "W/L" on narrow screens): toggles the timeline between calendar days (Mon–Sun) and work days (Mon–Fri, weekends collapsed to zero width) in both week and month zoom. This only changes how the chart is drawn – durations, dates, exports and the saved JSON always stay in calendar days, and the setting itself is not saved. A bar that falls partly or fully on a weekend is drawn shorter (or at the following Monday, at least 8 px wide); public holidays on weekdays stay shaded.</li>
      <li><b>Notes:</b> The note field in task and phase details can hold up to 600 characters. Notes are included in CSV and MS Project exports, but only the JSON file preserves them when you export.</li>
      <li><b>Saving (Menu → Save (JSON), ${k('Ctrl')}+${k('S')}):</b>
        <ul>
          <li><b>Chrome/Edge:</b> the first save asks where to put the file and remembers that file for the rest of the session; every later save (and Ctrl+S) writes straight back to it – no dialog, and never a second file like "Project (1).json". Opening a project the same way (Menu → Open project) remembers its file too, so the very first save after opening already overwrites it. Use Menu → <b>Save as…</b> to choose a different file (the new one is then remembered instead). A brief "Saved HH:MM · name.json" note appears under the toolbar and fades away – no dialog for a normal save, only for a problem.</li>
          <li><b>Safari/Firefox</b> (no such file access): every save downloads a new file, exactly as before. If a file with the same name is already in your Downloads folder, the browser itself adds "(1)", "(2)", … – this app cannot change that. Delete or move the older file first if you want the name to stay the same, or use Chrome/Edge for true save-in-place.</li>
        </ul></li>
      <li>The browser warns you before closing the page with unsaved changes. Undo keeps the last 10 steps (an opened file counts as one step).</li>
      <li>Exports: CSV for Excel, basic MS Project XML (owners not included – please check the result in MS Project), Print/PDF on A4 landscape, split into several pages if needed.</li>
    </ul>
    <h3>Examples of link types</h3>
    ${depExamplesHTML(false)}
    <h3>Keyboard shortcuts</h3>
    <table class="keys">
      <tr><td>${k('Ctrl')} + ${k('S')}</td><td>Save (JSON)</td></tr>
      <tr><td>${k('Ctrl')} + ${k('Z')}</td><td>Undo (outside of a field that is being edited)</td></tr>
      <tr><td>${k('Ctrl')} + ${k('Y')} &nbsp;or&nbsp; ${k('Ctrl')} + ${k('Shift')} + ${k('Z')}</td><td>Redo</td></tr>
      <tr><td>${k('Alt')} + ${k('N')}</td><td>New task (Ctrl+N is reserved by the browser)</td></tr>
      <tr><td>${k('Ctrl')} + ${k('P')}</td><td>Print / save as PDF</td></tr>
      <tr><td>${k('Tab')} / ${k('Shift')} + ${k('Tab')}</td><td>Next / previous field</td></tr>
      <tr><td>${k('Enter')}</td><td>Confirm a table edit · Save in a dialog</td></tr>
      <tr><td>${k('Esc')}</td><td>Undo the current table edit · close a dialog</td></tr>
    </table>
    <p class="hint">On a Mac use ⌘ instead of Ctrl and ⌥ instead of Alt.</p>
    <p class="hint">Gantt Chart Planner 4.0 · works offline · no data leaves this device.</p></div>`;
}

/** Help dialog (Menu → Help & shortcuts). */
function openHelp() {
  showMessage('Help & shortcuts', helpHTML(false));
}

/**
 * WELCOME SCREEN shown at every start (the app keeps no memory between
 * sessions): project name, short instructions and how to begin.
 */
function openWelcome() {
  const d = openDialog(`
    <h2>Gantt Chart Planner</h2>
    <p>A standalone Gantt chart editor that works offline. Nothing is installed and no data leaves this device – your project lives in the JSON file you save.</p>
    <label>Project name<input id="w-name" value="${esc(state.name)}" autocomplete="off"></label>
    ${helpHTML(true)}
    <div class="btns">
      <button id="w-open">Open project file…</button>
      <button id="w-empty">Start empty</button>
      <span class="spacer"></span>
      <button class="primary" id="w-start">Start with example</button>
    </div>`);
  const name = $('#w-name', d);
  const takeName = () => { state.name = name.value.trim() || 'My Project'; requestRender(); };
  $('#w-start', d).addEventListener('click', () => { takeName(); d.close('start'); });
  $('#w-empty', d).addEventListener('click', () => {
    takeName();
    state.phases = [];
    undoStack = []; redoStack = []; dirty = false; ui.selected = null;
    d.close('empty');
    requestRender();
  });
  $('#w-open', d).addEventListener('click', () => { takeName(); d.close('open'); openProject(); });
  name.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); $('#w-start', d).click(); } });
  $('#w-start', d).focus();
}
</script>

<!-- ======================================================================
     6. UI RENDER: table + timeline
     ====================================================================== -->
<script id="ui-render">
'use strict';

/** Last layout, used for scrolling to dates and for keeping the view on zoom changes. */
let lastLayout = null;
/** Data key (e.g. "t5|name") of the field that should get focus after the next render. */
let pendingFocus = null;
let renderQueued = false;
/** Flag to apply the today line blink after the next render. */
let applyTodayBlink = false;
/**
 * Set while the "What next?" dialog (K3) is open: { ids: Set, links: Set }
 * of the task/phase ids and "succ|pred" arrow keys to keep at full opacity;
 * everything else on the timeline is dimmed. null = no highlight.
 */
let k3Highlight = null;

/** Turns the "What next?" highlight on and redraws. */
function setK3Highlight(ids, links) { k3Highlight = { ids, links }; render(); }

/** Turns the "What next?" highlight off (called when its dialog closes) and redraws. */
function clearK3Highlight() { if (k3Highlight) { k3Highlight = null; render(); } }

/** Coalesces many change requests into one render per animation frame. */
function requestRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; render(); });
}

/** Current row height in px (CSS variable --rh: 32 on desktop, 45 on touch screens). */
function rowHeight() {
  return parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--rh')) || 32;
}

/** Column widths in px. Touch screens get 44 px buttons; narrow screens a narrower name column. */
function colDefs() {
  const coarse = matchMedia('(pointer: coarse)').matches;
  const narrow = matchMedia('(max-width: 600px)').matches;
  const b = coarse ? 44 : 30;
  return {
    id: coarse ? 50 : 48, name: narrow ? 130 : 240, act: b * 2 + 1,
    start: coarse ? 120 : 92, end: coarse ? 120 : 92, dur: coarse ? 64 : 50,
    pct: coarse ? 64 : 50, person: coarse ? 120 : 110, pred: coarse ? 140 : 120,
  };
}

/**
 * Timeline geometry for the current zoom.
 * Week view: 22 px per day, weeks start on Monday, at least 9 weeks shown.
 * Month view: 5 px per day, whole months, at least 7 months shown.
 * Always covers all tasks AND today (so "Today" always works).
 *
 * K17 "Switch Work/Life" (`ui.days`): in 'work' mode Saturdays/Sundays get
 * zero width, so the x-axis is non-linear. `x(n)` is built from a prefix sum
 * of "shown" days (O(1) per call after one O(days) pass); a weekend day maps
 * to the same x as the following Monday, which is exactly what is needed to
 * draw a weekend-only bar/milestone/today-line "at the Monday boundary" with
 * no special-casing elsewhere. `shown(n)` reports whether a day has any
 * width, `dayAt(px)` is the inverse of `x` (never returns a hidden weekend
 * day), and `span(a, bExclusive)` is the pixel width of the shown days in
 * [a, bExclusive) - use it instead of `(b - a) * dayW` for any multi-day
 * width (task/phase bars, page ranges, ...).
 */
function timelineGeom() {
  const today = todayDay();
  let min = today, max = today;
  for (const t of allTasks()) {
    min = Math.min(min, isoToDay(t.start));
    max = Math.max(max, taskEndDay(t));
  }
  let start, end, dayW;
  if (ui.zoom === 'month') {
    dayW = 5;
    start = firstOfMonth(min, -1);
    end = firstOfMonth(max, 2) - 1;
    if (end - start < 200) end = firstOfMonth(start, 7) - 1;
  } else {
    dayW = 22;
    start = min - mondayIndex(min) - 7;
    end = max - mondayIndex(max) + 6 + 14;
    if (end - start < 62) end = start + 62;
  }
  const work = ui.days === 'work';
  const shown = (n) => !work || mondayIndex(n) < 5;
  const span = end - start + 1;
  // prefix[i] = number of shown days among start .. start+i-1 (so x(start+i) = prefix[i] * dayW).
  const prefix = new Array(span + 1);
  const shownDays = [];
  prefix[0] = 0;
  for (let i = 0; i < span; i++) {
    const day = start + i;
    const isShown = shown(day);
    if (isShown) shownDays.push(day);
    prefix[i + 1] = prefix[i] + (isShown ? 1 : 0);
  }
  if (!shownDays.length) shownDays.push(start);          // degenerate all-weekend range never happens in practice, guard anyway
  const width = prefix[span] * dayW;
  const x = (n) => prefix[Math.min(Math.max(n - start, 0), span)] * dayW;
  const dayAt = (px) => shownDays[Math.min(shownDays.length - 1, Math.max(0, Math.floor(px / dayW)))];
  return { zoom: ui.zoom, days: ui.days, start, end, dayW, width, x, shown, dayAt,
    span: (a, bExclusive) => x(bExclusive) - x(a),
    hdrH: ui.zoom === 'month' ? 66 : 44,          // month view has a third header line with week numbers
    hol: holidayIndex(start, end) };
}

/**
 * Rows to display, honouring collapsed phases and the search text. While
 * searching, matching tasks are shown even inside collapsed phases; a phase
 * whose name matches shows all its tasks.
 */
function visibleRows() {
  const f = ui.filter.trim().toLowerCase();
  const rows = [];
  for (const p of state.phases) {
    const phaseMatch = !f || p.name.toLowerCase().includes(f);
    const tasks = p.tasks.filter((t) => !f || phaseMatch || t.name.toLowerCase().includes(f));
    if (f && !phaseMatch && !tasks.length) continue;
    rows.push({ kind: 'phase', phase: p });
    if (!p.collapsed || f) for (const t of tasks) rows.push({ kind: 'task', task: t, phase: p });
  }
  return rows;
}

/** SVG: timeline header (week view: weeks + days; month view: years + months + ISO week numbers). */
function timelineHeaderInner(g) {
  const H = 44, mid = 22;
  let s = `<line x1="0" y1="${mid + 0.5}" x2="${g.width}" y2="${mid + 0.5}" class="th-l"/>`;
  // Add "Today" label in the day-number row (positioned below week/month headers).
  const today = todayDay();
  if (today >= g.start && today <= g.end) {
    const x = g.x(today) + g.dayW / 2;
    if (g.zoom === 'week') {
      // Week view: show day number as a red pill (replacing the normal number).
      const d = dayParts(today).d;
      const tw = Math.max(14, g.dayW - 2);
      s += `<rect x="${x - tw/2}" y="27" width="${tw}" height="14" class="today-label-bg"/>` +
        `<text x="${x}" y="38" class="today-label">${d}</text>`;
    } else {
      // Month view: compact "T" label on the line.
      s += `<rect x="${x - 6}" y="${H - 12}" width="12" height="10" class="today-label-bg"/>` +
        `<text x="${x}" y="${H - 4}" class="today-label" style="font-size:8px">T</text>`;
    }
  }
  const seg = (from, nextFn, y1, y2, label, minW) => {
    let n = from;
    while (n <= g.end) {
      const next = Math.min(nextFn(n), g.end + 1);
      const x = g.x(n), w = g.span(n, next);     // K17: shown-days width, not (next-n)*dayW (weekends may be hidden)
      s += `<line x1="${x + 0.5}" y1="${y1}" x2="${x + 0.5}" y2="${y2}" class="th-l"/>`;
      if (w >= minW) s += `<text x="${x + 5}" y="${y1 + 15}" class="th-t${y1 === 0 ? ' th-b' : ''}">${label(n)}</text>`;
      n = next;
    }
  };
  if (g.zoom === 'week') {
    // Top line: one label per week ("W39 · Sep 2026"), so the month is visible wherever you scroll.
    seg(g.start, (n) => n + 7, 0, mid, (n) => { const p = dayParts(n); return `W${isoWeek(n)} · ${MONTHS[p.m]} ${p.y}`; }, 90);
    for (let n = g.start; n <= g.end; n++) {
      if (!g.shown(n)) continue;                 // K17: weekend column has zero width in work mode - nothing to draw
      const x = g.x(n), mon = mondayIndex(n) === 0;
      if (mon) s += `<line x1="${x + 0.5}" y1="${mid}" x2="${x + 0.5}" y2="${H}" class="th-l"/>`;
      const hol = g.hol.get(n);
      // Today's day number is already shown by the red pill above (n === today) - do not draw it twice.
      if (n !== today) s += `<text x="${x + g.dayW / 2}" y="${mid + 15}" text-anchor="middle" class="th-t${mon ? ' th-b' : ''}${hol ? ' th-hol' : ''}">${dayParts(n).d}</text>`;
      // K11: no native <title> here - the custom #holTip pointer/tap tooltip covers this cell instead.
      if (hol) s += `<rect x="${x}" y="${mid}" width="${g.dayW}" height="${H - mid}" fill="transparent"/>`;
    }
  } else {
    seg(g.start, (n) => firstOfYear(n, 1), 0, mid, (n) => String(dayParts(n).y), 36);
    seg(g.start, (n) => firstOfMonth(n, 1), mid, H, (n) => { const p = dayParts(n); return `${MONTHS[p.m]} ${p.y}`; }, 60);
    // Third line: ISO week number of each week (weeks start on Monday).
    s += `<line x1="0" y1="${H + 0.5}" x2="${g.width}" y2="${H + 0.5}" class="th-l"/>`;
    for (let n = g.start; n <= g.end; n++) {
      if (mondayIndex(n) !== 0) continue;
      const x = g.x(n);
      // K17: centre the label over the week's actual shown width (5 days in work mode, 7 in calendar mode).
      const wkW = g.span(n, n + 7);
      s += `<line x1="${x + 0.5}" y1="${H}" x2="${x + 0.5}" y2="${H + 22}" class="th-l"/>`;
      s += `<text x="${x + wkW / 2}" y="${H + 15}" text-anchor="middle" class="th-t"><title>Week ${isoWeek(n)} · ${dayToDisp(n)} – ${dayToDisp(n + 6)}</title>${isoWeek(n)}</text>`;
    }
    // Holidays: small marks at the bottom of the week line (K11: the custom #holTip
    // tooltip shows date + name on hover/tap - no native <title> here, to avoid doubling it).
    for (const n of g.hol.keys()) {
      if (!g.shown(n)) continue;                 // K17: a weekend holiday has nothing to shade in work mode
      s += `<rect x="${g.x(n)}" y="${H + 17}" width="${Math.max(3, g.dayW)}" height="5" fill="#D55E00"/>`;
    }
  }
  return s;
}

/** ISO 8601 week number of day n (weeks start on Monday; week 1 contains the first Thursday). */
function isoWeek(n) {
  const thursday = n - mondayIndex(n) + 3;
  return Math.floor((thursday - firstOfYear(thursday)) / 7) + 1;
}

/**
 * Background of the timeline body: very light alternating columns (every
 * second day in week view, every second week in month view) and the public
 * holidays that are switched on.
 */
function backgroundInner(g, height) {
  let zebra = '', hol = '';
  let shownIdx = 0;    // K17: running index of shown columns, so the week-zoom stripe alternates per VISIBLE column
  for (let n = g.start; n <= g.end; n++) {
    if (!g.shown(n)) continue;                   // a hidden weekend column has zero width - nothing to draw
    const odd = g.zoom === 'week' ? shownIdx % 2 === 1 : Math.floor((n + 3) / 7) % 2 === 1;  // (n+3)/7 = week count since a Monday
    if (odd) zebra += `M${g.x(n)} 0h${g.dayW}v${height}h${-g.dayW}z`;
    if (g.hol.has(n)) hol += `M${g.x(n)} 0h${g.dayW}v${height}h${-g.dayW}z`;
    shownIdx++;
  }
  return `<path d="${zebra}" class="zb"/><path d="${hol}" class="hol"/>`;
}

/** SVG path of vertical grid lines: thin per day (week view) or per week (month view), strong per week/month. */
function gridPaths(g, height) {
  let thin = '', strong = '';
  for (let n = g.start; n <= g.end + 1; n++) {
    const x = g.x(n) + 0.5;
    if (g.zoom === 'week') {
      if (mondayIndex(n) === 0) strong += `M${x} 0V${height}`; else thin += `M${x} 0V${height}`;
    } else if (dayParts(n).d === 1) strong += `M${x} 0V${height}`;
    else if (mondayIndex(n) === 0) thin += `M${x} 0V${height}`;
  }
  return `<path d="${thin}" class="g1"/><path d="${strong}" class="g2"/>`;
}

/**
 * Orthogonal dependency arrow from (x1,y1) to (x2,y2).
 * d1 = direction in which the line leaves the predecessor (+1 right from its
 * end, -1 left from its start); d2 = direction in which it enters the
 * successor (+1 from the left into its start, -1 from the right into its end).
 */
function arrowPath(x1, y1, d1, x2, y2, d2, rh) {
  const a = x1 + d1 * 8;               // first bend, just outside the predecessor
  const b = x2 - d2 * 8;               // last bend, just before the successor
  if ((d2 > 0 && a <= b) || (d2 < 0 && a >= b)) return `M${x1} ${y1}H${a}V${y2}H${x2}`;
  const ym = y2 > y1 ? y2 - rh / 2 : y2 + rh / 2;   // detour along the row boundary
  return `M${x1} ${y1}H${a}V${ym}H${b}V${y2}H${x2}`;
}

/**
 * SVG content of the timeline body for the given rows: grid, row lines,
 * phase summary bars (phase colour), task bars (one colour, darker part =
 * % complete), milestones (circle; filled when reached) and dependency arrows.
 * `markerId` must be unique per SVG (the print view contains several SVGs).
 */
function timelineBodyInner(rows, g, rh, markerId, num, interactive = true) {
  const H = rows.length * rh;
  // "What next?" highlight (K3): only in the interactive, on-screen SVG - never in print pages.
  const hi = interactive ? k3Highlight : null;
  const dimBar = (id) => (hi && !hi.ids.has(id) ? ' wn-dim' : '');
  let s = `<defs><marker id="${markerId}" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="7" markerHeight="7" orient="auto">` +
    `<path d="M0 0L8 4L0 8z" fill="#4b5563"/></marker></defs>`;
  s += backgroundInner(g, H);
  s += gridPaths(g, H);
  let lines = '';
  for (let i = 1; i <= rows.length; i++) lines += `M0 ${i * rh - 0.5}H${g.width}`;
  s += `<path d="${lines}" class="g1"/>`;
  const pos = new Map();   // task id -> {yc, xs, xe} for the arrows
  let bars = '';
  let top = '';            // arrow tips (drag to re-connect) – above bars
  let hdls = '';           // link handles – topmost
  rows.forEach((r, i) => {
    const y = i * rh;
    if (r.kind === 'phase') {
      const sm = phaseSummary(r.phase);
      if (!sm) return;
      const x = g.x(sm.start), w = Math.max(8, g.span(sm.start, sm.end + 1));
      const bh = Math.max(6, Math.round(rh * 0.22)), by = y + Math.round(rh * 0.34);
      const col = phaseColor(r.phase);
      const tip = `${num.get(r.phase.id)} ${r.phase.name}\n${dayToDisp(sm.start)} – ${dayToDisp(sm.end)} · ${sm.duration} d · ${sm.percent}%`;
      bars += `<g class="bar${dimBar(r.phase.id)}" data-open="${esc(r.phase.id)}"><title>${esc(tip)}</title>` +
        `<rect x="${x - 4}" y="${y}" width="${w + 8}" height="${rh}" fill="transparent"/>` +
        `<rect x="${x}" y="${by}" width="${w}" height="${bh}" fill="${col}" rx="1"/>` +
        `<path d="M${x} ${by + bh}h7l-7 6z M${x + w} ${by + bh}h-7l7 6z" fill="${col}"/></g>`;
      return;
    }
    const t = r.task;
    const s0 = isoToDay(t.start);
    const end = taskEndDay(t);
    if (t.milestone) {
      const cx = g.x(s0) + g.dayW / 2, cy = y + rh / 2, rr = Math.max(5, Math.round(rh * 0.2));
      const tip = `${num.get(t.id)} ${t.name}\nMilestone ${dayToDisp(s0)} · ${t.done ? 'reached' : 'not reached'}`;
      bars += `<g class="bar${dimBar(t.id)}" data-open="${esc(t.id)}"><title>${esc(tip)}</title>` +
        `<rect x="${cx - rh / 2}" y="${y}" width="${rh}" height="${rh}" fill="transparent"/>` +
        `<circle cx="${cx}" cy="${cy}" r="${rr}" class="ms-c ${t.done ? 'ms-done' : 'ms-open'}"/></g>`;
      return;
    }
    const x = g.x(s0);
    const w = Math.max(8, g.span(s0, end + 1));             // K17: shown-days width (a weekend shortens/collapses the bar); minimum 8 px so it stays visible
    const bh = Math.round(rh * 0.56), by = y + Math.round((rh - bh) / 2);
    const pw = (w * t.percent) / 100;
    const tip = `${num.get(t.id)} ${t.name}\n${dayToDisp(s0)} – ${dayToDisp(end)} · ${t.duration} d · ${t.percent}%` +
      (t.person ? `\nOwner: ${t.person}` : '') + (t.deps.length ? `\nPredecessors: ${predText(t, num)}` : '');
    bars += `<g class="bar${dimBar(t.id)}" data-open="${esc(t.id)}"><title>${esc(tip)}</title>` +
      `<rect x="${x - 6}" y="${y}" width="${w + 12}" height="${rh}" fill="transparent"/>` +
      `<rect class="bar-bg" x="${x}" y="${by}" width="${w}" height="${bh}" rx="3"/>` +
      (pw > 0 ? `<rect class="bar-pg" x="${x}" y="${by}" width="${pw}" height="${bh}" rx="3"/>` : '') + `</g>`;
    // Link handles (shown while the mouse is over the bar, see ui-events): drag from here to another bar.
    if (interactive) {
      hdls += `<circle class="hdl" data-id="${esc(t.id)}" data-h="s" cx="${x}" cy="${y + rh / 2}" r="5"><title>Drag onto another task to link from this START</title></circle>` +
        `<circle class="hdl" data-id="${esc(t.id)}" data-h="e" cx="${x + w}" cy="${y + rh / 2}" r="5"><title>Drag onto another task to link from this FINISH</title></circle>`;
    }
    pos.set(t.id, { yc: y + rh / 2, xs: x, xe: x + w });
  });
  let arrows = '';
  for (const r of rows) {
    if (r.kind !== 'task' || r.task.milestone) continue;
    const sp = pos.get(r.task.id);
    if (!sp) continue;
    for (const dep of r.task.deps) {
      const pp = pos.get(dep.pred);
      if (!pp) continue;                   // predecessor hidden (collapsed/filtered/other print page)
      let x1, d1, x2, d2;
      switch (dep.type) {
        case 'SS': x1 = pp.xs; d1 = -1; x2 = sp.xs; d2 = 1; break;
        case 'FF': x1 = pp.xe; d1 = 1; x2 = sp.xe; d2 = -1; break;
        case 'SF': x1 = pp.xs; d1 = -1; x2 = sp.xe; d2 = -1; break;
        default: x1 = pp.xe; d1 = 1; x2 = sp.xs; d2 = 1; // FS
      }
      const path = arrowPath(x1, pp.yc, d1, x2, sp.yc, d2, rh);
      const link = `${esc(r.task.id)}|${esc(dep.pred)}`;
      const dimArrow = hi && !hi.links.has(`${r.task.id}|${dep.pred}`) ? ' wn-dim' : '';
      arrows += `<path class="arrow${dimArrow}" d="${path}" marker-end="url(#${markerId})"/>`;
      if (interactive) {
        // Wide invisible line = click target (opens the link editor); circle at the arrow tip = drag to re-connect.
        arrows += `<path class="arrow-hit" data-link="${link}" d="${path}"><title>${esc(`${num.get(dep.pred)} → ${num.get(r.task.id)} · ${dep.type}${dep.lag ? (dep.lag > 0 ? '+' : '') + dep.lag + 'd' : ''}\nClick to edit · drag the arrow tip to another task`)}</title></path>`;
        top += `<circle class="ahd" data-link="${link}" data-x1="${x1}" data-y1="${pp.yc}" cx="${x2 - d2 * 10}" cy="${sp.yc}" r="5"><title>Drag onto another task to re-connect this link · click to edit</title></circle>`;
      }
    }
  }
  // Add today line (red vertical line at the start of today's column).
  let todayLine = '';
  const today = todayDay();
  if (today >= g.start && today <= g.end) {
    const x = g.x(today) + 0.5;
    todayLine = `<line x1="${x}" y1="0" x2="${x}" y2="${H}" class="today-line"/>`;
  }
  // Order: background, arrows, bars, today line, arrow tips, link handles on top. Tips sit 10 px before the
  // bar edge so they do not collide with the handle on that edge.
  return s + arrows + bars + todayLine + top + hdls;
}

/** The two ↑/↓ buttons of a row. */
function moveBtns(id) {
  return `<button data-k="${esc(id)}|up" data-move="up" title="Move up" aria-label="Move up">&#8593;</button>` +
    `<button data-k="${esc(id)}|down" data-move="down" title="Move down" aria-label="Move down">&#8595;</button>`;
}

/** HTML of one table row (the timeline part of the row is an empty cell under the SVG). */
function rowHTML(r, C, num, g) {
  const tl = `<div class="tlc" style="width:${g.width}px"></div>`;
  const cell = (w, inner, cls = '', extra = '') => `<div class="cell ${cls}" style="width:${w}px${extra}">${inner}</div>`;
  if (r.kind === 'phase') {
    const p = r.phase, id = esc(p.id), sm = phaseSummary(p);
    return `<div class="row phase${ui.selected === p.id ? ' sel' : ''}" data-row="${id}">` +
      cell(C.id, `<button class="idbtn" data-k="${id}|id" data-open="${id}" title="Open details (or double-click the name)">${num.get(p.id)}</button>`, 'sticky', ';left:0') +
      cell(C.name, `<button class="tog" data-k="${id}|tog" data-toggle="${id}" aria-expanded="${!p.collapsed}" title="${p.collapsed ? 'Expand' : 'Collapse'} phase">${p.collapsed ? '&#9656;' : '&#9662;'}</button>` +
        `<input data-k="${id}|name" data-f="name" value="${esc(p.name)}" title="${esc(p.name)}" aria-label="Phase name" autocomplete="off">` +
        itemIconsHTML(p),
        'sticky c-name', `;left:${C.id}px;box-shadow:inset 4px 0 0 ${phaseColor(p)}`) +
      cell(C.act, moveBtns(p.id), 'c-act') +
      cell(C.start, sm ? dayToDisp(sm.start) : '', 'muted') +
      cell(C.end, sm ? dayToDisp(sm.end) : '', 'muted') +
      cell(C.dur, sm ? sm.duration : '', 'num muted') +
      cell(C.pct, sm ? `${sm.percent}%` : '', 'num muted') +
      cell(C.person, '') + cell(C.pred, '') + tl + `</div>`;
  }
  const t = r.task, id = esc(t.id), s0 = isoToDay(t.start), auto = !t.milestone && t.deps.length > 0;
  const input = (f, val, extra = '') => `<input data-k="${id}|${f}" data-f="${f}" value="${esc(val)}" autocomplete="off"${extra}>`;
  const pt = predText(t, num);
  return `<div class="row task${ui.selected === t.id ? ' sel' : ''}" data-row="${id}">` +
    cell(C.id, `<button class="idbtn" data-k="${id}|id" data-open="${id}" title="Open details (or double-click the name)">${num.get(t.id)}</button>`, 'sticky', ';left:0') +
    cell(C.name, input('name', t.name, ` title="${esc(t.name)}" aria-label="${t.milestone ? 'Milestone' : 'Task'} name"`) + itemIconsHTML(t), 'sticky c-name', `;left:${C.id}px`) +
    cell(C.act, moveBtns(t.id), 'c-act') +
    cell(C.start, input('start', dayToDisp(s0), auto
      ? (t.snet
        ? ` class="snet" title="Automatic start, but not earlier than ${dayToDisp(isoToDay(t.snet))} (constraint). Type another date to change it, clear the field to remove it." aria-label="Start (automatic, with constraint)"`
        : ' title="Automatic start from the predecessors. Typing a date sets a “start no earlier than” constraint." aria-label="Start (automatic)"')
      : ' title="Start date (DD.MM.YYYY)" aria-label="Start date"')) +
    cell(C.end, t.milestone ? '<span class="muted">—</span>' : input('end', dayToDisp(taskEndDay(t)), ' title="End date (DD.MM.YYYY)" aria-label="End date"')) +
    cell(C.dur, t.milestone ? '<span class="muted">0</span>' : input('dur', t.duration, ' inputmode="numeric" aria-label="Duration in days"'), 'num') +
    cell(C.pct, t.milestone
      ? `<label class="cbx" title="Milestone reached"><input type="checkbox" data-k="${id}|done" data-f="done"${t.done ? ' checked' : ''} aria-label="Milestone reached"></label>`
      : input('pct', t.percent, ' inputmode="numeric" aria-label="Percent complete"'), 'num') +
    cell(C.person, input('person', t.person, ' aria-label="Owner"')) +
    cell(C.pred, t.milestone ? '<span class="muted">—</span>'
      : `<button class="predbtn${pt ? '' : ' none'}" data-k="${id}|pred" data-open="${id}" data-deps="1" title="${esc(pt || 'Add a predecessor')}">${esc(pt || '+ add')}</button>`) +
    tl + `</div>`;
}

/**
 * Full re-render of the sheet. Keeps scroll position and keyboard focus,
 * so editing with Tab from field to field keeps working.
 */
function render() {
  const sc = $('#scroller'), sheet = $('#sheet');
  const sl = sc.scrollLeft, st = sc.scrollTop;
  const ae = document.activeElement;
  let focusKey = pendingFocus;
  const selectText = !!pendingFocus;
  if (!focusKey && ae && sheet.contains(ae)) focusKey = ae.dataset.k || null;
  pendingFocus = null;

  const C = colDefs(), rh = rowHeight(), g = timelineGeom(), rows = visibleRows(), num = numbering();
  const leftW = C.id + C.name + C.act + C.start + C.end + C.dur + C.pct + C.person + C.pred;
  const stickyW = C.id + C.name;
  const totalW = leftW + g.width;
  lastLayout = { g, C, leftW, stickyW, rh };

  const hc = (w, label, cls = '', extra = '') => `<div class="cell ${cls}" style="width:${w}px${extra}">${label}</div>`;
  let html = `<div class="hdr" style="width:${totalW}px;height:${g.hdrH}px">` +
    hc(C.id, '#', 'sticky', ';left:0') + hc(C.name, 'Name', 'sticky c-name', `;left:${C.id}px`) +
    hc(C.act, 'Move', 'c-act') + hc(C.start, 'Start') + hc(C.end, 'End') + hc(C.dur, 'Days', 'num') +
    hc(C.pct, '%', 'num') + hc(C.person, 'Owner') + hc(C.pred, 'Predecessors') +
    `<div class="tlh" style="width:${g.width}px;height:${g.hdrH}px"><svg width="${g.width}" height="${g.hdrH}">${timelineHeaderInner(g)}</svg></div></div>`;
  html += `<div class="body" style="width:${totalW}px;height:${rows.length * rh}px">` +
    `<svg class="tl" style="left:${leftW}px" width="${g.width}" height="${rows.length * rh}">${timelineBodyInner(rows, g, rh, 'arrowhead', num)}</svg>` +
    rows.map((r) => rowHTML(r, C, num, g)).join('') + `</div>`;
  if (!rows.length) {
    html += ui.filter.trim()
      ? `<div class="empty">No task or phase matches “${esc(ui.filter.trim())}”.</div>`
      : `<div class="empty">No phases or tasks yet. Use <b>+ Phase</b> or <b>+ Task</b> to start, or Menu → <b>Open project</b>.</div>`;
  }
  sheet.style.width = `${totalW}px`;
  sheet.innerHTML = html;
  sc.scrollLeft = sl;
  sc.scrollTop = st;
  if (focusKey) {
    const el = sheet.querySelector(`[data-k="${CSS.escape(focusKey)}"]`);
    if (el) {
      el.focus({ preventScroll: !selectText });
      if (selectText && typeof el.select === 'function') el.select();
    }
  }
  // Apply today line blink if requested (after a render triggered by scrolling).
  if (applyTodayBlink) {
    applyTodayBlink = false;
    requestAnimationFrame(() => {
      const line = $('svg.tl .today-line');
      if (line) {
        line.classList.remove('blink');
        void line.offsetWidth;  // Force reflow
        line.classList.add('blink');
      }
    });
  }
  updateToolbar();
}
</script>

<!-- ======================================================================
     7. UI PRINT: A4 landscape pages
     ====================================================================== -->
<script id="ui-print">
'use strict';
/*
 * Browsers cannot split a wide element across several pages by themselves,
 * so the pages are built here: the chart (as currently shown: zoom, collapsed
 * phases and search are respected) is cut into page-sized pieces, first
 * top-to-bottom by rows, then left-to-right by time. Every page repeats the
 * task table on the left and has a header (project, print date, page x of y)
 * and a footer describing which rows and dates it contains.
 * Page = A4 landscape minus 10 mm margins = 277 x 190 mm ≈ 1046 x 716 px.
 */
function buildPrint() {
  const area = $('#printArea');
  const rows = visibleRows(), num = numbering(), g = timelineGeom();
  const PW = 1046, PH = 716, RH = 22, HH = g.hdrH, TOP = 30, BOT = 20;
  const cols = [{ w: 40, t: '#' }, { w: 196, t: 'Name' }, { w: 80, t: 'Start' }, { w: 80, t: 'End' }, { w: 38, t: 'Days' }];
  const LW = cols.reduce((a, c) => a + c.w, 0);
  const TW = PW - LW - 1;
  const perPage = Math.max(1, Math.floor((PH - TOP - BOT - HH - 4) / RH));
  const rowChunks = Math.max(1, Math.ceil(rows.length / perPage));
  const colChunks = Math.max(1, Math.ceil(g.width / TW));
  const total = rowChunks * colChunks;
  const printed = dayToDisp(todayDay());
  const head = timelineHeaderInner(g);

  /** Left table for a slice of rows. */
  const left = (slice) => {
    let s = `<div class="prw hd" style="height:${HH}px">${cols.map((c) => `<div style="width:${c.w}px">${c.t}</div>`).join('')}</div>`;
    for (const r of slice) {
      let vals, cls = '', stripe = '';
      if (r.kind === 'phase') {
        const sm = phaseSummary(r.phase);
        vals = [num.get(r.phase.id), r.phase.name, sm ? dayToDisp(sm.start) : '', sm ? dayToDisp(sm.end) : '', sm ? sm.duration : ''];
        cls = ' phase';
        stripe = `box-shadow:inset 3px 0 0 ${phaseColor(r.phase)};`;
      } else {
        const t = r.task;
        vals = [num.get(t.id), t.name, dayToDisp(isoToDay(t.start)), t.milestone ? '—' : dayToDisp(taskEndDay(t)), t.milestone ? '0' : t.duration];
      }
      s += `<div class="prw${cls}" style="height:${RH}px">` + vals.map((v, i) =>
        `<div style="width:${cols[i].w}px;${i === 0 ? stripe : ''}${i === 1 && r.kind === 'task' ? 'padding-left:14px;' : ''}${i === 4 ? 'text-align:right;' : ''}">${esc(v)}</div>`).join('') + `</div>`;
    }
    return s;
  };

  let html = '', k = 0;
  for (let rc = 0; rc < rowChunks; rc++) {
    const slice = rows.slice(rc * perPage, (rc + 1) * perPage);
    const leftHtml = left(slice);
    for (let cc = 0; cc < colChunks; cc++) {
      k++;
      const x0 = cc * TW, w = Math.min(TW, g.width - x0), bh = Math.max(1, slice.length * RH);
      const d0 = g.dayAt(x0);                                       // K17: non-linear inverse (skips hidden weekends in work mode)
      const d1 = g.dayAt(Math.max(x0, x0 + w - 1));
      html += `<section class="page">
        <header class="ph"><b>${esc(state.name)}</b><span>Printed ${printed}</span><span>Page ${k} of ${total}</span></header>
        <div class="pb">
          <div class="pl" style="width:${LW}px">${leftHtml}</div>
          <div class="pt" style="width:${w}px">
            <svg width="${w}" height="${HH}" viewBox="${x0} 0 ${w} ${HH}">${head}</svg>
            <svg width="${w}" height="${bh}" viewBox="${x0} 0 ${w} ${bh}">${timelineBodyInner(slice, g, RH, `pa${k}`, num, false)}</svg>
          </div>
        </div>
        <footer class="pf">Rows ${slice.length ? rc * perPage + 1 : 0}–${rc * perPage + slice.length} of ${rows.length} · timeline part ${cc + 1} of ${colChunks} (${dayToDisp(d0)} – ${dayToDisp(d1)}) · Gantt Chart Planner</footer>
      </section>`;
    }
  }
  area.innerHTML = html;
}

/** Menu → Print / PDF. The browser's print dialog also offers "Save as PDF". */
function doPrint() {
  buildPrint();
  window.print();
}
// Ctrl+P / browser menu printing: build the pages just before printing, clean up afterwards.
window.addEventListener('beforeprint', buildPrint);
window.addEventListener('afterprint', () => { $('#printArea').innerHTML = ''; });
</script>

<!-- ======================================================================
     7b. SNAPSHOT: stand-alone SVG -> PNG image of one task/milestone/phase
     (used by the attachments feature, K5, to create "_snapshot_....png";
     this block only builds the image - it never touches files or dialogs)
     ====================================================================== -->
<script id="snapshot">
'use strict';
/*
 * The snapshot is a small, self-contained picture (header text + a mini
 * Gantt of the item and its neighbours) that other code can save as a real
 * PNG file. It must draw correctly with nothing but the SVG string itself
 * (no external stylesheet, no <foreignObject>, no network access), because
 * it is later rasterised through an <img>/<canvas> - a stylesheet from the
 * main page would not apply there, and Safari taints the canvas on anything
 * it treats as "external" content. So every class used by the reused
 * ui-render helpers (timelineHeaderInner, timelineBodyInner, ...) gets its
 * rule duplicated in a small inline <style> element inside the SVG itself.
 */

/** Inline copy of the ui-render SVG classes this snapshot reuses (colours copied from :root). */
const SNAPSHOT_STYLE =
  '.g1{stroke:#eceff3;stroke-width:1;fill:none}' +
  '.g2{stroke:#c9d0d8;stroke-width:1;fill:none}' +
  '.th-l{stroke:#d9dee4;stroke-width:1}' +
  '.th-t{font-size:11px;fill:#5f6b7a}' +
  '.th-b{font-weight:700;fill:#1f2328}' +
  '.th-hol{fill:#b42318;font-weight:700}' +
  '.bar-bg{fill:#a9b5c6}' +
  '.bar-pg{fill:#3e5068}' +
  '.ms-c{stroke:#1f2328;stroke-width:3}' +
  '.ms-open{fill:#fff}' +
  '.ms-done{fill:#1f2328}' +
  '.arrow{stroke:#4b5563;stroke-width:1.25;fill:none}' +
  '.zb{fill:#000;fill-opacity:.022}' +
  '.hol{fill:#D55E00;fill-opacity:.10}' +
  '.today-line{stroke:#d00;stroke-width:2}' +
  '.today-label-bg{fill:#d00}' +
  '.today-label{fill:#fff;font-weight:700;font-size:10px;text-anchor:middle}' +
  'text{font-family:system-ui, Arial, sans-serif}';

/** Column layout of the mini table on the left of the snapshot's Gantt part. */
/* Start/Finish are wide enough for a bold "14.09.2026" (10 chars at a generous 8.5 px/char + padding). */
const SNAP_COLS = [{ w: 36, t: '#' }, { w: 190, t: 'Name' }, { w: 100, t: 'Start' }, { w: 100, t: 'Finish' }];
/** Row height of the mini Gantt (a bit tighter than the on-screen 32/45 px so more rows fit). */
const SNAP_RH = 26;

/** Current time as "HH:MM" (24h, local time - the snapshot is a human-readable note, not stored data). */
function snapshotTimeNow() {
  const d = new Date();
  return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

/** Cuts long free text to `max` characters (with an ellipsis) so it cannot overflow a fixed-width column. */
function snapshotClip(s, max) {
  s = String(s ?? '');
  return s.length > max ? s.slice(0, max - 1) + '…' : s;
}

/** Full, unfiltered, uncollapsed row list in display order (unlike visibleRows(), used on screen). */
function snapshotAllRows() {
  const rows = [];
  for (const p of state.phases) {
    rows.push({ kind: 'phase', phase: p });
    for (const t of p.tasks) rows.push({ kind: 'task', task: t, phase: p });
  }
  return rows;
}

/**
 * Timeline geometry for the snapshot: always covers `s0..e0` (the item's own
 * span) plus 14 days on each side. Week-style (day-level) rendering is used
 * whenever it still fits into the target width; very long spans (a phase of
 * several months) fall back to the month-style rendering also used by the
 * app's month zoom, so the day columns never get too thin to read.
 */
function snapshotGeom(s0, e0) {
  const start = s0 - 14, end = e0 + 14;
  const days = Math.max(1, end - start + 1);
  const TARGET_W = 980;
  let zoom = 'week', dayW = Math.min(34, Math.max(10, TARGET_W / days));
  if (dayW <= 10 && days > 90) { zoom = 'month'; dayW = 5; }
  const width = Math.round(days * dayW);
  const x = (n) => (n - start) * dayW;
  // Always calendar mode (K17): every day is "shown" and x() is already linear,
  // so these mirror timelineGeom()'s API for the render functions shared with it.
  return {
    zoom, days: 'calendar', start, end, dayW, width, x,
    shown: () => true,
    dayAt: (px) => Math.min(end, Math.max(start, start + Math.floor(px / dayW))),
    span: (a, bExclusive) => x(bExclusive) - x(a),
    hdrH: zoom === 'month' ? 66 : 44, hol: holidayIndex(start, end),
  };
}

/**
 * Weekend shading behind the grid (drawn in addition to what timelineBodyInner
 * already draws itself - zebra banding and, via the same ".hol" class now
 * declared in SNAPSHOT_STYLE, public holidays - so it is not repeated here).
 */
function snapshotBackground(g, height) {
  let wknd = '';
  for (let n = g.start; n <= g.end; n++) {
    if (mondayIndex(n) >= 5) wknd += `M${g.x(n)} 0h${g.dayW}v${height}h${-g.dayW}z`;
  }
  return `<path d="${wknd}" fill="#000" fill-opacity=".05"/>`;
}

/** The "#, Name, Start, Finish" table on the left of the mini Gantt, as plain SVG text (no HTML/foreignObject allowed here). */
function snapshotLeftTable(rows, num, hdrH, rh) {
  const totalW = SNAP_COLS.reduce((a, c) => a + c.w, 0);
  let s = `<rect x="0" y="0" width="${totalW}" height="${hdrH}" fill="#f5f7f9"/>`;
  let x = 0;
  for (const c of SNAP_COLS) {
    s += `<text x="${x + 6}" y="${hdrH - 10}" font-size="11" font-weight="700" fill="#1f2328">${esc(c.t)}</text>`;
    x += c.w;
  }
  s += `<line x1="0" y1="${hdrH - 0.5}" x2="${totalW}" y2="${hdrH - 0.5}" stroke="#d9dee4"/>`;
  rows.forEach((r, i) => {
    const y = hdrH + i * rh;
    let vals, indent = false;
    if (r.kind === 'phase') {
      const sm = phaseSummary(r.phase);
      vals = [num.get(r.phase.id), r.phase.name, sm ? dayToDisp(sm.start) : '', sm ? dayToDisp(sm.end) : ''];
    } else {
      const t = r.task;
      vals = [num.get(t.id), t.name, dayToDisp(isoToDay(t.start)), t.milestone ? '—' : dayToDisp(taskEndDay(t))];
      indent = true;
    }
    let cx = 0;
    vals.forEach((v, ci) => {
      const pad = ci === 1 && indent ? 16 : 6;
      const max = ci === 1 ? 28 : 10;
      s += `<text x="${cx + pad}" y="${y + rh - 8}" font-size="11.5"${r.kind === 'phase' ? ' font-weight="700"' : ''} fill="#1f2328">${esc(snapshotClip(v, max))}</text>`;
      cx += SNAP_COLS[ci].w;
    });
    s += `<line x1="0" y1="${y + rh - 0.5}" x2="${totalW}" y2="${y + rh - 0.5}" stroke="#eceff3"/>`;
  });
  return s;
}

/** Header info lines for the snapshot: what the item is, its dates, progress, owner and predecessors. */
function snapshotInfoLines(kind, item, num) {
  const lines = [];
  if (kind === 'task') {
    const t = item.task;
    const label = t.milestone ? 'Milestone' : 'Task';
    lines.push(`${num.get(t.id)} ${snapshotClip(t.name, 70)} · ${label}`);
    if (t.milestone) {
      lines.push(`Date: ${dayToDisp(isoToDay(t.start))} · ${t.done ? 'Reached' : 'Not reached'}`);
    } else {
      lines.push(`Start – Finish: ${dayToDisp(isoToDay(t.start))} – ${dayToDisp(taskEndDay(t))}`);
      lines.push(`Duration: ${t.duration} day${t.duration === 1 ? '' : 's'} · ${t.percent}% complete`);
    }
    if (t.person) lines.push(`Owner: ${t.person}`);
    lines.push(`Predecessors: ${t.deps.length ? predText(t, num) : 'none'}`);
  } else {
    const p = item.phase, sm = phaseSummary(p);
    lines.push(`${num.get(p.id)} ${snapshotClip(p.name, 70)} · Phase`);
    if (sm) {
      lines.push(`Start – Finish: ${dayToDisp(sm.start)} – ${dayToDisp(sm.end)}`);
      lines.push(`Duration: ${sm.duration} day${sm.duration === 1 ? '' : 's'} · ${sm.percent}% complete`);
    } else {
      lines.push('No tasks yet.');
    }
  }
  return lines;
}

/**
 * Builds the snapshot as {svg, width, height}, or null when the task/phase
 * no longer exists. `kind` is 'task' or 'phase', `id` its id.
 */
function buildSnapshotDoc(kind, id) {
  const item = kind === 'task' ? findTask(id) : kind === 'phase' ? findPhase(id) : null;
  if (!item) return null;
  const num = numbering();
  const rowsAll = snapshotAllRows();
  const targetIdx = rowsAll.findIndex((r) => (r.kind === 'task' ? r.task.id : r.phase.id) === id);
  if (targetIdx < 0) return null;

  // The item's own date span (a milestone spans a single day; an empty phase falls back to today).
  let s0, e0;
  if (kind === 'task') {
    s0 = isoToDay(item.task.start);
    e0 = taskEndDay(item.task);
  } else {
    const sm = phaseSummary(item.phase);
    s0 = sm ? sm.start : todayDay();
    e0 = sm ? sm.end : todayDay();
  }

  const lo = Math.max(0, targetIdx - 5), hi = Math.min(rowsAll.length - 1, targetIdx + 5);
  const rows = rowsAll.slice(lo, hi + 1);
  const hlIdx = targetIdx - lo;

  const g = snapshotGeom(s0, e0);
  const leftW = SNAP_COLS.reduce((a, c) => a + c.w, 0);
  const bodyH = rows.length * SNAP_RH;
  const tableH = g.hdrH + bodyH;
  const tableW = leftW + g.width;

  const infoLines = snapshotInfoLines(kind, item, num);
  const MARGIN = 16, TITLE_H = 26, LINE_H = 19, GAP = 14;
  const infoH = TITLE_H + infoLines.length * LINE_H + 6;
  const width = MARGIN * 2 + tableW;
  const height = MARGIN * 2 + infoH + GAP + tableH;

  let infoSvg = `<text x="0" y="18" font-size="18" font-weight="700" fill="#1f2328">${esc(snapshotClip(state.name, 70))}</text>` +
    `<text x="0" y="${TITLE_H + 13}" font-size="12" fill="#5f6b7a">Snapshot created ${dayToDisp(todayDay())} ${snapshotTimeNow()}</text>`;
  infoLines.forEach((l, i) => {
    infoSvg += `<text x="0" y="${TITLE_H + LINE_H + 13 + i * LINE_H}" font-size="13" fill="#1f2328">${esc(l)}</text>`;
  });

  const hlBand = `<rect x="0" y="${g.hdrH + hlIdx * SNAP_RH}" width="${tableW}" height="${SNAP_RH}" fill="#ffe066" fill-opacity=".55"/>`;
  let phaseBands = '';
  rows.forEach((r, i) => {
    if (i !== hlIdx && r.kind === 'phase') phaseBands += `<rect x="0" y="${g.hdrH + i * SNAP_RH}" width="${tableW}" height="${SNAP_RH}" fill="#f7f8fa"/>`;
  });

  const tableSvg = `<rect x="0" y="0" width="${tableW}" height="${tableH}" fill="#fff" stroke="#d9dee4"/>` +
    phaseBands + hlBand +
    snapshotLeftTable(rows, num, g.hdrH, SNAP_RH) +
    `<line x1="${leftW - 0.5}" y1="0" x2="${leftW - 0.5}" y2="${tableH}" stroke="#d9dee4"/>` +
    `<g transform="translate(${leftW},0)">` +
    `<svg x="0" y="0" width="${g.width}" height="${g.hdrH}" overflow="hidden">${timelineHeaderInner(g)}</svg>` +
    `<svg x="0" y="${g.hdrH}" width="${g.width}" height="${bodyH}" overflow="hidden">${snapshotBackground(g, bodyH)}${timelineBodyInner(rows, g, SNAP_RH, 'snapmk', num, false)}</svg>` +
    `</g>`;

  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">` +
    `<style>${SNAPSHOT_STYLE}</style>` +
    `<rect x="0" y="0" width="${width}" height="${height}" fill="#fff"/>` +
    `<g transform="translate(${MARGIN},${MARGIN})">${infoSvg}` +
    `<g transform="translate(0,${infoH + GAP})">${tableSvg}</g>` +
    `</g></svg>`;

}

/** SVG string of the snapshot for `kind`/`id` (exposed mainly for testing). null if the item does not exist. */
function buildSnapshotSVG(kind, id) {
  const doc = buildSnapshotDoc(kind, id);
  return doc ? doc.svg : null;
}

/**
 * Renders the snapshot to a PNG Blob: SVG -> <img> (via a data: URL, the
 * safest route in Safari - object URLs and Blob-URL images can taint the
 * canvas there) -> <canvas> -> `toBlob`. Rejects if the item is gone or the
 * browser refuses to decode the SVG.
 */
async function buildSnapshotPNG(kind, id) {
  const doc = buildSnapshotDoc(kind, id);
  if (!doc) throw new Error(`Snapshot: ${kind} "${id}" not found.`);
  const dataUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(doc.svg);
  const img = new Image();
  await new Promise((resolve, reject) => {
    img.onload = () => resolve();
    img.onerror = () => reject(new Error('Could not render the snapshot image.'));
    img.src = dataUrl;
  });
  // Render at 2x for crisper text, unless that would make an unreasonably large PNG.
  const scale = doc.width * doc.height <= 1600 * 1600 ? 2 : 1;
  const canvas = document.createElement('canvas');
  canvas.width = doc.width * scale;
  canvas.height = doc.height * scale;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.scale(scale, scale);
  ctx.drawImage(img, 0, 0, doc.width, doc.height);
  return await new Promise((resolve, reject) => {
    canvas.toBlob((blob) => (blob ? resolve(blob) : reject(new Error('Could not create the PNG file.'))), 'image/png');
  });
}

/**
 * File name for a new snapshot: "_snapshot_YYYY-MM-DD.png", or with "_HHMM"
 * appended when a same-day snapshot already exists (`existingNames`: an
 * array or a Set of names already used by the item's attachments/snapshots).
 */
function snapshotFileName(existingNames) {
  const used = existingNames instanceof Set ? existingNames : new Set(existingNames || []);
  const base = `_snapshot_${dayToIso(todayDay())}.png`;
  if (!used.has(base)) return base;
  const d = new Date();
  const hhmm = `${String(d.getHours()).padStart(2, '0')}${String(d.getMinutes()).padStart(2, '0')}`;
  return `_snapshot_${dayToIso(todayDay())}_${hhmm}.png`;
}

<!-- ======================================================================
     7c. ATTACHMENTS (K5, mode C - files live only in a folder on disk)
     Two ways of getting files onto disk, chosen once per session by feature
     detection:
       - "handle mode" (Chrome/Edge): window.showDirectoryPicker gives a
         FileSystemDirectoryHandle for the project folder, kept in memory
         only (never saved). Files are copied there directly.
       - "manual mode" (Safari/Firefox): there is no way to write to an
         arbitrary folder, so the app only records the intended path and
         asks the user to move the file(s) there by hand.
     Either way, only the small {name, path, added} entry (and the once-only
     "folder"/"attachRoot") is ever written into the project - never file
     contents - so a normal JSON export/import round-trips attachments
     exactly like any other field.
     ====================================================================== -->
<script id="attachments">
'use strict';

/** In-memory-only attachment state (never saved: a fresh session always starts empty). */
const attachState = {
  dirHandle: null,        // FileSystemDirectoryHandle of the project folder, handle mode only
  missing: new Set(),     // `${itemId}::${path}` of attachments the last "Open" could not find on disk
  busy: false,            // K9: module-wide lock - shared by every attachment action of every open dialog
  recent: [],             // K9: { path, name, size, time } of files added in roughly the last 10 s (de-dup)
  downloadHint: false,    // K10: the one-time "the file was downloaded" hint has already been shown this session
};

/** K9: how long a just-added file is remembered for the "add again?" de-dup check. */
const DEDUP_WINDOW_MS = 10000;

/** True when this browser can read/write real files on disk (Chrome/Edge); false = manual mode (Safari/Firefox). */
function hasFileSystemAccess() { return typeof window.showDirectoryPicker === 'function'; }

/**
 * Turns free text into a safe folder/file-name component (format 1.2 "safe()"):
 * the characters Windows/macOS forbid (and control characters) become "_",
 * leading/trailing spaces and dots are trimmed, the result is capped at 80
 * characters, and a Windows-reserved device name (CON, PRN, AUX, NUL,
 * COM1-9, LPT1-9 - even with an extension, e.g. "con.txt") gets "_"
 * appended to its base name. Never returns an empty string.
 */
function safeName(s) {
  let out = String(s || '').replace(/[\\/:*?"<>|\x00-\x1f]/g, '_');
  out = out.replace(/^[\s.]+|[\s.]+$/g, '').slice(0, 80);
  out = out.replace(/^[\s.]+|[\s.]+$/g, '');
  if (!out) return 'item';
  const dot = out.indexOf('.');
  const base = dot >= 0 ? out.slice(0, dot) : out;
  if (RESERVED_WIN_NAMES.test(base)) out = dot >= 0 ? `${base}_${out.slice(dot)}` : `${out}_`;
  return out;
}

/** Pure: the project's attachRoot, or what it would be if not yet set (format 1.2). Never touches state. */
function peekAttachRoot() {
  return state.attachRoot || `${safeName(state.name)}_Attachments`;
}

/** True when some OTHER phase or task already has folder === "`rootVal`/`sub`". */
function folderNameTaken(sub, rootVal) {
  const full = `${rootVal}/${sub}`;
  for (const p of state.phases) {
    if (p.folder === full) return true;
    for (const t of p.tasks) if (t.folder === full) return true;
  }
  return false;
}

/**
 * Pure: the folder a task/phase already has, or the one it would get if
 * assigned right now (format 1.2: the item's CURRENT number + " " + safe(name),
 * unique among every phase and task's folder already in `state`). Never
 * touches state, so it can be computed before an async picker/disk operation
 * and safely recomputed later - if an undo removed a folder assignment and
 * nothing else has taken its place, the same name comes out again. Returns
 * null if the item no longer exists.
 */
function peekItemFolder(kind, id) {
  const loc = kind === 'task' ? findTask(id) : findPhase(id);
  if (!loc) return null;
  const item = kind === 'task' ? loc.task : loc.phase;
  if (item.folder) return item.folder;
  const rootVal = peekAttachRoot();
  const num = numbering();
  const base = `${num.get(id)} ${safeName(item.name)}`;
  let sub = base, n = 2;
  while (folderNameTaken(sub, rootVal)) sub = `${base} (${n++})`;
  return `${rootVal}/${sub}`;
}

/**
 * Assigns the project's attachment root folder once, as its own undo step.
 * A no-op (no commit) once it is already set. Used only by "Update snapshot"
 * (which has no attachment-list commit of its own to fold this into) -
 * "Add file..." instead uses `peekAttachRoot`/`peekItemFolder` and folds
 * everything into ONE commit, so a whole "Add file..." action is exactly one
 * undo step (the undo budget is only 10 steps).
 */
function ensureAttachRoot() {
  if (state.attachRoot) return state.attachRoot;
  const val = peekAttachRoot();
  commit(() => { if (!state.attachRoot) state.attachRoot = val; });
  return state.attachRoot || val;
}

/**
 * Assigns a task's or phase's attachment subfolder once (never renamed
 * afterwards even if the item is later renamed, renumbered or moved to
 * another phase), as its own undo step. A no-op (no commit) once the item
 * already has a folder. Used only by "Update snapshot" - see `ensureAttachRoot`.
 * Returns the full path (attachRoot/subfolder), or null if the item no
 * longer exists.
 */
function ensureItemFolder(kind, id) {
  const loc = kind === 'task' ? findTask(id) : findPhase(id);
  if (!loc) return null;
  const item = kind === 'task' ? loc.task : loc.phase;
  if (item.folder) return item.folder;
  const folder = peekItemFolder(kind, id);
  ensureAttachRoot();
  commit(() => { if (!item.folder) item.folder = folder; });
  return item.folder;
}

/** Appends " (2)", " (3)", ... before the extension until `name` is not in `existing` (a Set). */
function uniqueFileName(name, existing) {
  if (!existing.has(name)) return name;
  const dot = name.lastIndexOf('.');
  const base = dot > 0 ? name.slice(0, dot) : name;
  const ext = dot > 0 ? name.slice(dot) : '';
  let n = 2, candidate;
  do { candidate = `${base} (${n++})${ext}`; } while (existing.has(candidate));
  return candidate;
}

/** URL-encodes a relative path segment by segment, so "#"/"?"/spaces in file names still work in an <a href>. */
function encodeRelPath(path) {
  return path.split('/').map(encodeURIComponent).join('/');
}

/**
 * K9 de-duplication: records that `name`/`size` was just added at `path`, so a
 * second copy picked moments later can be recognised. Prunes anything older
 * than `DEDUP_WINDOW_MS` on every call, so the list never grows unbounded.
 */
function noteRecentAdd(path, name, size) {
  const now = Date.now();
  attachState.recent = attachState.recent.filter((r) => now - r.time < DEDUP_WINDOW_MS);
  attachState.recent.push({ path, name, size, time: now });
}

/**
 * K9: filters the files an "Add file..." picker returned, right before they
 * are written/recorded. A file is a likely accidental repeat only when BOTH
 * are true: the item already has an attachment at the exact path this file
 * would get (before any " (2)" collision suffix), and a file with the same
 * name+size was added (to that same path) in the last `DEDUP_WINDOW_MS` - the
 * signature of the double-invocation bug this step fixes, or of the user
 * genuinely picking the same file twice. Those get a `confirmBox`; declining
 * drops just that file (the rest of the batch is unaffected). A different
 * file that merely shares a name still goes through untouched - it gets its
 * " (2)" suffix as before, no confirmation needed.
 */
async function filterDuplicateFiles(existingAttachments, folderPath, files) {
  const now = Date.now();
  const recent = attachState.recent.filter((r) => now - r.time < DEDUP_WINDOW_MS);
  const out = [];
  for (const file of files) {
    const targetPath = `${folderPath}/${file.name}`;
    const alreadyListed = existingAttachments.some((a) => a.path === targetPath);
    const seenRecently = recent.some((r) => r.path === targetPath && r.name === file.name && r.size === file.size);
    if (alreadyListed && seenRecently) {
      const again = await confirmBox('Add again?',
        `<p><b>${esc(file.name)}</b> was already added moments ago.</p><p class="hint">Add it again as a separate copy?</p>`,
        'Add again');
      if (!again) continue;
    }
    out.push(file);
  }
  return out;
}

/** File extensions (lower-case, no dot) K10 opens INLINE in a new tab; everything else downloads instead. */
const INLINE_ATTACHMENT_EXTS = new Set(['pdf', 'png', 'jpg', 'jpeg', 'gif', 'webp', 'bmp', 'txt', 'csv', 'log']);
/** Of the inline extensions, the ones treated as plain text (K10: forced to text/plain so they render, never execute). */
const TEXT_ATTACHMENT_EXTS = new Set(['txt', 'csv', 'log']);
/** Best-guess MIME type for the inline extensions (used for the Blob URL; the disk file's own type is ignored). */
const INLINE_ATTACHMENT_MIME = {
  pdf: 'application/pdf', png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg',
  gif: 'image/gif', webp: 'image/webp', bmp: 'image/bmp',
};

/** Lower-case extension of a file name, without the dot ('' if none). */
function fileExt(name) {
  const dot = String(name || '').lastIndexOf('.');
  return dot >= 0 ? name.slice(dot + 1).toLowerCase() : '';
}

/**
 * K10: true when `name` should open INLINE in a new tab; false when it must
 * be downloaded instead so the OS hands it to the associated program (Word,
 * Outlook, ...) rather than the browser trying to render it. html/htm/svg/xml
 * are deliberately never inline (they could execute script if displayed as
 * a page instead of downloaded), even though that is already the default for
 * extensions outside the inline allow-list.

function isInlineAttachment(name) {
  const ext = fileExt(name);
  return INLINE_ATTACHMENT_EXTS.has(ext) && ext !== 'html' && ext !== 'htm' && ext !== 'svg' && ext !== 'xml';
}

/** Shows the one-time "file was downloaded" hint (K10), once per session. */
async function showDownloadHintOnce() {
  if (attachState.downloadHint) return;
  attachState.downloadHint = true;
  await showMessage('File downloaded',
    "<p>The file was downloaded. Open it from your browser's download list – it opens in the program your computer uses for this file type (e.g. Outlook for .msg).</p>");
}

/** Offers a Blob as a file download (manual mode: snapshots and, indirectly, the user's own files never need this). */
function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);

/**
 * K9: the still-unsettled `pickFilesViaInput()` call, if any - a module-level
 * (not per-call) reference, so a NEW call can settle a previous one that is
 * still waiting rather than leaving it dangling with live listeners on the
 * shared `#attachFileInput`.
 */
let pendingFilePick = null;

/**
 * Lets the user choose one or more files via the hidden, SHARED

 * showOpenFilePicker is not available). Resolves to [] when the user cancels.
 *
 * K9 root-cause fix: Safari never fires the 'cancel' event on this input, so
 * a plain 'change'/'cancel' pair alone left the promise pending forever after
 * a Cancel in the OS picker - AND left its 'change' listener attached to the
 * one shared input. The next, unrelated "Add file..." call then added its
 * OWN listener on top without removing the old one; when a file was finally
 * picked, the single 'change' event fired BOTH listeners, resolving the old,
 * abandoned call and the new one with the very same files, and each caller
 * (attachAddFilesHandle/Manual) went on to add/commit its own copy - exactly
 * the duplicate-entry bug reported by users. Fixed two ways: (1) a 'focus'
 * fallback settles a call as cancelled if the window regains focus and no
 * file arrived after a grace period (covers the missing 'cancel' event), so
 * a call never hangs indefinitely; (2) a new call always settles-and-cleans-up

 * ever attached to the shared input.
 *
 * The grace period itself is staggered (an immediate check, then up to
 * ~1500 ms total) because `inp.files` can already be populated the moment
 * focus returns (picked normally) OR - on a slow corporate network drive or
 * with a large file - `change` can still be a second or more away even
 * though focus already returned; only genuinely empty for the whole 1500 ms
 * is treated as a cancel. `done()`'s own `settled` guard means whichever of
 * `change`/a focus check/the other's supersede-cleanup fires first wins and
 * every later one is a no-op, so a late `change` can never add the file a
 * second time on top of what a focus check already resolved.
 */
function pickFilesViaInput() {
  return new Promise((resolve) => {
    if (pendingFilePick) pendingFilePick([]);   // settle+clean up a stale call before adding new listeners
    const inp = $('#attachFileInput');
    inp.value = '';
    let settled = false;
    const done = (files) => {
      if (settled) return;
      settled = true;
      inp.removeEventListener('change', onChange);
      inp.removeEventListener('cancel', onCancel);
      window.removeEventListener('focus', onFocus);
      if (pendingFilePick === done) pendingFilePick = null;
      resolve(files);

    const onChange = () => done(Array.from(inp.files || []));
    const onCancel = () => done([]);
    // Safari/older WebKit fallback for the missing 'cancel' event: once the
    // window regains focus (the OS picker closed, one way or another), check
    // for files already present, then re-check after a grace period before
    // giving up - a real pick on a slow drive/large file must not be lost.
    const onFocus = () => {
      const takeIfAny = () => { if (inp.files && inp.files.length) { done(Array.from(inp.files)); return true; } return false; };

        if (settled || takeIfAny()) return;
        setTimeout(() => { if (!settled && !takeIfAny()) done([]); }, 1200);   // ~1500 ms total from focus
      }, 300);

    inp.addEventListener('change', onChange);
    inp.addEventListener('cancel', onCancel);
    window.addEventListener('focus', onFocus);
