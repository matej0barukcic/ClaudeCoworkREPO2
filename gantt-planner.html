}

/** `${itemId}::${path}` key used by the in-memory "missing file" flag. */
function missingKey(id, path) { return `${id}::${path}`; }
function isAttachmentMissing(id, path) { return attachState.missing.has(missingKey(id, path)); }
function markAttachmentMissing(id, path) { attachState.missing.add(missingKey(id, path)); }
function clearAttachmentMissing(id, path) { attachState.missing.delete(missingKey(id, path)); }

/**

 * just once per session, in case the browser revoked it in the meantime. A
 * handle without these methods (e.g. a test double) is treated as granted.
 */
async function verifyWritePermission(dh) {
  try {
    const opts = { mode: 'readwrite' };
    if (typeof dh.queryPermission === 'function' && (await dh.queryPermission(opts)) === 'granted') return true;
    if (typeof dh.requestPermission === 'function') return (await dh.requestPermission(opts)) === 'granted';
    return true;
  } catch (e) { return false; }
}

/**
 * Returns the in-memory project-folder handle (handle mode), asking the user
 * to pick it the first time this session (or again if permission was lost).
 * null if the user declines/cancels or the browser refuses.
 */
async function ensureDirHandle() {
  if (attachState.dirHandle && await verifyWritePermission(attachState.dirHandle)) return attachState.dirHandle;
  attachState.dirHandle = null;
  const ok = await confirmBox('Select project folder',
    '<p>Select the folder that contains your project JSON file (the same folder as this gantt-planner.html).</p>' +
    '<p class="hint">The app remembers this only for the current browser tab and creates a subfolder there for attached files. Nothing is uploaded anywhere.</p>',
    'Choose folder…');
  if (!ok) return null;
  let dh;
  try { dh = await window.showDirectoryPicker({ mode: 'readwrite' }); }
  catch (e) {
    if (e && e.name === 'AbortError') return null;
    await showMessage('Could not open the folder', `<p>${esc(e.message || String(e))}</p>`);
    return null;
  }
  if (!(await verifyWritePermission(dh))) {
    await showMessage('Permission needed', '<p>Without write permission for this folder, files cannot be added, updated or opened here.</p>');
    return null;
  }
  attachState.dirHandle = dh;
  return dh;
}

/** Walks/creates `folderPath` (e.g. "Project_Attachments/1.2 FAT") under `rootHandle`, one segment at a time. */
async function getOrCreateSubdir(rootHandle, folderPath) {
  let dh = rootHandle;
  for (const seg of folderPath.split('/').filter(Boolean)) dh = await dh.getDirectoryHandle(seg, { create: true });
  return dh;
}

/** Walks (never creates) to the file handle for a relative path under `rootHandle`. Throws NotFoundError if missing. */
async function getFileHandleForPath(rootHandle, path) {
  const segs = path.split('/').filter(Boolean);
  const fname = segs.pop();
  let dh = rootHandle;
  for (const seg of segs) dh = await dh.getDirectoryHandle(seg);
  return dh.getFileHandle(fname);
}

/** Writes `data` (a File or Blob) into `dirHandle` as `name`, overwriting any existing file of that name. */
async function writeFileToDir(dirHandle, name, data) {
  const fh = await dirHandle.getFileHandle(name, { create: true });
  const w = await fh.createWritable();
  await w.write(data);
  await w.close();
}

/** The set of file names already present directly inside `dirHandle`. */
async function listDirNames(dirHandle) {
  const names = new Set();
  if (dirHandle && typeof dirHandle.values === 'function') {
    for await (const h of dirHandle.values()) names.add(h.name);
  } else if (dirHandle && typeof dirHandle.entries === 'function') {
    for await (const [n] of dirHandle.entries()) names.add(n);
  }
  return names;
}

/**
 * "Add file..." in handle mode: pick file(s), create the item's folder if it
 * does not exist yet (writing the first snapshot into it), copy every file
 * (renaming on a name collision), then record them all as ONE undo step.
 * Cancelling the picker does nothing (AbortError is swallowed).
 */
async function attachAddFilesHandle(kind, id) {
  const dh = await ensureDirHandle();
  if (!dh) return;
  let files;
  try {
    if (typeof window.showOpenFilePicker === 'function') {
      const handles = await window.showOpenFilePicker({ multiple: true });
      files = await Promise.all(handles.map((h) => h.getFile()));
    } else {
      files = await pickFilesViaInput();
    }
  } catch (e) {
    if (e && e.name === 'AbortError') return;
    await showMessage('Could not open the file picker', `<p>${esc(e.message || String(e))}</p>`);
    return;
  }
  if (!files || !files.length) return;
  const loc = kind === 'task' ? findTask(id) : findPhase(id);
  if (!loc) return;
  const item = kind === 'task' ? loc.task : loc.phase;
  const wasNew = !item.folder;
  // Pure computation only, so cancelling anything from here on commits nothing.
  const folderPath = peekItemFolder(kind, id);
  if (!folderPath) return;

  // same name+size added moments ago) unless the user confirms it on purpose.
  files = await filterDuplicateFiles(item.attachments || [], folderPath, files);
  if (!files.length) return;
  let subDir;
  try { subDir = await getOrCreateSubdir(dh, folderPath); }
  catch (e) { await showMessage('Could not create the folder', `<p>${esc(e.message || String(e))}</p>`); return; }

    try {
      const blob = await buildSnapshotPNG(kind, id);

  try { existing = await listDirNames(subDir); }
  catch (e) { await showMessage('Could not read the folder', `<p>${esc(e.message || String(e))}</p>`); return; }
  const added = [];
  for (const file of files) {
    const finalName = uniqueFileName(file.name, existing);
    existing.add(finalName);
    try { await writeFileToDir(subDir, finalName, file); }
    catch (e) { await showMessage('Could not save a file', `<p><b>${esc(file.name)}</b>: ${esc(e.message || String(e))}</p>`); continue; }
    added.push({ name: finalName, path: `${folderPath}/${finalName}`, added: fileDate() });
    noteRecentAdd(`${folderPath}/${file.name}`, file.name, file.size);   // K9: original name/path, for the next de-dup check
  }
  // ONE commit for the whole action (attachRoot + folder, both only if still unset, + the new
  // entries), so "Add file..." is exactly one undo step regardless of how many files were picked.
  // Also commits when nothing was added but the folder is genuinely new (the snapshot now lives on
  // disk in it), so the recorded folder always matches what is actually there.
  if (added.length || wasNew) {
    const rootVal = folderPath.slice(0, folderPath.indexOf('/'));
    commit(() => {
      const cur = kind === 'task' ? findTask(id) : findPhase(id);
      if (!cur) return false;
      const it = kind === 'task' ? cur.task : cur.phase;
      if (!state.attachRoot) state.attachRoot = rootVal;
      if (!it.folder) it.folder = folderPath;
      it.attachments.push(...added);
    });
  }
}

/**
 * "Add file..." in manual mode: the browser cannot write outside of a
 * download, so only the file NAME is used (the picked file's content is
 * never read). The entry is recorded with its target path, the snapshot (if
 * the folder is new) is downloaded, and a dialog lists what the user must
 * move by hand.
 */
async function attachAddFilesManual(kind, id) {
  let files = await pickFilesViaInput();
  if (!files || !files.length) return;
  const loc = kind === 'task' ? findTask(id) : findPhase(id);
  if (!loc) return;
  const item = kind === 'task' ? loc.task : loc.phase;
  const wasNew = !item.folder;
  // Pure computation only, so cancelling the file picker (handled above) commits nothing.
  const folderPath = peekItemFolder(kind, id);
  if (!folderPath) return;
  // K9: drop a file that looks like an accidental repeat (same target path,
  // same name+size added moments ago) unless the user confirms it on purpose.
  files = await filterDuplicateFiles(item.attachments || [], folderPath, files);
  if (!files.length) return;
  let snapName = null;
  if (wasNew) {
    try {
      snapName = snapshotFileName([]);
      downloadBlob(await buildSnapshotPNG(kind, id), snapName);
    } catch (e) { snapName = null; }
  }
  const existing = new Set((item.attachments || []).map((a) => a.name));
  const added = [];
  for (const file of files) {
    const finalName = uniqueFileName(file.name, existing);
    existing.add(finalName);
    added.push({ name: finalName, path: `${folderPath}/${finalName}`, added: fileDate() });
    noteRecentAdd(`${folderPath}/${file.name}`, file.name, file.size);   // K9: original name/path, for the next de-dup check
  }
  // ONE commit for the whole action - see attachAddFilesHandle.
  const rootVal = folderPath.slice(0, folderPath.indexOf('/'));
  commit(() => {
    const cur = kind === 'task' ? findTask(id) : findPhase(id);
    if (!cur) return false;
    const it = kind === 'task' ? cur.task : cur.phase;
    if (!state.attachRoot) state.attachRoot = rootVal;
    if (!it.folder) it.folder = folderPath;
    it.attachments.push(...added);
  });
  await showMessage('Move these files',
    `<p>Move these files into: <b>${esc(folderPath)}/</b> (next to your project JSON file and gantt-planner.html):</p>` +
    `<ul>${added.map((a) => `<li>${esc(a.name)}</li>`).join('')}${snapName ? `<li>${esc(snapName)} <span class="hint">(snapshot)</span></li>` : ''}</ul>`);
}

/** "Update snapshot": builds a new PNG and either writes it (handle mode) or downloads it (manual mode). Never adds a list entry. */
async function attachUpdateSnapshot(kind, id) {
  const folderPath = ensureItemFolder(kind, id);
  if (!folderPath) return;
  if (hasFileSystemAccess()) {
    const dh = await ensureDirHandle();
    if (!dh) return;
    let subDir;
    try { subDir = await getOrCreateSubdir(dh, folderPath); }
    catch (e) { await showMessage('Could not create the folder', `<p>${esc(e.message || String(e))}</p>`); return; }
    let existing;
    try { existing = await listDirNames(subDir); }
    catch (e) { await showMessage('Could not read the folder', `<p>${esc(e.message || String(e))}</p>`); return; }
    const name = snapshotFileName(existing);
    let blob;
    try { blob = await buildSnapshotPNG(kind, id); }
    catch (e) { await showMessage('Could not build the snapshot', `<p>${esc(e.message || String(e))}</p>`); return; }
    try { await writeFileToDir(subDir, name, blob); }
    catch (e) { await showMessage('Could not save the snapshot', `<p>${esc(e.message || String(e))}</p>`); return; }
    await showMessage('Snapshot updated', `<p>Saved as <b>${esc(name)}</b> in <b>${esc(folderPath)}/</b>.</p>`);
  } else {
    const name = snapshotFileName([]);
    let blob;
    try { blob = await buildSnapshotPNG(kind, id); }
    catch (e) { await showMessage('Could not build the snapshot', `<p>${esc(e.message || String(e))}</p>`); return; }
    downloadBlob(blob, name);
    await showMessage('Move this file',
      `<p>Move this file into: <b>${esc(folderPath)}/</b> (next to your project JSON file and gantt-planner.html):</p><ul><li>${esc(name)}</li></ul>`);
  }
}

/**
 * "Open" in handle mode: reads the file through the handle, then either
 * shows it inline in a new tab or downloads it, decided by extension (K10).
 * Inline-safe types (pdf/images/txt/csv/log) get a Blob URL in a new tab -
 * text types are forced to `text/plain;charset=utf-8` so they render as text
 * instead of the browser guessing wrong. Everything else (msg, eml, docx,
 * xlsx, zip, ..., and html/htm/svg/xml even though those look "text-like")
 * downloads with the original file name via `<a download>`, so the OS opens
 * it with the program associated with that file type (e.g. Outlook, Word) -
 * `window.open(blobURL)` on those used to show raw/garbled bytes in the tab
 * instead. Flags the attachment "missing" on NotFoundError.
 */
async function attachOpen(id, att) {
  const dh = await ensureDirHandle();
  if (!dh) return;
  try {
    const fh = await getFileHandleForPath(dh, att.path);
    const file = await fh.getFile();
    if (isInlineAttachment(att.name)) {
      const ext = fileExt(att.name);
      const blob = TEXT_ATTACHMENT_EXTS.has(ext)
        ? new Blob([file], { type: 'text/plain;charset=utf-8' })
        : new Blob([file], { type: INLINE_ATTACHMENT_MIME[ext] || file.type || 'application/octet-stream' });
      const url = URL.createObjectURL(blob);
      window.open(url, '_blank', 'noopener');
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    } else {
      downloadBlob(file, att.name);
      await showDownloadHintOnce();
    }
    clearAttachmentMissing(id, att.path);
  } catch (e) {
    if (e && e.name === 'NotFoundError') markAttachmentMissing(id, att.path);
    else await showMessage('Could not open the file', `<p>${esc(e.message || String(e))}</p>`);
  }
}

/** "Re-select..." (handle mode, missing file only): copies a freshly chosen file to the attachment's original path. */
async function attachReselect(id, att) {
  const dh = await ensureDirHandle();
  if (!dh) return;
  let file;
  try {
    if (typeof window.showOpenFilePicker === 'function') {
      const [h] = await window.showOpenFilePicker({ multiple: false });
      file = await h.getFile();
    } else {
      file = (await pickFilesViaInput())[0];
    }
  } catch (e) {
    if (e && e.name === 'AbortError') return;
    await showMessage('Could not open the file picker', `<p>${esc(e.message || String(e))}</p>`);
    return;
  }
  if (!file) return;
  try {
    const segs = att.path.split('/').filter(Boolean);
    const fname = segs.pop();
    let dh2 = dh;
    for (const seg of segs) dh2 = await dh2.getDirectoryHandle(seg, { create: true });
    await writeFileToDir(dh2, fname, file);
    clearAttachmentMissing(id, att.path);
    await showMessage('File restored', `<p>The file was saved as <b>${esc(att.path)}</b>.</p>`);
  } catch (e) { await showMessage('Could not save the file', `<p>${esc(e.message || String(e))}</p>`); }
}

/** One row of the Attachments section: name, added date, Open (button or plain link) / Re-select, Remove. */
function attachRowHTML(id, att, idx) {
  const missing = isAttachmentMissing(id, att.path);
  let openHTML;
  if (missing) openHTML = `<button type="button" data-atc-act="reselect" data-atc-i="${idx}">Re-select…</button>`;
  else if (hasFileSystemAccess()) openHTML = `<button type="button" data-atc-act="open" data-atc-i="${idx}">Open</button>`;
  else if (isInlineAttachment(att.name)) openHTML = `<a href="${encodeRelPath(att.path)}" target="_blank" rel="noopener">Open</a>`;
  // K10 manual mode: non-inline types get `download` so the OS opens them with the
  // associated program instead of the browser rendering them - note the file has to
  // actually be there, and browsers may ignore `download` on a file:// link (help text).
  else openHTML = `<a href="${encodeRelPath(att.path)}" download="${esc(att.name)}" rel="noopener">Open</a>`;
  return `<div class="atcrow${missing ? ' atc-missing' : ''}" data-i="${idx}">
    <span class="atc-name" title="${esc(att.path)}">${esc(att.name)}</span>
    ${missing ? '<span class="atc-flag">Missing</span>' : ''}
    <span class="atc-date">${esc(dayToDisp(isoToDay(att.added)))}</span>
    <span class="atc-acts">${openHTML}<button type="button" data-atc-act="remove" data-atc-i="${idx}" title="Remove from the list (the file stays on disk)">Remove</button></span>
  </div>`;
}

/** Static markup of the Attachments fieldset (K5); the row list and note are filled in by `wireAttachSection`. */
function attachSectionHTML() {
  return `<fieldset class="itemsec" id="atc-sec"><legend>Attachments</legend>
    <div id="atc-rows"></div>
    <div class="atc-btns">
      <button type="button" id="atc-add">+ Add file…</button>
      <button type="button" id="atc-snap">Update snapshot</button>
    </div>
    <p class="hint" id="atc-note"></p>
  </fieldset>`;
}

/**
 * Wires a dialog's Attachments section (K5). Unlike the Links section, this
 * works DIRECTLY on the live task/phase (not a draft copy): every action
 * (add, update snapshot, open, re-select, remove) writes to disk and/or
 * commits immediately, so the dialog's own Cancel/Save never has anything
 * of its own to lose or overwrite here.
 */
function wireAttachSection(d, kind, id) {
  const rowsEl = $('#atc-rows', d), noteEl = $('#atc-note', d);
  const addBtn = $('#atc-add', d), snapBtn = $('#atc-snap', d);
  function currentItem() {
    const loc = kind === 'task' ? findTask(id) : findPhase(id);
    return loc ? (kind === 'task' ? loc.task : loc.phase) : null;
  }
  function renderRows() {
    const item = currentItem();
    if (!item) return;
    const atts = item.attachments || [];
    rowsEl.innerHTML = atts.length ? atts.map((a, i) => attachRowHTML(id, a, i)).join('')
      : '<p class="hint" style="margin:2px 0 8px">No attachments yet.</p>';
    noteEl.textContent = item.folder
      ? `Files are kept in: ${item.folder}/`
      : (hasFileSystemAccess()
        ? 'The first file you add asks you to pick your project folder once, then creates a subfolder there.'
        : 'The first file you add asks you to move it into a subfolder next to this HTML file.');
  }
  /**
   * K9: runs `fn` under `attachState.busy`, the MODULE-WIDE lock shared by
   * every attachment action of every open dialog (not just this one) - a
   * rapid double-click, a click in a second stacked dialog, or a stale
   * double-invocation of the shared file picker can therefore never run two
   * of these at once; while busy, any other click is simply ignored (checked
   * again at each call site). `busyBtn`/`busyLabel`, when given, show visible
   * progress ("Adding…"/"Working…" + `aria-busy`) on the button pressed;
   * `addBtn`/`snapBtn` are disabled meanwhile regardless of which one it was.
   */
  async function guarded(fn, busyBtn, busyLabel) {
    if (attachState.busy) return;
    attachState.busy = true;
    const prevLabel = busyBtn ? busyBtn.textContent : null;
    if (busyBtn) { busyBtn.textContent = busyLabel; busyBtn.setAttribute('aria-busy', 'true'); }
    addBtn.disabled = true; snapBtn.disabled = true;
    try { await fn(); }
    finally {
      attachState.busy = false;
      if (busyBtn) { busyBtn.textContent = prevLabel; busyBtn.removeAttribute('aria-busy'); }
      addBtn.disabled = false; snapBtn.disabled = false;
      renderRows();
    }
  }
  addBtn.addEventListener('click', () => guarded(
    () => hasFileSystemAccess() ? attachAddFilesHandle(kind, id) : attachAddFilesManual(kind, id), addBtn, 'Adding…'));
  snapBtn.addEventListener('click', () => guarded(() => attachUpdateSnapshot(kind, id), snapBtn, 'Working…'));
  rowsEl.addEventListener('click', (e) => {
    // K10 manual mode: a non-inline attachment's "Open" is a plain <a download>
    // (no data-atc-act, so it is not one of the guarded actions below) - the
    // browser handles the download itself; just show the one-time hint for it.
    if (e.target.closest('a[download]')) { showDownloadHintOnce(); return; }
    const b = e.target.closest('[data-atc-act]');
    if (!b) return;
    e.preventDefault();
    if (attachState.busy) return;   // K9 module lock: ignore a click while another attachment action runs
    const act = b.dataset.atcAct, i = Number(b.dataset.atcI);
    guarded(async () => {
      const item = currentItem();
      const att = item && (item.attachments || [])[i];
      if (!att) return;
      if (act === 'open') await attachOpen(id, att);
      else if (act === 'reselect') await attachReselect(id, att);
      else if (act === 'remove') {
        const ok = await confirmBox('Remove from list?',
          `<p>Remove <b>${esc(att.name)}</b> from the attachment list?</p><p class="hint">The file stays on disk – only this entry is removed.</p>`,
          'Remove', true);
        if (ok) {
          commit(() => {
            const cur = currentItem();
            if (!cur) return false;
            const j = (cur.attachments || []).findIndex((x) => x.path === att.path && x.name === att.name);
            if (j < 0) return false;
            cur.attachments.splice(j, 1);
          });
        }
      }
    }, null, null);
  });
  renderRows();
}
</script>

<!-- ======================================================================
     8. UI EVENTS: toolbar, table editing, keyboard, start-up
     ====================================================================== -->
<script id="ui-events">
'use strict';

/** Synchronises toolbar controls with the state (undo/redo availability, name, zoom, title). */
function updateToolbar() {
  $('#bUndo').disabled = !undoStack.length;
  $('#bRedo').disabled = !redoStack.length;
  const pn = $('#projName');
  if (document.activeElement !== pn) pn.value = state.name;
  $('#zoom').value = ui.zoom;
  document.title = `${state.name} – Gantt Chart Planner`;
  // K17: reflect the calendar/work day mode on the toggle button.
  const bDays = $('#bDays'), work = ui.days === 'work';
  bDays.setAttribute('aria-pressed', String(work));
  bDays.querySelector('.wl-btn-suffix').textContent = work ? ' · Mon–Fri' : ' · Mon–Sun';
}

/** Highlights a row without a full re-render (so clicking into a field keeps the caret). */
function selectRow(id) {
  ui.selected = id;
  $$('#sheet .row.sel').forEach((r) => r.classList.remove('sel'));
  const row = $(`#sheet .row[data-row="${CSS.escape(id)}"]`);
  if (row) row.classList.add('sel');
}

/** Scrolls the timeline so that day n is near the left edge (just right of the sticky columns). */
function scrollToDay(n, smooth) {
  const L = lastLayout;
  if (!L) return;
  const margin = (L.g.zoom === 'week' ? 3 : 10) * L.g.dayW;
  const left = Math.max(0, L.leftW + L.g.x(n) - L.stickyW - margin);
  $('#scroller').scrollTo({ left, behavior: smooth ? 'smooth' : 'auto' });
}

/**
 * Makes sure a task/phase's row can actually be shown before scrolling to it
 * (K3 "walk the chain"): expands its collapsed phase and clears an active
 * search filter if either would otherwise hide the row. Decision: do this
 * silently (no message) rather than opening the dialog on a hidden row.
 */
function ensureVisible(id) {
  const tl = findTask(id);
  const phaseId = tl ? tl.phase.id : (findPhase(id) ? id : null);
  if (phaseId) { const loc = findPhase(phaseId); if (loc && loc.phase.collapsed) { loc.phase.collapsed = false; dirty = true; } }
  if (ui.filter.trim()) { ui.filter = ''; const s = $('#search'); if (s) s.value = ''; }
}

/** Selects a task/phase, makes it visible if needed, and scrolls table + timeline to it (K3 "walk the chain"). */
function walkTo(id) {
  ensureVisible(id);
  ui.selected = id;
  render();
  const tl = findTask(id), pl = findPhase(id);
  const startDay = tl ? isoToDay(tl.task.start) : (pl ? (phaseSummary(pl.phase)?.start ?? todayDay()) : todayDay());
  scrollToDay(startDay, true);
  const row = $(`#sheet .row[data-row="${CSS.escape(id)}"]`);
  if (row) row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  openWhatNext(id);
}

/** Switches week/month zoom and keeps the same date at the left edge of the visible timeline. */
function setZoom(z) {
  const sc = $('#scroller'), L = lastLayout;
  let anchor = null;
  if (L && sc.scrollLeft + L.stickyW > L.leftW) anchor = L.g.dayAt(sc.scrollLeft + L.stickyW - L.leftW);
  ui.zoom = z;
  render();
  if (anchor !== null) { const N = lastLayout; sc.scrollLeft = Math.max(0, N.leftW + N.g.x(anchor) - N.stickyW); }
}

/** K17: toggles calendar/work day mode and keeps the same date at the left edge of the visible timeline. */
function toggleDays() {
  const sc = $('#scroller'), L = lastLayout;
  let anchor = null;
  if (L && sc.scrollLeft + L.stickyW > L.leftW) anchor = L.g.dayAt(sc.scrollLeft + L.stickyW - L.leftW);
  ui.days = ui.days === 'work' ? 'calendar' : 'work';
  render();
  if (anchor !== null) { const N = lastLayout; sc.scrollLeft = Math.max(0, N.leftW + N.g.x(anchor) - N.stickyW); }
}

/** Adds a task after the selected task (or at the end of the selected / last phase). */
function addTask() {
  let target = null, after = -1;
  if (ui.selected) {
    const tl = findTask(ui.selected);
    if (tl) { target = tl.phase; after = tl.index; }
    else { const pl = findPhase(ui.selected); if (pl) target = pl.phase; }
  }
  let created = null;
  clearSearch();
  commit(() => {
    if (!state.phases.length) state.phases.push(makePhase({ name: 'Phase 1' }));
    if (!target || !state.phases.includes(target)) target = state.phases[state.phases.length - 1];
    created = makeTask({ name: 'New task' });
    if (after >= 0) target.tasks.splice(after + 1, 0, created); else target.tasks.push(created);
    target.collapsed = false;
    ui.selected = created.id;
  });
  if (created) pendingFocus = `${created.id}|name`;
}

/** Adds a phase after the selected phase (or after the phase of the selected task), else at the end. */
function addPhase() {
  let at = state.phases.length;
  if (ui.selected) {
    const pl = findPhase(ui.selected) || (findTask(ui.selected) ? findPhase(findTask(ui.selected).phase.id) : null);
    if (pl) at = pl.index + 1;
  }
  let created = null;
  clearSearch();
  commit(() => {
    created = makePhase({ name: `Phase ${state.phases.length + 1}` });
    state.phases.splice(at, 0, created);
    ui.selected = created.id;
  });
  if (created) pendingFocus = `${created.id}|name`;
}

/** Deletes a task and every link pointing to it. */
function deleteTask(id) {
  commit(() => {
    const loc = findTask(id);
    if (!loc) return false;
    loc.phase.tasks.splice(loc.index, 1);
    for (const x of allTasks()) x.deps = x.deps.filter((d) => d.pred !== id);
    if (ui.selected === id) ui.selected = null;
  });
}

/** Deletes a phase with all its tasks and every link pointing to those tasks. */
function deletePhase(id) {
  commit(() => {
    const loc = findPhase(id);
    if (!loc) return false;
    const gone = new Set(loc.phase.tasks.map((t) => t.id));
    state.phases.splice(loc.index, 1);
    for (const x of allTasks()) x.deps = x.deps.filter((d) => !gone.has(d.pred));
    if (ui.selected === id || gone.has(ui.selected)) ui.selected = null;
  });
}

/**
 * Copies a task right below the original: same data, including its web
 * links, but WITHOUT dependency links, attachments or its folder (decision:
 * the copy is a new item and gets its own folder the first time a file is
 * added to it, see K5).
 */
function duplicateTask(id) {
  let copyId = null;
  commit(() => {
    const loc = findTask(id);
    if (!loc) return false;
    const c = JSON.parse(JSON.stringify(loc.task));
    c.id = newId('t');
    c.name = `${loc.task.name} (copy)`;
    c.deps = [];
    c.attachments = [];
    delete c.folder;
    loc.phase.tasks.splice(loc.index + 1, 0, c);
    ui.selected = c.id;
    copyId = c.id;
  });
  if (copyId) pendingFocus = `${copyId}|name`;
}

/**
 * ↑/↓: tasks move within their phase; at the edge of a phase they move into
 * the previous/next phase. Phases move among phases. Numbers update automatically.
 */
function moveRow(id, dir) {
  const ok = commit(() => {
    const ph = findPhase(id);
    const arr = state.phases;
    if (ph) {
      const j = ph.index + (dir === 'up' ? -1 : 1);
      if (j < 0 || j >= arr.length) return false;
      [arr[ph.index], arr[j]] = [arr[j], arr[ph.index]];
      return true;
    }
    const loc = findTask(id);
    if (!loc) return false;
    const { phase, index, task } = loc;
    const pi = arr.indexOf(phase);
    if (dir === 'up') {
      if (index > 0) [phase.tasks[index - 1], phase.tasks[index]] = [phase.tasks[index], phase.tasks[index - 1]];
      else if (pi > 0) { phase.tasks.splice(index, 1); arr[pi - 1].tasks.push(task); arr[pi - 1].collapsed = false; }
      else return false;
    } else {
      if (index < phase.tasks.length - 1) [phase.tasks[index + 1], phase.tasks[index]] = [phase.tasks[index], phase.tasks[index + 1]];
      else if (pi < arr.length - 1) { phase.tasks.splice(index, 1); arr[pi + 1].tasks.unshift(task); arr[pi + 1].collapsed = false; }
      else return false;
    }
    return true;
  });
  if (ok) { ui.selected = id; pendingFocus = `${id}|${dir}`; }
}

/** Collapses/expands a phase. Stored in the file, but not an undo step. */
function toggleCollapse(id) {
  const loc = findPhase(id);
  if (!loc) return;
  loc.phase.collapsed = !loc.phase.collapsed;
  dirty = true;
  pendingFocus = `${id}|tog`;
  requestRender();
}

/** Empties the search box (used when adding rows so new rows are visible). */
function clearSearch() { ui.filter = ''; $('#search').value = ''; }

/** Opens the operating system's file dialog to choose a project file. */
function openFilePicker() { const fi = $('#fileInput'); fi.value = ''; fi.click(); }

/** Shows an "invalid date" message and restores the previous value. */
function invalidDate(el, previous) {
  const bad = el.value;
  el.value = previous;
  showMessage('Invalid date', `<p>“${esc(bad)}” is not a valid date. Please use DD.MM.YYYY, for example ${dayToDisp(todayDay())}.</p>`);
}

/** Commits the field that currently has focus (used before shortcuts such as Ctrl+S). */
function flushActiveEdit() {
  const el = document.activeElement;
  if (el && el.matches('#sheet input, #projName')) el.dispatchEvent(new Event('change', { bubbles: true }));
}

/** Menu actions. */
async function menuAction(act) {
  $('#menu').open = false;
  switch (act) {
    case 'open': openProject(); break;
    case 'save': flushActiveEdit(); saveProject({ saveAs: false }); break;
    case 'saveas': flushActiveEdit(); saveProject({ saveAs: true }); break;
    case 'csv': exportCSV(); break;
    case 'xml': exportXML(); break;
    case 'print': doPrint(); break;
    case 'help': openHelp(); break;
    case 'holidays': openHolidaysDialog(); break;
    case 'new':
      if (await confirmBox('New empty project?', '<p>The current project will be replaced by an empty one.</p><p class="hint">Save it first if you want to keep it. You can also undo this with Ctrl+Z.</p>', 'Start empty')) {
        commit(() => { state = { name: 'New project', holidays: defaultHolidays(), phases: [] }; ui.selected = null; });
        fileState.handle = null;   // K14: a new project is not the file we had open/saved before
        fileState.name = null;
        updateProjNameTitle();
        pendingFocus = null;
        $('#projName').focus();
        $('#projName').select();
      }
      break;
  }
}

/* ---------------------------------------------------------------------------
 * DRAG-TO-LINK (mouse / pen only; on touch screens the dialogs are used, so
 * that dragging never interferes with scrolling).
 *  - Drag a handle (circle at the start or finish of a bar) onto another bar.
 *    The side you drop on decides the type: finish→start FS, start→start SS,
 *    finish→finish FF, start→finish SF.
 *  - Drag the tip of an existing arrow onto another task to re-connect it.
 * Every drop is checked: no milestones, no link to itself, no loops.
 * ------------------------------------------------------------------------- */
let drag = null;
let suppressClick = false;

/** The task bar under the mouse and which half (start 's' / finish 'e') it is on. */
function barUnderPointer(e) {
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const gEl = el && el.closest('svg.tl .bar[data-open]');
  if (!gEl) return null;
  const bg = gEl.querySelector('.bar-bg');
  if (!bg) return null;                                  // phase or milestone: not linkable
  const r = bg.getBoundingClientRect();
  return { id: gEl.dataset.open, el: gEl, side: e.clientX < r.left + r.width / 2 ? 's' : 'e' };
}

/**
 * Checks and applies a link pred -> succ of the given type as one undo step.
 * `oldSucc` = the previous successor when an existing arrow is re-connected.
 * Returns an error text instead of applying when the link is not allowed.
 */
function applyLink(pred, succ, type, lag, oldSucc) {
  if (pred === succ) return 'A task cannot depend on itself.';
  const p = findTask(pred), sTask = findTask(succ);
  if (!p || !sTask) return 'Task not found.';
  if (p.task.milestone || sTask.task.milestone) return 'Milestones cannot have dependencies.';
  const depsOf = (x) => {
    let list = x.deps;
    if (oldSucc && x.id === oldSucc) list = list.filter((k) => k.pred !== pred);
    if (x.id === succ) {
      const prev = list.find((k) => k.pred === pred);
      list = list.filter((k) => k.pred !== pred).concat([{ pred, type, lag: prev ? prev.lag : lag }]);
    }
    return list;
  };
  const { cycle } = topoOrder(allTasks(), depsOf);
  if (cycle) {
    const num = numbering();
    return `This link would create a loop (${cycle.map((c) => num.get(c)).join(' → ')}), so it was not created.`;
  }
  commit(() => { for (const x of allTasks()) if (x.id === succ || x.id === oldSucc) x.deps = depsOf(x); });
  return null;
}

/** pointerdown on a handle or an arrow tip starts dragging a link. */
function startLinkDrag(e) {
  const h = e.target.closest('.hdl, .ahd');
  if (!h || e.pointerType === 'touch' || e.button !== 0) return;
  e.preventDefault();
  e.stopPropagation();
  const svg = h.ownerSVGElement;
  if (h.classList.contains('hdl')) {
    drag = { mode: 'new', pred: h.dataset.id, side: h.dataset.h, x0: Number(h.getAttribute('cx')), y0: Number(h.getAttribute('cy')) };
  } else {
    const [succ, pred] = h.dataset.link.split('|');
    const dep = findTask(succ)?.task.deps.find((k) => k.pred === pred);
    if (!dep) return;
    drag = { mode: 'move', pred, oldSucc: succ, side: dep.type[0] === 'F' ? 'e' : 's', lag: dep.lag,
      x0: Number(h.dataset.x1), y0: Number(h.dataset.y1), sx: e.clientX, sy: e.clientY };
  }
  drag.svg = svg;
  drag.sx = e.clientX; drag.sy = e.clientY; drag.moved = false; drag.target = null;
  drag.line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  drag.line.setAttribute('class', 'dragline');
  svg.appendChild(drag.line);
  window.addEventListener('pointermove', moveLinkDrag);
  window.addEventListener('pointerup', endLinkDrag);
  window.addEventListener('pointercancel', endLinkDrag);
}

/** Follows the mouse with a dashed line, highlights the drop target and scrolls near the edges. */
function moveLinkDrag(e) {
  if (!drag) return;
  if (Math.abs(e.clientX - drag.sx) + Math.abs(e.clientY - drag.sy) > 4) drag.moved = true;
  const r = drag.svg.getBoundingClientRect();
  drag.line.setAttribute('d', `M${drag.x0} ${drag.y0}L${e.clientX - r.left} ${e.clientY - r.top}`);
  if (drag.target) drag.target.el.classList.remove('drop', 'nodrop');
  drag.target = barUnderPointer(e);
  if (drag.target) {
    const ok = drag.target.id !== drag.pred && !dependentsOf(drag.target.id).has(drag.pred);
    drag.target.el.classList.add(ok ? 'drop' : 'nodrop');
  }
  const sc = $('#scroller'), b = sc.getBoundingClientRect();
  // Auto-scroll when the mouse is close to an edge of the visible chart.
  if (e.clientX > b.right - 20) sc.scrollLeft += 12;
  else if (e.clientX < b.left + (lastLayout ? lastLayout.stickyW : 0) + 20) sc.scrollLeft -= 12;
  if (e.clientY > b.bottom - 20) sc.scrollTop += 10;
  else if (e.clientY < b.top + (lastLayout ? lastLayout.g.hdrH : 44) + 20) sc.scrollTop -= 10;
}

/** Drop: creates or re-connects the link (or explains why not). */
function endLinkDrag(e) {
  window.removeEventListener('pointermove', moveLinkDrag);
  window.removeEventListener('pointerup', endLinkDrag);
  window.removeEventListener('pointercancel', endLinkDrag);
  if (!drag) return;
  const dg = drag;
  drag = null;
  dg.line.remove();
  if (dg.target) dg.target.el.classList.remove('drop', 'nodrop');
  if (!dg.moved) {                                   // a plain click on an arrow tip: open the editor
    if (dg.mode === 'move' && e.type === 'pointerup') { suppressClick = true; openLinkDialog(dg.oldSucc, dg.pred); }
    return;
  }
  suppressClick = true;
  setTimeout(() => { suppressClick = false; }, 300);
  if (e.type !== 'pointerup') return;
  const t = barUnderPointer(e);
  if (!t) return;                                    // dropped on empty space: nothing happens
  const type = (dg.side === 'e' ? 'F' : 'S') + (t.side === 's' ? 'S' : 'F');
  const problem = applyLink(dg.pred, t.id, type, dg.mode === 'move' ? dg.lag : 0, dg.mode === 'move' ? dg.oldSucc : null);
  if (problem) showMessage('Link not possible', `<p>${esc(problem)}</p>`);
}

/* ---------------------------------------------------------------------------
 * HOLIDAY HOVER TOOLTIP (K11): a single reusable #holTip element, shown near
 * the pointer while it is over a public-holiday column in the timeline
 * header or body (mouse/pen), or after a tap on a holiday header cell
 * (touch). It fades in (~150 ms via CSS), then fades out by itself after
 * ~1.5 s even if the pointer does not move, and jumps straight to the new
 * holiday when the pointer moves to a different one without waiting for
 * that timeout. It never intercepts pointer events (`pointer-events: none`
 * in CSS), so link-drag and bar clicks are unaffected while it is visible.
 * ------------------------------------------------------------------------- */
let holTipDay = null;      // day number currently shown, or null
let holTipTimer = null;    // auto-hide timeout
let holTipPending = false; // rAF-throttle flag for pointermove

/** Day under (clientX, clientY) if it is inside the header or body timeline SVG, else null. */
function holHitDay(clientX, clientY) {
  if (!lastLayout) return null;
  const sheet = $('#sheet');
  const svgs = [sheet.querySelector('.tlh svg'), sheet.querySelector('svg.tl')];
  for (const svg of svgs) {
    if (!svg) continue;
    const r = svg.getBoundingClientRect();
    if (clientX >= r.left && clientX <= r.right && clientY >= r.top && clientY <= r.bottom) {
      return lastLayout.g.dayAt(clientX - r.left);
    }
  }
  return null;
}

/** Hides the tooltip immediately (no fade), e.g. when leaving the timeline or scrolling. */
function hideHolTip() {
  if (holTipDay === null) return;
  holTipDay = null;
  clearTimeout(holTipTimer);
  $('#holTip').classList.remove('show');
}

/** Positions the tooltip near (x, y), clamped so it stays inside the viewport. */
function placeHolTip(x, y) {
  const tip = $('#holTip');
  const vw = window.innerWidth, vh = window.innerHeight;
  let left = x + 14, top = y + 18;
  const tw = tip.offsetWidth || 160, th = tip.offsetHeight || 28;
  if (left + tw > vw - 4) left = x - 14 - tw;
  if (top + th > vh - 4) top = y - 18 - th;
  tip.style.left = `${Math.max(4, left)}px`;
  tip.style.top = `${Math.max(4, top)}px`;
}

/** Shows (or moves) the tooltip for `day`; restarts the ~1.5 s auto-hide only when the day changed. */
function showHolTip(day, names, x, y) {
  const tip = $('#holTip');
  const changed = day !== holTipDay;
  holTipDay = day;
  if (changed) tip.textContent = `${dayToDisp(day)} · ${names.join(', ')}`;
  placeHolTip(x, y);
  if (changed) {
    tip.classList.add('show');
    clearTimeout(holTipTimer);
    holTipTimer = setTimeout(() => { holTipDay = null; tip.classList.remove('show'); }, 1500);
  }
}

/** Pointer is over a holiday column -> show/update; otherwise hide. Mouse/pen only (not touch). */
function checkHolPointer(e) {
  holTipPending = false;
  const day = holHitDay(e.clientX, e.clientY);
  const g = lastLayout && lastLayout.g;
  const names = day !== null && g ? g.hol.get(day) : null;
  if (names && g.shown(day)) showHolTip(day, names, e.clientX, e.clientY);
  else hideHolTip();
}

/** Throttled (one check per animation frame) pointermove handler. */
function onHolPointerMove(e) {
  if (e.pointerType === 'touch') return;      // touch uses tap, see the pointerup handler in init()
  if (holTipPending) return;
  holTipPending = true;
  requestAnimationFrame(() => checkHolPointer(e));
}

/** Wires up every event handler and shows the first screen. */
function init() {
  sampleProject('My Project');
  schedule();
  const sheet = $('#sheet');

  // ---- toolbar ----
  $('#bAddPhase').addEventListener('click', addPhase);
  $('#bAddTask').addEventListener('click', addTask);
  $('#bWhatNext').addEventListener('click', () => openWhatNext());
  $('#bDays').addEventListener('click', toggleDays);
  $('#bUndo').addEventListener('click', undo);
  $('#bRedo').addEventListener('click', redo);
  $('#zoom').addEventListener('change', (e) => setZoom(e.target.value));
  $('#bToday').addEventListener('click', () => {
    applyTodayBlink = true;  // Flag to apply blink on the next render (which scrollToDay may trigger).
    scrollToDay(todayDay(), true);
    // If no render was triggered, apply blink immediately.
    if (!renderQueued) {
      requestAnimationFrame(() => {
        const line = $('svg.tl .today-line');
        if (line) {
          line.classList.remove('blink');
          void line.offsetWidth;  // Force reflow
          line.classList.add('blink');
        }
      });
    }
  });
  $('#search').addEventListener('input', (e) => { ui.filter = e.target.value; requestRender(); });
  const pn = $('#projName');
  pn.addEventListener('change', () => commit(() => { state.name = pn.value.trim() || 'Untitled project'; }));
  pn.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); pn.dispatchEvent(new Event('change')); pn.blur(); }
    if (e.key === 'Escape') { pn.value = state.name; pn.blur(); }
  });
  $$('#menu [data-act]').forEach((b) => b.addEventListener('click', () => menuAction(b.dataset.act)));
  document.addEventListener('click', (e) => { const m = $('#menu'); if (m.open && !m.contains(e.target)) m.open = false; });
  $('#fileInput').addEventListener('change', (e) => { const file = e.target.files && e.target.files[0]; if (file) importFile(file); });

  // ---- table editing (event delegation: one listener for all rows) ----
  sheet.addEventListener('change', (e) => {
    const el = e.target;
    const row = el.closest('.row');
    if (!row || !el.dataset.f) return;
    const id = row.dataset.row, f = el.dataset.f;
    if (row.classList.contains('phase')) {
      if (f === 'name') commit(() => { const p = findPhase(id); if (!p) return false; p.phase.name = el.value.trim() || 'Untitled phase'; });
      return;
    }
    const loc = findTask(id);
    if (!loc) return;
    const t = loc.task;
    switch (f) {
      case 'name': commit(() => { t.name = el.value.trim() || 'Untitled task'; }); break;
      case 'person': commit(() => { t.person = el.value.trim(); }); break;
      case 'start': {
        if (t.deps.length && !t.milestone) {
          // Linked task: typing a date sets "start no earlier than", an empty field removes it.
          if (!el.value.trim()) { commit(() => { delete t.snet; }); return; }
          const c = dispToDay(el.value);
          if (isNaN(c)) { invalidDate(el, dayToDisp(isoToDay(t.start))); return; }
          commit(() => { t.snet = dayToIso(c); });
          return;
        }
        const n = dispToDay(el.value);
        if (isNaN(n)) { invalidDate(el, dayToDisp(isoToDay(t.start))); return; }
        commit(() => { t.start = dayToIso(n); });
        break;
      }
      case 'end': {
        const n = dispToDay(el.value);
        if (isNaN(n)) { invalidDate(el, dayToDisp(taskEndDay(t))); return; }
        commit(() => { t.duration = Math.max(1, n - isoToDay(t.start) + 1); });   // end before start -> 1 day
        break;
      }
      case 'dur': commit(() => { t.duration = clampInt(el.value, 1, 100000, t.duration); }); break;
      case 'pct': commit(() => { t.percent = clampInt(el.value, 0, 100, t.percent); }); break;
      case 'done': commit(() => { t.done = el.checked; }); break;
    }
  });
  sheet.addEventListener('keydown', (e) => {
    const el = e.target;
    if (!el.matches('input:not([type=checkbox])')) return;
    if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); el.dispatchEvent(new Event('change', { bubbles: true })); }
    if (e.key === 'Escape') { el.value = el.defaultValue; }
  });
  sheet.addEventListener('click', (e) => {
    if (suppressClick) { suppressClick = false; return; }       // the click that ends a drag
    const lk = e.target.closest('[data-link]');
    if (lk) { const [succ, pred] = lk.dataset.link.split('|'); openLinkDialog(succ, pred); return; }
    const li = e.target.closest('[data-links]');
    if (li) { openItemLinks(li.dataset.links); return; }         // 🔗 icon: open link(s), never selects/changes the row
    const ai = e.target.closest('[data-attach]');
    if (ai) { openItemAttachments(ai.dataset.attach); return; }  // 📎 icon: open the dialog's Attachments section
    const tg = e.target.closest('[data-toggle]');
    if (tg) { selectRow(tg.dataset.toggle); toggleCollapse(tg.dataset.toggle); return; }
    const mv = e.target.closest('[data-move]');
    if (mv) { moveRow(mv.closest('.row').dataset.row, mv.dataset.move); return; }
    const op = e.target.closest('[data-open]');
    if (op) { selectRow(op.dataset.open); openDetails(op.dataset.open, op.dataset.deps === '1'); return; }
    const row = e.target.closest('.row');
    if (row) selectRow(row.dataset.row);
  });
  sheet.addEventListener('pointerdown', startLinkDrag);
  // K11: holiday hover tooltip - mouse/pen pointermove over the header or body timeline,
  // hidden at once on leaving the sheet or on any scroll (including programmatic scrollToDay).
  sheet.addEventListener('pointermove', onHolPointerMove);
  // Lifting a finger always fires a pointerleave right after the tap (touch has no hover) - only
  // mouse/pen leaving the timeline should hide the tap-shown tooltip immediately.
  sheet.addEventListener('pointerleave', (e) => { if (e.pointerType !== 'touch') hideHolTip(); });
  $('#scroller').addEventListener('scroll', hideHolTip, { passive: true });
  // Show the link handles of the bar under the mouse (also while the mouse is on a handle).
  sheet.addEventListener('pointerover', (e) => {
    if (e.pointerType === 'touch' || drag) return;
    const b = e.target.closest('svg.tl .bar[data-open], svg.tl .hdl');
    const id = b ? (b.dataset.open || b.dataset.id) : null;
    $$('#sheet .hdl.show').forEach((h) => { if (h.dataset.id !== id) h.classList.remove('show'); });
    if (id) $$(`#sheet .hdl[data-id="${CSS.escape(id)}"]`).forEach((h) => h.classList.add('show'));
  });
  sheet.addEventListener('focusin', (e) => { const row = e.target.closest('.row'); if (row && ui.selected !== row.dataset.row) selectRow(row.dataset.row); });
  // K12: Double-click on name cell opens details dialog
  // State for touch double-tap detection
  let lastNameTap = null;  // { id, x, y, time }
  
  sheet.addEventListener('dblclick', (e) => {
    const input = e.target.closest('input[data-f="name"]');
    if (!input) return;
    const row = input.closest('.row');
    if (!row) return;
    const id = row.dataset.row;
    flushActiveEdit();
    openDetails(id);
  });
  
  sheet.addEventListener('pointerup', (e) => {
    if (e.pointerType !== 'touch') return;
    // K11: tap on a holiday header/body cell shows the same tooltip a mouse hover would.
    const day = holHitDay(e.clientX, e.clientY);
    const g = lastLayout && lastLayout.g;
    const names = day !== null && g ? g.hol.get(day) : null;
    if (names && g.shown(day)) showHolTip(day, names, e.clientX, e.clientY);
    else hideHolTip();
    // Touch double-tap detection for name cells
    const input = e.target.closest('input[data-f="name"]');
    if (!input) return;
    const row = input.closest('.row');
    if (!row) return;
    const id = row.dataset.row;
    
    const now = Date.now();
    const x = e.clientX;
    const y = e.clientY;
    
    // Check if this is a second tap on the same input within 350ms and < 10px apart
    if (lastNameTap && 
        lastNameTap.id === id && 
        now - lastNameTap.time < 350 && 
        Math.hypot(x - lastNameTap.x, y - lastNameTap.y) < 10) {
      // Double-tap detected
      flushActiveEdit();
      openDetails(id);
      lastNameTap = null;  // Reset to prevent triple-tap
    } else {
      // Record this tap for potential double-tap
      lastNameTap = { id, x, y, time: now };
    }
  });


  // ---- keyboard shortcuts ----
  document.addEventListener('keydown', (e) => {
    const mod = e.ctrlKey || e.metaKey;
    const key = e.key.toLowerCase();
    if (document.querySelector('dialog[open]')) {
      if (mod && key === 's') e.preventDefault();          // never open the browser's "Save page" over a dialog
      return;
    }
    const typing = e.target.matches('input:not([type=checkbox]):not([readonly]), textarea');
    if (mod && !e.altKey && key === 's') { e.preventDefault(); flushActiveEdit(); saveProject({ saveAs: false }); return; }
    if (mod && !e.altKey && key === 'z' && !e.shiftKey) { if (typing) return; e.preventDefault(); undo(); return; }
    if (mod && !e.altKey && (key === 'y' || (key === 'z' && e.shiftKey))) { if (typing) return; e.preventDefault(); redo(); return; }
    if (e.altKey && !mod && e.code === 'KeyN') { e.preventDefault(); flushActiveEdit(); addTask(); }
  });

  // ---- page life-cycle ----
  // Warn before leaving with unsaved changes (the only safety net without auto-save).
  window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
  // Re-render on resize only if the column layout really changes. (On phones the
  // on-screen keyboard fires resize events; re-rendering then would close it.)
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (!lastLayout || JSON.stringify(colDefs()) !== JSON.stringify(lastLayout.C) || rowHeight() !== lastLayout.rh) render();
    }, 150);
  });

  render();
  scrollToDay(todayDay(), false);   // decision: open on the current week
  openWelcome();
}

init();
</script>
</body>
</html>
