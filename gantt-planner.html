<title>Gantt Chart Planner</title>
<!--
==============================================================================
  Gantt Chart Planner — version 4.0
  Author: Matej Barukčić, 2026. For personal use.

  WHAT THIS IS
    A single, self-contained HTML file that works as a small Gantt chart
    editor (a focused subset of Microsoft Project). It runs completely
    offline: no installation, no admin rights, no server, no external
    libraries, no fonts to download, no tracking. Double-click to open.

  HOW DATA IS STORED
    Nothing is stored in the browser (no localStorage, no cookies, no
    IndexedDB). The project only lives in memory while this page is open.
    Menu -> "Save (JSON)" (Ctrl+S) writes it to a .json file: in Chrome/Edge
    directly back to the same file once one has been chosen or opened (no
    dialog, no "Project (1).json" duplicates); in Safari/Firefox as a new
    download every time. Menu -> "Open project" loads a file back in (and,
    in Chrome/Edge, remembers it for the next save). The browser warns
    before the page is closed while there are unsaved changes.

  CODE ORGANISATION
    Every functional area has its own <script> block. Classic scripts share
    one global scope, so functions and top-level variables declared in an
    earlier block are visible in later blocks. Order matters:
      1. core-utils      date maths, escaping, file download helpers
      1b. core-holidays  offline public holiday calendars (Slovenia, USA)
      2. core-model      project state, sample data, undo/redo
      3. core-scheduler  dependency maths, cycle detection, auto-scheduling
      4. io              JSON import + validation, JSON/CSV/MS Project XML export
      5. ui-dialogs      modal dialogs (message, task, phase, help, welcome)
      6. ui-render       table + timeline (SVG) rendering
      7. ui-print        A4-landscape print layout split across several pages
      7b. snapshot       stand-alone SVG/PNG snapshot image for attachments (K5)
      7c. attachments    files-on-disk attachments: folders, copy/open/re-select (K5)
      8. ui-events       toolbar, keyboard shortcuts, start-up

  PROJECT FILE FORMAT (JSON, version "1.2"; files of major version 1
  (1.0, 1.1, 1.2) still open; fields missing in older files default to
  empty)
    {
      "version": "1.2",                 required, major version must be 1
      "holidays": { "countries": ["SI"], "off": ["SI:2026-12-26"] },
                                        shown public holidays (SI Slovenia, US United
                                        States) and the ones switched off, per date
      "app": "Gantt Chart Planner",     informative
      "name": "My Project",             project name (also the page title)
      "exported": "2026-09-23",         informative (date of export)
      "attachRoot": "Project_Attachments", optional, set once (see K5), the
                                        folder (next to this file) that holds
                                        all attachments
      "phases": [
        { "id": "p1", "name": "Planning", "collapsed": false,
          "links": [ { "label": "Charter", "url": "https://..." } ],
                                        optional web links (https:, http: or
                                        mailto:; label max. 100 characters)
          "attachments": [ { "name": "Charter.pdf",
              "path": "Project_Attachments/1 Planning/Charter.pdf",
              "added": "2026-09-23" } ],
                                        optional files kept on disk next to
                                        this file (see K5); "path" is relative,
                                        "/" separators, no "..", no leading "/"
          "folder": "Project_Attachments/1 Planning", optional, subfolder
                                        assigned once when the first
                                        attachment is added, never renamed
          "tasks": [
            { "id": "t1", "name": "Kick-off", "milestone": true,
              "start": "2026-09-21",   ISO date YYYY-MM-DD
              "duration": 0,           whole calendar days (>= 1 for tasks, 0 for milestones)
              "percent": 0,            0..100, whole numbers (tasks only)
              "done": true,            milestone reached? (milestones only)
              "person": "",            owner (free text)
              "note": "",              max. 600 characters
              "deps": [ { "pred": "t0", "type": "FS", "lag": 0 } ],
              "snet": "2026-10-01",    optional "Start No Earlier Than" of a linked task
              "links": [ ... ],        optional, same shape as on a phase
              "attachments": [ ... ],  optional, same shape as on a phase
              "folder": "Project_Attachments/1.2 FAT" optional, same rule as on a phase
            } ] } ] }
    Dependency types: FS finish-to-start, SS start-to-start,
    FF finish-to-finish, SF start-to-finish. "lag" is in calendar days,
    negative values are a lead.
    "links" and "attachments" are kept only in this JSON format; CSV and
    MS Project XML export ignore them.
==============================================================================
-->
<style>
/* =============================================================================
   DESIGN TOKENS
   A single fixed light theme (decision: light only). Colours used by the
   timeline are defined here so screen and print share them.
   ========================================================================== */
:root {
  --bg: #ffffff;          /* page and cell background */
  --fg: #1f2328;          /* main text */
  --muted: #5f6b7a;       /* secondary text */
  --line: #d9dee4;        /* borders of controls */
  --grid: #eceff3;        /* thin grid lines / row separators */
  --grid-strong: #c9d0d8; /* week (or month) separators */
  --head: #f5f7f9;        /* header / toolbar background */
  --phase-bg: #f7f8fa;    /* phase row background */
  --sel: #e6effa;         /* selected row */
  --hover: #f8fafc;       /* hovered row */
  --accent: #0b5cad;      /* primary buttons, links, focus ring */
  --danger: #b42318;      /* destructive actions */
  --task: #a9b5c6;        /* task bar (all tasks share one colour) */
  --task-prog: #3e5068;   /* completed part of a task bar */
  --ms: #1f2328;          /* milestone outline / fill when reached */
  --rh: 32px;             /* row height (desktop: compact) */
  --fs: 13px;             /* base font size */
  --btn: 32px;            /* minimum size of buttons */
}
/* Touch devices: at least 44x44 px touch targets and 16 px text
   (iOS Safari zooms into inputs with smaller text). */
@media (pointer: coarse) {
  :root { --rh: 45px; --fs: 16px; --btn: 44px; }
}

/* =============================================================================
   BASE
   ========================================================================== */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
  font: var(--fs)/1.35 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
[hidden] { display: none !important; }
button { font: inherit; color: var(--fg); background: #fff; border: 1px solid var(--line);

button.idbtn { cursor: pointer; text-decoration: underline; }
button.idbtn:hover { opacity: 0.7; }
  border-radius: 6px; min-height: var(--btn); min-width: var(--btn); padding: 0 10px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
button:hover { background: var(--hover); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover { background: #094c90; }
button.danger { color: var(--danger); border-color: #efc7c2; }
input, select, textarea { font: inherit; color: var(--fg); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
kbd { font: .85em ui-monospace, SFMono-Regular, Consolas, monospace; border: 1px solid var(--line);
  border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: #fff; }

/* =============================================================================
   APP LAYOUT: toolbar on top, scrollable sheet below (fills the screen)
   ========================================================================== */
#app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
#toolbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 8px;
  padding-left: max(8px, env(safe-area-inset-left)); padding-right: max(8px, env(safe-area-inset-right));
  background: var(--head); border-bottom: 1px solid var(--line); flex: none; position: relative; }
#projName { flex: 1 1 170px; min-width: 0; min-height: var(--btn); font-weight: 650; font-size: 1.08em;
  border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 0 8px; }
#projName:hover { border-color: var(--line); }
#projName:focus { border-color: var(--accent); background: #fff; outline: none; }
.tb { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
#search { flex: 1 1 110px; min-width: 0; min-height: var(--btn); border: 1px solid var(--line);
  border-radius: 6px; padding: 0 8px; background: #fff; }
#zoom { min-height: var(--btn); border: 1px solid var(--line); border-radius: 6px; background: #fff; padding: 0 6px; }
.wn-btn { flex: none; }
.wn-btn .wn-btn-icon { display: none; font-size: 1.15em; }
/* Narrow phones: shrink to an icon-only button (aria-label/title still give it a name). */
@media (max-width: 420px) {
  .wn-btn .wn-btn-full { display: none; }
  .wn-btn .wn-btn-icon { display: inline; }
}
/* K17 "Switch Work/Life" button: highlighted background + suffix while in work-day mode. */
.wl-btn { flex: none; }
.wl-btn[aria-pressed="true"] { background: var(--sel); border-color: var(--accent); color: var(--accent); }
.wl-btn .wl-btn-compact { display: none; }
.wl-btn .wl-btn-suffix { color: var(--muted); font-weight: 400; }
.wl-btn[aria-pressed="true"] .wl-btn-suffix { color: var(--accent); }
@media (max-width: 420px) {
  .wl-btn .wl-btn-full { display: none; }
  .wl-btn .wl-btn-compact { display: inline; }
  .wl-btn .wl-btn-suffix { display: none; }
}
.menu { position: relative; }
.menu > summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  min-height: var(--btn); padding: 0 12px; border: 1px solid var(--line); border-radius: 6px;
  background: #fff; user-select: none; -webkit-user-select: none; }
.menu > summary::-webkit-details-marker { display: none; }
.menu-pop { position: absolute; right: 0; top: calc(100% + 4px); z-index: 30; background: #fff;
  border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 28px rgba(15, 23, 42, .18);
  padding: 4px; display: flex; flex-direction: column; min-width: 250px; max-width: calc(100vw - 16px); }
.menu-pop button { border: none; justify-content: flex-start; text-align: left; border-radius: 6px; }
.menu-pop button:hover { background: var(--sel); }
.menu-pop hr { border: none; border-top: 1px solid var(--line); margin: 4px 0; width: 100%; }
/* On wide screens everything fits on one line: move the menu to the far right. */
@media (min-width: 980px) { .menu { order: 10; } }

/* K14: non-modal save status, overlaid just below the toolbar so it never
   pushes or wraps the toolbar's own buttons (fits at 320 px). */
#saveStatus { position: absolute; left: 8px; top: 100%; margin-top: 4px; z-index: 25;
  background: rgba(17, 24, 39, .92); color: #fff; font-size: 12px; line-height: 1.3;
  padding: 5px 10px; border-radius: 6px; box-shadow: 0 4px 14px rgba(15, 23, 42, .3);
  max-width: calc(100vw - 16px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  opacity: 0; pointer-events: none; transform: translateY(-3px);
  transition: opacity .25s ease, transform .25s ease; }
#saveStatus.show { opacity: 1; transform: translateY(0); }
@media (prefers-reduced-motion: reduce) { #saveStatus { transition: none; } }
@media print { #saveStatus { display: none; } }

/* =============================================================================
   SHEET = table (left) + timeline (right) inside ONE scroll container.
   Horizontal scrolling moves both; the "#" and "Name" columns are sticky.
   ========================================================================== */
#scroller { flex: 1 1 auto; min-height: 0; overflow: auto; position: relative; overscroll-behavior: contain; }
#sheet { position: relative; }
.hdr { position: sticky; top: 0; z-index: 5; display: flex; height: 44px; background: var(--head);
  border-bottom: 1px solid var(--line); }
.hdr .cell { background: var(--head); color: var(--muted); font-weight: 600; font-size: .85em; }
.hdr .sticky { z-index: 6; }
.tlh { flex: none; height: 44px; }
.tlh svg { display: block; }
.body { position: relative; }
/* The timeline SVG lies on top of the (empty) timeline cells of the rows.
   It ignores the mouse except on bars, so clicks on empty space select the row. */
svg.tl { position: absolute; top: 0; z-index: 1; pointer-events: none; display: block; }
svg.tl .bar { pointer-events: auto; cursor: pointer; }
/* Row separators are drawn by each cell (and by the SVG for the timeline part), so the
   sticky cells cover everything that scrolls underneath them, including separators. */
.row { display: flex; height: var(--rh); }
.cell { flex: none; display: flex; align-items: center; height: 100%; padding: 0 4px; background: var(--bg);
  border-right: 1px solid var(--grid); border-bottom: 1px solid var(--grid); overflow: hidden; white-space: nowrap; }
.cell.num { justify-content: flex-end; font-variant-numeric: tabular-nums; }
.sticky { position: sticky; z-index: 3; }
.c-name { border-right: 1px solid var(--line); }
.tlc { flex: none; height: 100%; }
.row:hover .cell { background: var(--hover); }
.row.phase .cell { background: var(--phase-bg); font-weight: 600; }
.row.sel .cell, .row.sel .tlc { background: var(--sel); }
.row.task .c-name { padding-left: 30px; }
@media (pointer: coarse) { .row.task .c-name { padding-left: 18px; } }
.cell input:not([type=checkbox]) { width: 100%; min-width: 0; height: calc(100% - 6px); border: 1px solid transparent;
  border-radius: 4px; background: transparent; padding: 0 4px; text-overflow: ellipsis; font-weight: inherit; }
.cell input:not([type=checkbox]):hover { border-color: var(--line); }
.cell input:not([type=checkbox]):focus { border-color: var(--accent); background: #fff; outline: none; text-overflow: clip; }
.cell input[readonly] { color: var(--muted); cursor: default; }
.cell input[readonly]:hover { border-color: transparent; }
.cell.num input { text-align: right; }
.cell button { min-height: 0; min-width: 0; height: 100%; border: none; border-radius: 0; background: transparent; padding: 0; }
.c-act { padding: 0; }
.c-act button { width: var(--btn); flex: none; color: var(--muted); font-size: 1.05em; }
.c-act button:hover { background: var(--sel); color: var(--fg); }
.idbtn { width: 100%; justify-content: flex-start !important; padding: 0 6px !important; color: var(--accent) !important;
  font-variant-numeric: tabular-nums; font-weight: inherit; }
.tog { width: 26px; flex: none; color: var(--muted) !important; }
@media (pointer: coarse) { .tog { width: 40px; } }
.predbtn { width: 100%; justify-content: flex-start !important; padding: 0 6px !important; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; display: block !important; text-align: left; }
.predbtn.none { color: var(--muted) !important; }
/* Small icon(s) in the name cell (K4: link icon; K5 adds an attachment icon the same way). */
.item-icons { display: flex; flex: none; align-items: center; gap: 2px; }
.icobtn { flex: none; width: 22px !important; height: 22px !important; min-height: 0; min-width: 0; border-radius: 4px; font-size: .92em;
  line-height: 1; color: var(--muted); display: flex; align-items: center; justify-content: center; }
.icobtn:hover { background: var(--sel); color: var(--fg); }
/* Attachment icon (K5) shows a count next to it, so it is wider than the fixed-square link icon. */
.icobtn.cnt { width: auto !important; padding: 0 5px !important; gap: 2px; }
@media (pointer: coarse) { .icobtn { width: 32px !important; height: 32px !important; font-size: 1.02em; } }
.cbx { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; cursor: pointer; }
.cbx input { width: 18px; height: 18px; margin: 0; }
.muted { color: var(--muted); }
.empty { position: sticky; left: 0; padding: 28px 16px; color: var(--muted); max-width: min(560px, 100vw); white-space: normal; }

/* Timeline graphics (inline SVG uses these classes on screen and in print). */
.g1 { stroke: var(--grid); stroke-width: 1; fill: none; }
.g2 { stroke: var(--grid-strong); stroke-width: 1; fill: none; }
.th-l { stroke: var(--line); stroke-width: 1; }
.th-t { font-size: 11px; fill: var(--muted); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.th-b { font-weight: 700; fill: var(--fg); }
.bar-bg { fill: var(--task); }
.bar-pg { fill: var(--task-prog); }
.bar:hover .bar-bg { fill: #93a2b7; }
.ms-c { stroke: var(--ms); stroke-width: 3; }
.ms-open { fill: #fff; }
.ms-done { fill: var(--ms); }
.arrow { stroke: #4b5563; stroke-width: 1.25; fill: none; }
/* Alternating very light columns (days in week view, weeks in month view). */
.zb { fill: #000; fill-opacity: .022; }
/* Public holidays: light vermilion column; the day number in the header is red. */
.hol { fill: #D55E00; fill-opacity: .10; }
.th-hol { fill: var(--danger); font-weight: 700; }
/* Drag-to-link (mouse only): handles appear on the ends of a hovered bar. */
.hdl { fill: #fff; stroke: var(--accent); stroke-width: 2; opacity: 0; pointer-events: none; }
.ahd { fill: transparent; pointer-events: none; }
svg.tl .arrow-hit { stroke: transparent; stroke-width: 10; fill: none; pointer-events: stroke; cursor: pointer; }
@media (pointer: fine) {
  svg.tl .hdl.show { opacity: 1; pointer-events: auto; cursor: crosshair; }
  svg.tl .ahd { pointer-events: auto; cursor: grab; }
}
.dragline { stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; pointer-events: none; }
svg.tl .bar.drop .bar-bg { stroke: var(--accent); stroke-width: 2.5; }
svg.tl .bar.nodrop .bar-bg { stroke: var(--danger); stroke-width: 2.5; }
/* A linked task with a "start no earlier than" constraint: orange mark on its start field. */
.cell input.snet { box-shadow: inset 3px 0 0 #E69F00; }
/* "What next?" dialog (K3): everything except the predecessor/selected/successor and their two arrows is dimmed. */
svg.tl .bar.wn-dim, svg.tl .arrow.wn-dim { opacity: .25; }
/* Today line: red vertical line across the timeline. */
.today-line { stroke: #d00; stroke-width: 2; pointer-events: none; }
/* Today label: small red pill with white text, positioned in the day-number row. */
.today-label-bg { fill: #d00; rx: 3; ry: 3; }
.today-label { fill: #fff; font-weight: 700; font-size: 10px; text-anchor: middle; }
/* Blink animation for the today line on click. */
@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}
svg.tl .today-line.blink { animation: blink 0.4s ease-in-out 3; }
/* With reduced motion preference, no animation. */
@media (prefers-reduced-motion: reduce) {
  svg.tl .today-line.blink { animation: none; }
}

/* Holiday hover tooltip (K11): one reusable element, moved and re-labelled in JS.
   Never intercepts pointer events, so it cannot block link-drag or bar clicks. */
#holTip { position: fixed; z-index: 60; left: 0; top: 0; pointer-events: none; max-width: 260px;
  background: rgba(17, 24, 39, .92); color: #fff; font-size: 12px; line-height: 1.35;
  padding: 5px 9px; border-radius: 6px; box-shadow: 0 4px 14px rgba(15, 23, 42, .3);
  opacity: 0; transform: translateY(3px); transition: opacity .15s ease, transform .15s ease; }
#holTip.show { opacity: 1; transform: translateY(0); }
@media (prefers-reduced-motion: reduce) {
  #holTip { transition: none; }
}
@media print {
  #holTip { display: none; }
}

/* =============================================================================
   DIALOGS (native <dialog>, always modal)
   ========================================================================== */
dialog.dlg { border: none; border-radius: 10px; padding: 16px; width: min(580px, calc(100vw - 16px));
  max-width: calc(100vw - 16px); max-height: calc(100dvh - 16px); overflow: auto; color: var(--fg);
  box-shadow: 0 12px 40px rgba(15, 23, 42, .28); }
dialog::backdrop { background: rgba(15, 23, 42, .45); }
.dlg h2 { margin: 0 0 12px; font-size: 1.15em; }
.dlg h3 { margin: 14px 0 6px; font-size: 1em; }
.dlg p { margin: 0 0 10px; }
.dlg label { display: flex; flex-direction: column; gap: 3px; font-size: .9em; color: var(--muted); margin-bottom: 10px; min-width: 0; }
.dlg input:not([type=checkbox]), .dlg select, .dlg textarea { font-size: var(--fs); padding: 5px 8px; border: 1px solid var(--line);
  border-radius: 6px; min-height: var(--btn); background: #fff; width: 100%; min-width: 0; }
.dlg input:not([type=checkbox]):focus, .dlg select:focus, .dlg textarea:focus { border-color: var(--accent); outline: none; }
.dlg input[readonly] { background: var(--head); color: var(--muted); }
.dlg textarea { resize: vertical; min-height: 64px; }
.dlg label.chk { flex-direction: row; align-items: center; gap: 8px; min-height: var(--btn); align-self: end; color: var(--fg); cursor: pointer; }
.dlg label.chk input { width: 20px; height: 20px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 10px; }
@media (max-width: 520px) { .grid3 { grid-template-columns: 1fr 1fr; } }
@media (max-width: 360px) { .grid2, .grid3 { grid-template-columns: 1fr; } }
.btns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin-top: 14px; }
.btns .spacer { flex: 1; }
.hint { font-size: .85em; color: var(--muted); margin: -4px 0 10px; }
.datebox { display: flex; gap: 4px; }
.datebox .dtxt { flex: 1; }
.pick { position: relative; flex: none; width: var(--btn); min-height: var(--btn); display: flex; align-items: center;
  justify-content: center; border: 1px solid var(--line); border-radius: 6px; color: var(--muted); overflow: hidden; cursor: pointer; background: #fff; }
.dlg .pick-in { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; min-height: 0; padding: 0;
  margin: 0; border: none; cursor: pointer; }
.pick.off { opacity: .4; pointer-events: none; }
fieldset.deps, fieldset.itemsec { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px 4px; margin: 0 0 6px; min-width: 0; }
fieldset.deps legend, fieldset.itemsec legend { font-size: .9em; color: var(--muted); padding: 0 4px; }
.deprow { display: grid; grid-template-columns: minmax(0, 1fr) 72px 76px var(--btn); gap: 6px; margin-bottom: 6px; align-items: center; }
.deprow button { padding: 0; }
/* Links section (K4) - the same row/fieldset pattern K5 reuses for Attachments. */
.linkrow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) var(--btn); gap: 6px; margin-bottom: 6px; align-items: center; }
.linkrow button { padding: 0; }
ul.linklist { margin: 0 0 10px; padding-left: 22px; }
ul.linklist li { margin-bottom: 6px; }
ul.linklist a { color: var(--accent); word-break: break-word; }
/* Attachments section (K5) - list rows with name/date/actions; reuses fieldset.itemsec above. */
.atc-btns { display: flex; flex-wrap: wrap; gap: 8px; margin: 2px 0 8px; }
.atc-btns button { flex: none; }
.atcrow { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px solid var(--grid); }
.atcrow:last-child { border-bottom: none; margin-bottom: 2px; }
.atc-name { flex: 1 1 140px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .95em; }

<!-- ======================================================================
     1. CORE UTILITIES
     ====================================================================== -->
<script id="core-utils">
'use strict';
/*
 * Dates are handled as whole "day numbers": the number of days since
 * 1970-01-01, computed in UTC. Time of day and time zones are ignored on
 * purpose (decision: one time zone, no special handling), so a task that
 * starts on 23.09.2026 starts on that calendar day on every device.
 */

/** Milliseconds in one day. */
const DAY_MS = 86400000;

/** Short English month names for the timeline header. */
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

/**
 * 'YYYY-MM-DD' (the format inside the JSON file) -> day number.
 * Returns NaN for anything that is not a real calendar date (e.g. 2026-02-30).
 */
function isoToDay(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(typeof iso === 'string' ? iso : '');
  if (!m) return NaN;
  const y = +m[1], mo = +m[2], d = +m[3];
  const t = Date.UTC(y, mo - 1, d);
  const dt = new Date(t);
  // Date.UTC silently rolls invalid dates over (31.02 -> 03.03); reject those.
  if (dt.getUTCFullYear() !== y || dt.getUTCMonth() !== mo - 1 || dt.getUTCDate() !== d) return NaN;
  return Math.round(t / DAY_MS);
}

/** Day number -> 'YYYY-MM-DD'. */
function dayToIso(n) { return new Date(n * DAY_MS).toISOString().slice(0, 10); }

/** Day number -> 'DD.MM.YYYY' (the display format everywhere in the UI). */
function dayToDisp(n) {
  const s = dayToIso(n);
  return `${s.slice(8, 10)}.${s.slice(5, 7)}.${s.slice(0, 4)}`;
}

/**
 * User text -> day number. Accepts 'DD.MM.YYYY' and forgiving variants such
 * as '3.9.2026', '03/09/2026', '03-09-2026' or '3. 9. 2026'. NaN when invalid.
 */
function dispToDay(txt) {
  const m = /^\s*(\d{1,2})\s*[.\/-]\s*(\d{1,2})\s*[.\/-]\s*(\d{4})\s*\.?\s*$/.exec(String(txt ?? ''));
  if (!m) return NaN;
  return isoToDay(`${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`);
}

/** Today's local calendar date as a day number. */
function todayDay() {
  const d = new Date();
  return Math.round(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / DAY_MS);
}

/**
 * Weekday index with Monday = 0 ... Sunday = 6 (decision: weeks start on
 * Monday). Day 0 (1970-01-01) was a Thursday, hence the +3.
 */
function mondayIndex(n) { return (((n + 3) % 7) + 7) % 7; }

/** Day number -> {y, m (0-11), d (1-31)}. */
function dayParts(n) {
  const d = new Date(n * DAY_MS);
  return { y: d.getUTCFullYear(), m: d.getUTCMonth(), d: d.getUTCDate() };
}

/** First day of the month containing day n, shifted by k months. */
function firstOfMonth(n, k = 0) {
  const p = dayParts(n);
  return Math.round(Date.UTC(p.y, p.m + k, 1) / DAY_MS);
}

/** First day of the year containing day n, shifted by k years. */
function firstOfYear(n, k = 0) {
  return Math.round(Date.UTC(dayParts(n).y + k, 0, 1) / DAY_MS);
}

/** Escapes text for safe use inside HTML/SVG/XML markup and attributes. */
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/** Rounds v to an integer and clamps it to [min, max]; fallback when not a number. */
function clampInt(v, min, max, fallback) {
  if (v === '' || v === null || v === undefined) return fallback;
  const n = Math.round(Number(v));
  if (!Number.isFinite(n)) return fallback;
  return Math.min(max, Math.max(min, n));
}

/** Turns a project name into something usable as a file name. */
function safeFileName(name) {
  const s = String(name || '').trim()
    .replace(/[\\/:*?"<>|\u0000-\u001f]+/g, '-')
    .replace(/\s+/g, '_')
    .slice(0, 80);
  return s || 'project';
}

/**
 * Offers text as a file download. Works from file:// in Chromium/Edge and
 * in Safari on iOS (the file lands in "Downloads"/"Files").
 */
function download(filename, text, mime) {
  const blob = new Blob([text], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
}

/** Tiny DOM helpers. */
function $(sel, root = document) { return root.querySelector(sel); }
function $$(sel, root = document) { return Array.from(root.querySelectorAll(sel)); }

/** Protocols allowed for a web link (format 1.2, case-insensitive). */
const SAFE_URL_PROTOCOLS = ['https:', 'http:', 'mailto:'];

/**
 * True when `url` is an absolute URL using one of `SAFE_URL_PROTOCOLS`
 * (decision: never render/open "javascript:", "data:" or similar).
 */
function isSafeUrl(url) {
  if (typeof url !== 'string' || !url.trim()) return false;
  let proto;
  try { proto = new URL(url).protocol.toLowerCase(); }
  catch { return false; }
  return SAFE_URL_PROTOCOLS.includes(proto);
}

/**
 * Windows-reserved device names (case-insensitive, regardless of any
 * extension): CON, PRN, AUX, NUL, COM1-9, LPT1-9. Used both to keep a
 * generated attachment folder/file name usable on Windows (`safeName`) and
 * to reject a hand-edited path that uses one (`isSafeRelPath`).
 */
const RESERVED_WIN_NAMES = /^(CON|PRN|AUX|NUL|COM[1-9]|LPT[1-9])$/i;

/**
 * True when `p` is a safe relative attachment/folder path (format 1.2):
 * text, "/" as the only separator, no leading "/", no ".." or "." segment,
 * no empty segment, no Windows drive letter such as "C:", no segment whose
 * base name (before the first dot) is a Windows-reserved device name, and no
 * segment ending in a space or a dot (both invalid on Windows).
 */
function isSafeRelPath(p) {
  if (typeof p !== 'string' || !p.trim()) return false;
  if (p.includes('\\')) return false;
  if (p.startsWith('/')) return false;
  if (/^[A-Za-z]:/.test(p)) return false;
  const segs = p.split('/');
  return segs.every((s) => {
    if (s === '' || s === '.' || s === '..') return false;
    if (/[ .]$/.test(s)) return false;
    if (RESERVED_WIN_NAMES.test(s.split('.')[0])) return false;
    return true;
  });
}
</script>

<!-- ======================================================================
     1b. CORE HOLIDAYS: offline public-holiday calendars
     ====================================================================== -->
<script id="core-holidays">
'use strict';
/*
 * Public holidays are CALCULATED, not downloaded, so they work offline for
 * any year. They are only SHOWN on the timeline (decision): durations stay
 * in calendar days.
 *
 * Slovenia – work-free days (dela prosti dnevi) according to the Zakon o
 * praznikih in dela prostih dnevih v RS (ZPDPD). Holidays that are NOT
 * work-free (e.g. 8 June, 17 August, 23 November) are not included.
 * A holiday on a Sunday is not moved to Monday.
 *
 * USA – the 11 federal holidays (5 U.S.C. 6103, as listed by OPM). A holiday
 * on a Saturday is observed on the Friday before, on a Sunday on the Monday
 * after; the OBSERVED day (the day off) is shown.
 *
 * Checked against official sources in September 2026. Laws can change –
 * single holidays can be switched off per year in Menu → Public holidays.
 */

/** Countries offered in the holidays dialog. */
const HOLIDAY_COUNTRIES = { SI: 'Slovenia', US: 'United States' };
/** Short weekday names (Monday first). */
const WEEKDAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

/** Day number of a calendar date (month 1-12). Day 0 of a month = last day of the previous month. */
function ymd(y, m, d) { return Math.round(Date.UTC(y, m - 1, d) / DAY_MS); }

/** Easter Sunday (Gregorian calendar, "anonymous Gregorian algorithm"). */
function easterSunday(y) {
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4;
  const f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  const month = Math.floor((h + l - 7 * m + 114) / 31), day = ((h + l - 7 * m + 114) % 31) + 1;
  return ymd(y, month, day);
}

/** n-th weekday (0 = Monday) of a month, e.g. 3rd Monday of January. */
function nthWeekday(y, m, wd, n) {
  const first = ymd(y, m, 1);
  return first + ((wd - mondayIndex(first) + 7) % 7) + 7 * (n - 1);
}

/** Last weekday (0 = Monday) of a month, e.g. last Monday of May. */
function lastWeekday(y, m, wd) {
  const last = ymd(y, m + 1, 0);
  return last - ((mondayIndex(last) - wd + 7) % 7);
}

/** Holidays of one country in one year: [{ day, name, key }], sorted by date. */
function holidaysForYear(cc, y) {
  const list = [];
  const add = (day, name) => list.push({ day, name, key: `${cc}:${dayToIso(day)}` });
  if (cc === 'SI') {
    const e = easterSunday(y);
    add(ymd(y, 1, 1), 'New Year (novo leto)');
    add(ymd(y, 1, 2), 'New Year, 2nd day (novo leto)');
    add(ymd(y, 2, 8), 'Prešeren Day (Prešernov dan)');
    add(e, 'Easter Sunday (velikonočna nedelja)');
    add(e + 1, 'Easter Monday (velikonočni ponedeljek)');
    add(ymd(y, 4, 27), 'Day of Uprising Against Occupation (dan upora proti okupatorju)');
    add(ymd(y, 5, 1), 'Labour Day (praznik dela)');
    add(ymd(y, 5, 2), 'Labour Day, 2nd day (praznik dela)');
    add(e + 49, 'Whit Sunday (binkoštna nedelja)');
    add(ymd(y, 6, 25), 'Statehood Day (dan državnosti)');
    add(ymd(y, 8, 15), 'Assumption Day (Marijino vnebovzetje)');
    add(ymd(y, 10, 31), 'Reformation Day (dan reformacije)');
    add(ymd(y, 11, 1), 'Remembrance Day (dan spomina na mrtve)');
    add(ymd(y, 12, 25), 'Christmas (božič)');
    add(ymd(y, 12, 26), 'Independence and Unity Day (dan samostojnosti in enotnosti)');
  } else if (cc === 'US') {
    // Fixed-date holidays move to the nearest weekday; they are computed for
    // this and the next year because 1 January may be observed on 31 December.
    for (const yy of [y, y + 1]) {
      const fixed = [[ymd(yy, 1, 1), "New Year's Day"], [ymd(yy, 6, 19), 'Juneteenth National Independence Day'],
        [ymd(yy, 7, 4), 'Independence Day'], [ymd(yy, 11, 11), 'Veterans Day'], [ymd(yy, 12, 25), 'Christmas Day']];
      for (const [day, name] of fixed) {
        const wd = mondayIndex(day);
        const obs = wd === 5 ? day - 1 : wd === 6 ? day + 1 : day;
        if (dayParts(obs).y === y) add(obs, obs === day ? name : `${name} (observed)`);
      }
    }
    add(nthWeekday(y, 1, 0, 3), 'Birthday of Martin Luther King, Jr.');
    add(nthWeekday(y, 2, 0, 3), "Washington's Birthday");
    add(lastWeekday(y, 5, 0), 'Memorial Day');
    add(nthWeekday(y, 9, 0, 1), 'Labor Day');
    add(nthWeekday(y, 10, 0, 2), 'Columbus Day');
    add(nthWeekday(y, 11, 3, 4), 'Thanksgiving Day');
  }
  return list.sort((a, b) => a.day - b.day);
}

/** Default holiday settings of a new project: Slovenia on, USA available. */
function defaultHolidays() { return { countries: ['SI'], off: [] }; }

/**
 * Holidays to draw between two days: Map day -> ['SI: Christmas (božič)', ...].
 * Only countries switched on and holidays not switched off are included.
 */
function holidayIndex(from, to) {
  const h = state.holidays || defaultHolidays();
  const off = new Set(h.off || []);
  const map = new Map();
  for (const cc of h.countries || []) {
    for (let y = dayParts(from).y; y <= dayParts(to).y; y++) {
      for (const x of holidaysForYear(cc, y)) {
        if (x.day < from || x.day > to || off.has(x.key)) continue;
        if (!map.has(x.day)) map.set(x.day, []);
        map.get(x.day).push(`${cc}: ${x.name}`);
      }
    }
  }
  return map;
}
</script>

     ====================================================================== -->
<script id="core-model">
'use strict';

/** Version written into every saved file. Files with a different MAJOR version are refused. */
const FILE_VERSION = '1.2';
/** Undo depth (decision: 10 steps; an import counts as one step). */
const UNDO_LIMIT = 10;
/** Above this many tasks a one-time, soft performance hint is shown (no hard limit). */
const LARGE_PROJECT = 100;
/** Maximum length of a task note. */
const NOTE_MAX = 600;
/** Maximum length of a web link's label (format 1.2). */
const LINK_LABEL_MAX = 100;
/** Supported dependency types. */
const DEP_TYPES = ['FS', 'SS', 'FF', 'SF'];
/**
 * Okabe-Ito palette: distinguishable for the common types of colour
 * blindness. Phases get these colours in order; with more phases than
 * colours the palette repeats (decision: recycle).
 */
const PALETTE = ['#0072B2', '#E69F00', '#009E73', '#CC79A7', '#56B4E9', '#D55E00', '#F0E442'];

/**
 * The whole project. Shape: { name, attachRoot?, phases: [ { id, name, collapsed, links, attachments, folder?, tasks: [task] } ] }
 * task: { id, name, milestone, start 'YYYY-MM-DD', duration, percent, done, person, note,
 *   deps: [{pred, type, lag}], links: [{label, url}], attachments: [{name, path, added}], folder? }
 * "links" and "attachments" are always arrays (empty when unused, format 1.2); "folder" and the
 * project's "attachRoot" are only ever present once an attachment has actually been filed (see K5).
 */
let state = null;
/** Undo/redo stacks hold JSON snapshots of `state`. */
let undoStack = [];
let redoStack = [];
/** True when there are changes that have not been saved to a JSON file. */
let dirty = false;
/** The large-project hint is shown only once per session. */
let warnedLarge = false;
/** View state that is NOT part of the project file. */
const ui = { zoom: 'week', filter: '', selected: null, days: 'calendar' };  // ui.days (K17): 'calendar' | 'work' (Mon-Fri only), visual only, not saved
/** Counter used to create unique ids such as 't12' or 'p3'. */
let idCounter = 0;

/** True if any phase or task already uses this id. */
function idExists(id) {
  for (const p of state?.phases || []) {
    if (p.id === id) return true;
    for (const t of p.tasks) if (t.id === id) return true;
  }
  return false;
}

/** Creates a new unique id with the given prefix ('t' task, 'p' phase). */
function newId(prefix) {
  let id;
  do { id = prefix + (++idCounter); } while (idExists(id));
  return id;
}

/** After loading a file, make sure new ids continue after the highest existing number. */
function syncIdCounter() {
  const bump = (id) => { const m = /(\d+)$/.exec(id); if (m) idCounter = Math.max(idCounter, Number(m[1])); };
  for (const p of state.phases) { bump(p.id); for (const t of p.tasks) bump(t.id); }
}

/** Factory for a task with sensible defaults (starts today, 5 days). */
function makeTask(o = {}) {
  return { id: newId('t'), name: 'New task', milestone: false, start: dayToIso(todayDay()), duration: 5,
    percent: 0, done: false, person: '', note: '', deps: [], links: [], attachments: [], ...o };
}

/** Factory for an empty phase. */
function makePhase(o = {}) {
  return { id: newId('p'), name: 'New phase', collapsed: false, tasks: [], links: [], attachments: [], ...o };
}

/** All tasks of all phases in display order. */
function allTasks() { return state.phases.flatMap((p) => p.tasks); }

/** Locates a task: { phase, index, task } or null. */
function findTask(id) {
  for (const p of state.phases) {
    const i = p.tasks.findIndex((t) => t.id === id);
    if (i >= 0) return { phase: p, index: i, task: p.tasks[i] };
  }
  return null;
}

/** Locates a phase: { phase, index } or null. */
function findPhase(id) {
  const i = state.phases.findIndex((p) => p.id === id);
  return i >= 0 ? { phase: state.phases[i], index: i } : null;
}

/** The phase right before (dir -1) or after (dir 1) this one, or null. */
function siblingPhase(id, dir) {
  const loc = findPhase(id);
  return loc ? state.phases[loc.index + dir] || null : null;
}

/**
 * Hierarchical numbers derived from the current order (decision: 1, 1.1, 1.2, 2, 2.1 ...).
 * They are recomputed on every render, so moving/deleting rows renumbers automatically.
 */
function numbering() {
  const m = new Map();
  state.phases.forEach((p, i) => {
    m.set(p.id, String(i + 1));
    p.tasks.forEach((t, j) => m.set(t.id, `${i + 1}.${j + 1}`));
  });
  return m;
}

/** Last day (inclusive) of a task; for a milestone the milestone date itself. */
function taskEndDay(t) {
  const s = isoToDay(t.start);
  return t.milestone ? s : s + t.duration - 1;
}

/**
 * Summary of a phase computed from its tasks: first start, last end, span in
 * days and % complete weighted by task duration. null for an empty phase.
 */
function phaseSummary(p) {
  if (!p.tasks.length) return null;
  let s = Infinity, e = -Infinity, w = 0, done = 0;
  for (const t of p.tasks) {
    s = Math.min(s, isoToDay(t.start));
    e = Math.max(e, taskEndDay(t));
    if (!t.milestone) { w += t.duration; done += t.duration * t.percent; }
  }
  return { start: s, end: e, duration: e - s + 1, percent: w ? Math.round(done / w) : 0 };
}

/** Colour of a phase (by its position; the palette repeats after 7 phases). */
function phaseColor(p) { return PALETTE[Math.max(0, state.phases.indexOf(p)) % PALETTE.length]; }

/** Number of dependency links in other tasks that point to task `id`. */
function successorLinkCount(id) {
  let n = 0;
  for (const t of allTasks()) n += t.deps.filter((d) => d.pred === id).length;
  return n;
}

/**
 * Text such as "1.2, 2.1SS+3d, 1.4FF-1d" describing the predecessors of a task
 * (MS Project notation: a plain number means finish-to-start without lag).
 */
function predText(t, num) {
  return t.deps.map((d) => {
    const lag = d.lag ? `${d.lag > 0 ? '+' : ''}${d.lag}d` : '';
    return `${num.get(d.pred) ?? '?'}${d.type === 'FS' && !lag ? '' : d.type}${lag}`;
  }).join(', ');
}

/**
 * Example project shown at every start (the app has no memory between
 * sessions). Dates are relative to today so the example is always current.
 */
function sampleProject(name) {
  idCounter = 0;
  state = { name: name || 'My Project', holidays: defaultHolidays(), phases: [] };   // newId() needs a state to check against
  const base = todayDay() - mondayIndex(todayDay()) - 7;   // Monday of last week
  const d = (n) => dayToIso(base + n);
  const planning = makePhase({ name: 'Planning' });
  const execution = makePhase({ name: 'Execution' });
  const closing = makePhase({ name: 'Testing & handover' });
  const kickoff = makeTask({ name: 'Kick-off meeting', milestone: true, start: d(0), duration: 0, done: true });
  const req = makeTask({ name: 'Define requirements', start: d(0), duration: 5, percent: 100, person: 'Anna' });
  const design = makeTask({ name: 'Design and review', start: d(5), duration: 6, percent: 50, person: 'Luka',
    deps: [{ pred: req.id, type: 'FS', lag: 0 }] });
  const order = makeTask({ name: 'Order equipment', start: d(13), duration: 10, percent: 10, person: 'Anna',
    deps: [{ pred: design.id, type: 'FS', lag: 2 }] });
  const install = makeTask({ name: 'Installation', start: d(18), duration: 8, person: 'Luka',
    deps: [{ pred: order.id, type: 'SS', lag: 5 }] });
  const docs = makeTask({ name: 'Write documentation', start: d(20), duration: 6, person: 'Maja',
    deps: [{ pred: install.id, type: 'FF', lag: 0 }] });
  const test = makeTask({ name: 'Testing', start: d(26), duration: 7, person: 'Maja',
    deps: [{ pred: install.id, type: 'FS', lag: 0 }] });
  const report = makeTask({ name: 'Final report', start: d(33), duration: 3, person: 'Anna',
    deps: [{ pred: test.id, type: 'FS', lag: 0 }, { pred: docs.id, type: 'FS', lag: 0 }] });
  const handover = makeTask({ name: 'Handover', milestone: true, start: d(38), duration: 0 });
  planning.tasks.push(kickoff, req, design);
  execution.tasks.push(order, install, docs);
  closing.tasks.push(test, report, handover);
  state.phases.push(planning, execution, closing);
  return state;
}

/**
 * Runs `mutator` as ONE undoable step: snapshot -> change -> auto-schedule ->
 * store the snapshot if something really changed -> re-render.
 * The mutator may return false to cancel (nothing is recorded).
 */
function commit(mutator) {
  const before = JSON.stringify(state);
  if (mutator() === false) return false;
  schedule();
  if (JSON.stringify(state) !== before) {
    undoStack.push(before);
    if (undoStack.length > UNDO_LIMIT) undoStack.shift();
    redoStack = [];
    dirty = true;
    checkLarge();
  }
  requestRender();
  return true;
}

/** Undo the last step (no confirmation dialog on purpose - it must be quick). */
function undo() {
  if (!undoStack.length) return;
  redoStack.push(JSON.stringify(state));
  state = JSON.parse(undoStack.pop());
  afterHistoryJump();
}

/** Redo the last undone step. */
function redo() {
  if (!redoStack.length) return;
  undoStack.push(JSON.stringify(state));
  if (undoStack.length > UNDO_LIMIT) undoStack.shift();
  state = JSON.parse(redoStack.pop());
  afterHistoryJump();
}

/** Common clean-up after undo/redo. */
function afterHistoryJump() {
  syncIdCounter();
  schedule();
  dirty = true;
  if (ui.selected && !findTask(ui.selected) && !findPhase(ui.selected)) ui.selected = null;
  requestRender();
}

/** Soft, one-time hint for big projects (decision: warn, never block). */
function checkLarge() {
  const n = allTasks().length;
  if (n > LARGE_PROJECT && !warnedLarge) {
    warnedLarge = true;
    setTimeout(() => showMessage('Large project',
      `<p>This project now has <b>${n}</b> tasks. The app is designed for roughly 20–${LARGE_PROJECT} tasks; ` +
      `with more, editing and printing can become slower.</p><p>You can continue — this is only a hint and is shown once.</p>`), 0);
  }
}
</script>

<script id="core-scheduler">
'use strict';
/*
 * Scheduling model
 * ----------------
 * A task occupies the days [start, start + duration - 1]. For the maths we
 * use an EXCLUSIVE finish f = start + duration (the morning after the last
 * day). With that, the four dependency types become simple inequalities for
 * the successor's start s (lag in calendar days, negative = lead):
 *
 *   FS  successor starts after the predecessor finishes:   s >= f_pred + lag
 *   SS  successor starts after the predecessor starts:     s >= s_pred + lag
 *   FF  successor finishes after the predecessor finishes: s + dur >= f_pred + lag
 *   SF  successor finishes after the predecessor starts:   s + dur >= s_pred + lag
 *
 * Tasks WITH predecessors are scheduled "as soon as possible" like in
 * MS Project: their start is the largest of these limits, so they move
 * later AND earlier when their predecessors move. Optionally such a task has
 * a "Start No Earlier Than" date (snet): then its start is the later of the
 * link result and that date (MS Project behaviour). Tasks WITHOUT
 * predecessors keep the start date typed by the user. Milestones never
 * take part in dependencies (decision).
 */

/** Earliest allowed start of the successor for one dependency link. */
function depConstraint(dep, pred, succDuration) {
  const ps = isoToDay(pred.start);
  const pf = ps + pred.duration;
  const lag = Number(dep.lag) || 0;
  switch (dep.type) {
    case 'SS': return ps + lag;
    case 'FF': return pf + lag - succDuration;
    case 'SF': return ps + lag - succDuration;
    default: return pf + lag; // FS
  }
}

/**
 * Orders tasks so that every predecessor comes before its successors
 * (depth-first search). If the links contain a loop, `cycle` is the list of
 * task ids forming it, e.g. [A, B, A] meaning "A depends on B, B depends on A".
 * `depsOf` lets callers test a hypothetical change without applying it.
 */
function topoOrder(tasks, depsOf = (t) => t.deps) {
  const byId = new Map(tasks.map((t) => [t.id, t]));
  const mark = new Map(); // undefined = not visited, 1 = on the current path, 2 = finished
  const order = [];
  const path = [];
  let cycle = null;
  function visit(t) {
    if (cycle) return;
    const m = mark.get(t.id);
    if (m === 2) return;
    if (m === 1) { cycle = path.slice(path.indexOf(t.id)).concat(t.id); return; }
    mark.set(t.id, 1);
    path.push(t.id);
    for (const d of depsOf(t)) {
      const p = byId.get(d.pred);
      if (p) visit(p);
      if (cycle) return;
    }
    path.pop();
    mark.set(t.id, 2);
    order.push(t);
  }
  for (const t of tasks) { visit(t); if (cycle) break; }
  return { order, cycle };
}

/**
 * Recomputes the start of every task that has predecessors. Runs after
 * every change (see commit()). Returns the cycle if one exists (should never
 * happen, because cycles are prevented on input and on import).
 */
function schedule() {
  const tasks = allTasks();
  const { order, cycle } = topoOrder(tasks);
  if (cycle) return cycle;
  const byId = new Map(tasks.map((t) => [t.id, t]));
  for (const t of order) {
    if (!t.deps.length && t.snet) delete t.snet;   // a constraint only makes sense on a linked task
    if (t.milestone || !t.deps.length) continue;
    let earliest = -Infinity;
    for (const d of t.deps) {
      const p = byId.get(d.pred);
      if (p && !p.milestone) earliest = Math.max(earliest, depConstraint(d, p, t.duration));
    }
    // "Start No Earlier Than" (good practice as in MS Project): the task may not start before this date.
    const snet = isoToDay(t.snet);
    if (!isNaN(snet)) earliest = Math.max(earliest, snet);
    if (earliest > -Infinity) t.start = dayToIso(earliest);
  }
  return null;
}

/**
 * Ids of all tasks that depend on task `id`, directly or indirectly. Those
 * tasks can never become predecessors of `id` (that would close a loop), so
 * the task dialog simply does not offer them.
 */
function dependentsOf(id) {
  const successors = new Map();
  for (const t of allTasks()) {
    for (const d of t.deps) {
      if (!successors.has(d.pred)) successors.set(d.pred, []);
      successors.get(d.pred).push(t.id);
    }
  }
  const out = new Set();
  const queue = [id];
  while (queue.length) {
    const x = queue.pop();
    for (const y of successors.get(x) || []) if (!out.has(y)) { out.add(y); queue.push(y); }
  }
  return out;
}

/*
 * "What do I do next" (K3): reusable, pure lookups that mirror schedule()'s
 * own rules, so the dialog always agrees with the chart. Milestones never
 * carry these links (see schedule()/validateProject), so they simply come
 * back as "no predecessor" / "no successor".
 */

/**
 * The DRIVING predecessor of a task: among its dependency links, the one
 * whose constraint (depConstraint) is the largest, i.e. the one that
 * actually produced the task's scheduled start (ties -> first in `deps`,
 * same as schedule()). Returns null when the task has no usable link.
 * `snetActive` is true when "Start no earlier than" is at least as large as
 * that link's constraint, meaning the constraint (also) decided the start.
 */
function drivingPred(taskId) {
  const loc = findTask(taskId);
  if (!loc || !loc.task.deps.length) return null;
  const t = loc.task;
  const byId = new Map(allTasks().map((x) => [x.id, x]));
  let dep = null, val = -Infinity;
  for (const d of t.deps) {
    const p = byId.get(d.pred);
    if (!p) continue;
    const c = depConstraint(d, p, t.duration);
    if (c > val) { val = c; dep = d; }
  }
  if (!dep) return null;
  const snetDay = isoToDay(t.snet);
  return { dep, pred: byId.get(dep.pred), viaSnet: !isNaN(snetDay) && snetDay >= val, snetDay: isNaN(snetDay) ? null : snetDay };
}

/**
 * The FIRST successor of a task: among all tasks that list it as a
 * predecessor, the one with the earliest start; ties -> lower number. Since
 * `allTasks()` is already in display/numbering order, keeping the first
 * match found on a tie gives the lower number for free.
 */
function firstSuccessor(taskId) {
  let best = null, bestStart = Infinity;
  for (const t of allTasks()) {
    const dep = t.deps.find((d) => d.pred === taskId);
    if (!dep) continue;
    const s = isoToDay(t.start);
    if (s < bestStart) { bestStart = s; best = { task: t, dep }; }
  }
  return best;
}

/** Earliest-starting task of a phase (ties -> first task in the phase). */
function phaseEarliestTask(phase) {
  let best = null, bestStart = Infinity;
  for (const t of phase.tasks) {
    const s = isoToDay(t.start);
    if (s < bestStart) { bestStart = s; best = t; }
  }
  return best;
}

/**
 * Driving EXTERNAL predecessor of a phase: among the links of the phase's
 * earliest task that point OUTSIDE the phase, the one with the largest
 * constraint (same rule as drivingPred, restricted to those external
 * links). Returns null when there is none (caller falls back to the
 * previous phase).
 */
function phaseDrivingPred(phaseId) {
  const loc = findPhase(phaseId);
  if (!loc || !loc.phase.tasks.length) return null;
  const et = phaseEarliestTask(loc.phase);
  const inside = new Set(loc.phase.tasks.map((x) => x.id));
  const byId = new Map(allTasks().map((x) => [x.id, x]));
  let dep = null, val = -Infinity;
  for (const d of et.deps) {
    if (inside.has(d.pred)) continue;
    const p = byId.get(d.pred);
    if (!p) continue;
    const c = depConstraint(d, p, et.duration);
    if (c > val) { val = c; dep = d; }
  }
  return dep ? { dep, pred: byId.get(dep.pred), task: et } : null;
}

/**
 * Earliest external successor of ANY task in a phase: a task outside the
 * phase that depends on one of the phase's tasks, earliest start first
 * (ties -> lower number, see firstSuccessor). Returns null when there is
 * none (caller falls back to the next phase).
 */
function phaseFirstSuccessor(phaseId) {
  const loc = findPhase(phaseId);
  if (!loc) return null;
  const inside = new Set(loc.phase.tasks.map((x) => x.id));
  let best = null, bestStart = Infinity;
  for (const t of allTasks()) {
    if (inside.has(t.id)) continue;
    const dep = t.deps.find((d) => inside.has(d.pred));
    if (!dep) continue;
    const s = isoToDay(t.start);
    if (s < bestStart) { bestStart = s; best = { task: t, dep, from: findTask(dep.pred).task }; }
  }
  return best;
}
</script>
