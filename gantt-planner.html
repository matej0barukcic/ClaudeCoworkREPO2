<script id="io">
'use strict';

/**
 * Validates an optional array of web links ({label, url}, format 1.2) found
 * at `path` and returns a clean array (never invalid entries). Missing
 * (`undefined`) is valid and yields an empty array.
 */
function validateLinksField(v, path, err) {
  if (v === undefined) return [];
  if (!Array.isArray(v)) { err(path, 'must be a list [ ... ]'); return []; }
  const out = [];
  v.forEach((l, k) => {
    const LP = `${path}[${k}]`;
    if (!l || typeof l !== 'object' || Array.isArray(l)) { err(LP, 'must be an object { "label": ..., "url": ... }'); return; }
    let ok = true;
    if (l.label !== undefined && typeof l.label !== 'string') { err(`${LP}.label`, 'must be text'); ok = false; }
    else if (typeof l.label === 'string' && l.label.length > LINK_LABEL_MAX) { err(`${LP}.label`, `too long (${l.label.length} characters, maximum ${LINK_LABEL_MAX})`); ok = false; }
    if (!isSafeUrl(l.url)) { err(`${LP}.url`, `must start with "https:", "http:" or "mailto:" (found ${JSON.stringify(l.url)})`); ok = false; }
    if (ok) out.push({ label: typeof l.label === 'string' ? l.label.slice(0, LINK_LABEL_MAX) : '', url: l.url });
  });
  return out;
}

/**
 * Validates an optional array of attachments ({name, path, added}, format
 * 1.2) found at `path` and returns a clean array. Missing is valid and
 * yields an empty array. The files themselves are never touched here (see
 * K5) – this only checks the entries recorded in the project file.
 */
function validateAttachmentsField(v, path, err) {
  if (v === undefined) return [];
  if (!Array.isArray(v)) { err(path, 'must be a list [ ... ]'); return []; }
  const out = [];
  v.forEach((a, k) => {
    const AP = `${path}[${k}]`;
    if (!a || typeof a !== 'object' || Array.isArray(a)) { err(AP, 'must be an object { "name": ..., "path": ..., "added": ... }'); return; }
    let ok = true;
    if (typeof a.name !== 'string' || !a.name.trim()) { err(`${AP}.name`, 'missing or empty file name'); ok = false; }
    if (!isSafeRelPath(a.path)) { err(`${AP}.path`, `must be a relative path with "/" separators, no ".." and no leading "/" (found ${JSON.stringify(a.path)})`); ok = false; }
    if (a.added !== undefined && (typeof a.added !== 'string' || isNaN(isoToDay(a.added)))) { err(`${AP}.added`, `invalid date ${JSON.stringify(a.added)} – expected "YYYY-MM-DD"`); ok = false; }
    if (ok) out.push({ name: a.name, path: a.path, added: typeof a.added === 'string' ? a.added : fileDate() });
  });
  return out;
}

/**
 * Validates an optional subfolder path ("folder" on a phase or task, format
 * 1.2) found at `path`. Returns the clean value, or `undefined` when absent
 * or invalid (the error is already recorded).
 */
function validateFolderField(v, path, err) {
  if (v === undefined) return undefined;
  if (!isSafeRelPath(v)) { err(path, `must be a relative path with "/" separators, no ".." and no leading "/" (found ${JSON.stringify(v)})`); return undefined; }
  return v;
}

/**
 * Checks a parsed JSON object and converts it into a clean project.
 * Collects EVERY problem with its exact location (e.g.
 * "phases[1].tasks[3].start") so a broken file can be fixed by hand
 * (decision: detailed debug messages). Returns { errors: [{path, msg}], project }.
 */
function validateProject(obj) {
  const errors = [];
  const err = (path, msg) => errors.push({ path, msg });
  const isInt = (v) => typeof v === 'number' && Number.isInteger(v);
  if (!obj || typeof obj !== 'object' || Array.isArray(obj)) {
    err('(file)', 'the file must contain one JSON object { ... }');
    return { errors };
  }
  if (typeof obj.version !== 'string') err('version', 'missing or not a text value (expected "1.0")');
  else if (obj.version.split('.')[0] !== FILE_VERSION.split('.')[0]) err('version', `unsupported file version "${obj.version}" – this app reads version 1.x`);
  if (obj.name !== undefined && typeof obj.name !== 'string') err('name', 'must be text');
  if (!Array.isArray(obj.phases)) { err('phases', 'missing or not a list [ ... ]'); return { errors }; }

  const ids = new Set();
  const seen = [];   // [{ task, path }] for the second pass
  const out = { name: typeof obj.name === 'string' && obj.name.trim() ? obj.name : 'Imported project', holidays: defaultHolidays(), phases: [] };
  // Holiday settings (new in file version 1.1; older files get the default: Slovenia).
  if (obj.holidays !== undefined) {
    const h = obj.holidays;
    if (!h || typeof h !== 'object' || Array.isArray(h)) err('holidays', 'must be an object { "countries": [...], "off": [...] }');
    else {
      if (!Array.isArray(h.countries) || h.countries.some((c) => !HOLIDAY_COUNTRIES[c])) err('holidays.countries', `must be a list of country codes: ${Object.keys(HOLIDAY_COUNTRIES).join(', ')}`);
      else out.holidays.countries = [...new Set(h.countries)];
      if (h.off !== undefined && (!Array.isArray(h.off) || h.off.some((k) => typeof k !== 'string'))) err('holidays.off', 'must be a list of texts such as "SI:2026-12-26"');
      else out.holidays.off = [...new Set(h.off || [])];
    }
  }
  const checkId = (v, path) => {
    if (typeof v !== 'string' || !v) { err(path, 'missing or empty id (must be text, e.g. "t1")'); return false; }
    if (ids.has(v)) { err(path, `duplicate id "${v}" – every phase and task needs its own id`); return false; }
    ids.add(v); return true;
  };
  // Project root: optional attachment folder (format 1.2, set once, see K5).
  if (obj.attachRoot !== undefined) {
    if (!isSafeRelPath(obj.attachRoot)) err('attachRoot', `must be a relative folder path with "/" separators, no ".." and no leading "/" (found ${JSON.stringify(obj.attachRoot)})`);
    else out.attachRoot = obj.attachRoot;
  }

  obj.phases.forEach((p, i) => {
    const P = `phases[${i}]`;
    if (!p || typeof p !== 'object' || Array.isArray(p)) { err(P, 'must be an object { ... }'); return; }
    checkId(p.id, `${P}.id`);
    if (typeof p.name !== 'string') err(`${P}.name`, 'missing or not text');
    if (p.collapsed !== undefined && typeof p.collapsed !== 'boolean') err(`${P}.collapsed`, 'must be true or false');
    if (!Array.isArray(p.tasks)) { err(`${P}.tasks`, 'missing or not a list [ ... ]'); return; }
    const phase = { id: p.id, name: String(p.name ?? ''), collapsed: !!p.collapsed,
      links: validateLinksField(p.links, `${P}.links`, err), attachments: validateAttachmentsField(p.attachments, `${P}.attachments`, err), tasks: [] };
    const pFolder = validateFolderField(p.folder, `${P}.folder`, err);
    if (pFolder !== undefined) phase.folder = pFolder;
    p.tasks.forEach((t, j) => {
      const T = `${P}.tasks[${j}]`;
      if (!t || typeof t !== 'object' || Array.isArray(t)) { err(T, 'must be an object { ... }'); return; }
      checkId(t.id, `${T}.id`);
      if (typeof t.name !== 'string') err(`${T}.name`, 'missing or not text');
      if (t.milestone !== undefined && typeof t.milestone !== 'boolean') err(`${T}.milestone`, 'must be true or false');
      const ms = t.milestone === true;
      if (isNaN(isoToDay(t.start))) err(`${T}.start`, `invalid date ${JSON.stringify(t.start)} – expected a real date as "YYYY-MM-DD", e.g. "2026-09-23"`);
      if (!ms && !(isInt(t.duration) && t.duration >= 1)) err(`${T}.duration`, `must be a whole number of days ≥ 1 (found ${JSON.stringify(t.duration)})`);
      if (t.percent !== undefined && !(isInt(t.percent) && t.percent >= 0 && t.percent <= 100)) err(`${T}.percent`, `must be a whole number 0–100 (found ${JSON.stringify(t.percent)})`);
      if (t.done !== undefined && typeof t.done !== 'boolean') err(`${T}.done`, 'must be true or false');
      if (t.person !== undefined && typeof t.person !== 'string') err(`${T}.person`, 'must be text');
      if (t.note !== undefined && typeof t.note !== 'string') err(`${T}.note`, 'must be text');
      else if (typeof t.note === 'string' && t.note.length > NOTE_MAX) err(`${T}.note`, `too long (${t.note.length} characters, maximum ${NOTE_MAX})`);
      const deps = [];
      if (t.deps !== undefined && !Array.isArray(t.deps)) err(`${T}.deps`, 'must be a list [ ... ]');
      else (t.deps || []).forEach((d, k) => {
        const D = `${T}.deps[${k}]`;
        if (!d || typeof d !== 'object') { err(D, 'must be an object { "pred": ..., "type": ..., "lag": ... }'); return; }
        if (typeof d.pred !== 'string' || !d.pred) err(`${D}.pred`, 'missing predecessor id');
        if (!DEP_TYPES.includes(d.type)) err(`${D}.type`, `must be one of ${DEP_TYPES.join(', ')} (found ${JSON.stringify(d.type)})`);
        if (d.lag !== undefined && !isInt(d.lag)) err(`${D}.lag`, `must be a whole number of days (found ${JSON.stringify(d.lag)})`);
        deps.push({ pred: d.pred, type: d.type, lag: isInt(d.lag) ? d.lag : 0 });
      });
      if (ms && deps.length) err(`${T}.deps`, 'milestones cannot have dependencies');
      if (t.snet !== undefined && isNaN(isoToDay(t.snet))) err(`${T}.snet`, `invalid date ${JSON.stringify(t.snet)} – expected "YYYY-MM-DD"`);
      const task = {
        id: t.id, name: String(t.name ?? ''), milestone: ms, start: t.start,
        duration: ms ? 0 : t.duration, percent: ms ? 0 : (isInt(t.percent) ? t.percent : 0),
        done: ms ? t.done === true : false, person: typeof t.person === 'string' ? t.person : '',
        note: typeof t.note === 'string' ? t.note : '', deps,
        links: validateLinksField(t.links, `${T}.links`, err), attachments: validateAttachmentsField(t.attachments, `${T}.attachments`, err),
      };
      if (!ms && deps.length && !isNaN(isoToDay(t.snet))) task.snet = t.snet;
      const tFolder = validateFolderField(t.folder, `${T}.folder`, err);
      if (tFolder !== undefined) task.folder = tFolder;
      phase.tasks.push(task);
      seen.push({ task, path: T });
    });
    out.phases.push(phase);
  });

  // Second pass: links must point to existing, non-milestone, other tasks.
  const byId = new Map(seen.map((x) => [x.task.id, x.task]));
  for (const { task, path } of seen) {
    const used = new Set();
    task.deps.forEach((d, k) => {
      const D = `${path}.deps[${k}].pred`;
      if (typeof d.pred !== 'string' || !d.pred) return;
      if (!byId.has(d.pred)) err(D, `unknown task id "${d.pred}"`);
      else if (d.pred === task.id) err(D, 'a task cannot depend on itself');
      else if (byId.get(d.pred).milestone) err(D, `"${d.pred}" is a milestone – milestones cannot be predecessors`);
      if (used.has(d.pred)) err(D, `predecessor "${d.pred}" is listed twice`);
      used.add(d.pred);
    });
  }
  if (!errors.length) {
    const { cycle } = topoOrder(seen.map((x) => x.task));
    if (cycle) err('deps', `circular dependency: ${cycle.map((id) => `"${byId.get(id)?.name}" (${id})`).join(' depends on ')}`);
  }
  return { errors, project: errors.length ? null : out };
}

/**
 * Finds the character position of the first JSON syntax error with a small
 * strict JSON scanner. Needed because newer browsers no longer include the
 * position in JSON.parse error messages. Returns -1 if no error is found.
 */
function findJsonErrorPos(text) {
  let i = 0;
  const n = text.length;
  const ws = () => { while (i < n && ' \t\n\r'.includes(text[i])) i++; };
  const fail = () => { throw i; };
  function string() {
    i++;                                     // opening quote
    while (i < n) {
      const ch = text[i];
      if (ch === '"') { i++; return; }
      if (ch === '\\') { i += 2; continue; }
      if (ch < ' ') fail();                  // raw line breaks/tabs are not allowed inside strings
      i++;
    }
    fail();
  }
  function value() {
    ws();
    const c = text[i];
    if (c === '{') {
      i++; ws();
      if (text[i] === '}') { i++; return; }
      for (;;) {
        ws(); if (text[i] !== '"') fail(); string();
        ws(); if (text[i] !== ':') fail(); i++;
        value(); ws();
        if (text[i] === ',') { i++; continue; }
        if (text[i] === '}') { i++; return; }
        fail();
      }
    }
    if (c === '[') {
      i++; ws();
      if (text[i] === ']') { i++; return; }
      for (;;) {
        value(); ws();
        if (text[i] === ',') { i++; continue; }
        if (text[i] === ']') { i++; return; }
        fail();
      }
    }
    if (c === '"') { string(); return; }
    const m = /^-?(0|[1-9]\d*)(\.\d+)?([eE][+-]?\d+)?/.exec(text.slice(i, i + 400));
    if (m && m[0]) { i += m[0].length; return; }
    for (const lit of ['true', 'false', 'null']) if (text.startsWith(lit, i)) { i += lit.length; return; }
    fail();
  }
  try { value(); ws(); if (i < n) fail(); return -1; }
  catch (p) { return typeof p === 'number' ? p : -1; }
}

/** Explains where a JSON syntax error is (line, column and the line itself). */
function jsonErrorWhere(e, text) {
  let pos = findJsonErrorPos(text);
  const m = pos < 0 ? /position (\d+)/.exec(e.message) : null;
  if (m) pos = Number(m[1]);
  if (pos >= 0) {
    const before = text.slice(0, pos);
    const line = before.split('\n').length;
    const col = pos - before.lastIndexOf('\n');
    const src = (text.split('\n')[line - 1] || '').slice(0, 160);
    return `<p>Line ${line}, column ${col}:</p><pre>${esc(src)}\n${' '.repeat(Math.max(0, Math.min(col - 1, 160)))}^</pre>`;
  }
  const m2 = /line (\d+) column (\d+)/.exec(e.message);
  return m2 ? `<p>Line ${m2[1]}, column ${m2[2]}.</p>` : '';
}

/**
 * K14: the File System Access handle for the project's JSON file, kept only
 * in memory for this tab/session (never persisted - a fresh session always
 * starts with no remembered file, exactly like `attachState.dirHandle` for
 * the attachments folder, which this is deliberately independent from: the
 * project file and the attachments folder are picked, and can be lost or
 * revoked, separately). `handle` is set once a file was opened or saved via
 * `showOpenFilePicker`/`showSaveFilePicker`; `name` mirrors its file name so
 * the UI can show it without an extra (async) `getFile()` round trip.
 */
const fileState = { handle: null, name: null };

/** Default tooltip of #projName (must match the attribute in the HTML) when no file handle is known. */
const PROJ_NAME_DEFAULT_TITLE = 'Project name (also used as the file name)';

/** K14: shows the remembered file's name as the #projName tooltip once the project is tied to a handle; the default hint otherwise. */
function updateProjNameTitle() {
  const el = $('#projName');
  if (el) el.title = fileState.handle ? fileState.name : PROJ_NAME_DEFAULT_TITLE;
}

/**
 * Opens a project file chosen by the user. On ANY problem the current
 * project stays untouched and a detailed report is shown. A successful
 * import is one undo step, so it can be reverted with Ctrl+Z.
 * `handle` (K14) is the FileSystemFileHandle `file` came from, when opened
 * via `showOpenFilePicker`; omitted (or null) for the plain `<input type=file>`
 * fallback, which forgets any previously remembered file.
 */
async function importFile(file, handle = null) {
  let text;
  try { text = await file.text(); }
  catch (e) { showMessage('Could not read the file', `<p>${esc(file.name)}: ${esc(e.message)}</p><p>Your current project was not changed.</p>`); return; }
  let obj;
  text = text.replace(/^\uFEFF/, '');          // ignore a UTF-8 byte order mark
  try { obj = JSON.parse(text); }
  catch (e) {
    showMessage('Not a valid JSON file',
      `<p><b>${esc(file.name)}</b> could not be opened because it is not valid JSON. Your current project was not changed.</p>` +
      `<p><b>Problem:</b> ${esc(e.message)}</p>${jsonErrorWhere(e, text)}`);
    return;
  }
  const { errors, project } = validateProject(obj);
  if (errors.length) {
    const shown = errors.slice(0, 60);
    showMessage('This file is not a valid project',
      `<p><b>${esc(file.name)}</b> has ${errors.length} problem${errors.length > 1 ? 's' : ''}. Your current project was not changed.</p>` +
      `<ol class="errs">${shown.map((x) => `<li><code>${esc(x.path)}</code> – ${esc(x.msg)}</li>`).join('')}</ol>` +
      (errors.length > shown.length ? `<p>… and ${errors.length - shown.length} more.</p>` : ''));
    return;
  }
  commit(() => { state = project; syncIdCounter(); ui.selected = null; ui.filter = ''; $('#search').value = ''; });
  dirty = false;                       // the project now equals the file on disk
  fileState.handle = handle || null;   // K14: remember it (or forget any older one) for the next Save
  fileState.name = handle ? handle.name : file.name;
  updateProjNameTitle();
  render();
  const tasks = allTasks();
  if (tasks.length) scrollToDay(Math.min(...tasks.map((t) => isoToDay(t.start))), false);
  showMessage('Project opened',
    `<p><b>${esc(file.name)}</b> – ${state.phases.length} phase(s), ${tasks.length} task(s).</p>` +
    `<p class="hint">Opened by mistake? Undo (Ctrl+Z) brings the previous project back.</p>`);
}

/**
 * K14: true when an `AbortError` thrown `elapsedMs` after calling a file
 * picker should be treated as "this picker isn't really usable here" rather
 * than a genuine user cancel. No human closes a native file dialog in under
 * ~200 ms; a picker that rejects that fast is really an embedded webview, a
 * headless browser, or a corporate policy silently refusing it - saving (or
 * opening) must not just go quiet in that case, it must fall back instead.
 */
function isSuspiciouslyFastAbort(elapsedMs) { return elapsedMs < 200; }

/**
 * K14: Menu → "Open project…". Uses `showOpenFilePicker` (Chrome/Edge) so the
 * chosen file's handle can be remembered for later in-place saves, and falls
 * back to the hidden `<input type=file>` (`openFilePicker`, block `ui-events`)
 * when that API does not exist, when the picker fails for any reason other
 * than the user cancelling it, or when an `AbortError` arrives too fast to be
 * a real cancel (`isSuspiciouslyFastAbort`).
 */
async function openProject() {
  if (typeof window.showOpenFilePicker === 'function') {
    let handles;
    const t0 = Date.now();
    try {
      handles = await window.showOpenFilePicker({
        multiple: false,
        types: [{ description: 'JSON project file', accept: { 'application/json': ['.json'] } }],
      });
    } catch (e) {
      if (e && e.name === 'AbortError' && !isSuspiciouslyFastAbort(Date.now() - t0)) return;   // a real cancel: nothing changes
      openFilePicker();   // unusable here (or a too-fast "cancel") - fall back to the hidden input
      return;
    }
    const handle = handles && handles[0];
    if (!handle) return;
    let file;
    try { file = await handle.getFile(); }
    catch (e) { showMessage('Could not open the file', `<p>${esc(e.message || String(e))}</p>`); return; }
    await importFile(file, handle);
    return;
  }
  openFilePicker();
}

/** Today's date as used in file names: YYYY-MM-DD. */
function fileDate() { return dayToIso(todayDay()); }

/** Pure: the project as JSON text in the app's own file format. No side effects (K14: shared by every save path). */
function buildProjectJSON() {
  const data = { version: FILE_VERSION, app: 'Gantt Chart Planner', name: state.name, exported: fileDate(),
    holidays: state.holidays || defaultHolidays(), phases: state.phases };
  if (state.attachRoot) data.attachRoot = state.attachRoot;
  return JSON.stringify(data, null, 2);
}

/**
 * Saves the project as a JSON download (the app's own format). Clears the
 * "unsaved" flag. This is the "download mode" save, unchanged since v3.0: it
 * is what Safari/Firefox always use (no File System Access API), and what
 * Chrome/Edge falls back to when that API exists but turns out unusable
 * (K14: see `saveProject`) - `unavailable` (true) then adds a short note
 * explaining that, so saving never just silently fails.
 */
function exportJSON(unavailable) {
  const fn = `${safeFileName(state.name)}_${fileDate()}.json`;
  download(fn, buildProjectJSON(), 'application/json');
  dirty = false;
  showMessage('Project saved',
    `<p>The project was downloaded as <b>${esc(fn)}</b>.</p>` +
    (unavailable ? `<p class="hint">This browser did not allow saving directly to a file this time, so the project was downloaded instead.</p>` : '') +
    `<p class="hint">Keep this file – it is the only copy of your project. Open it later with Menu → Open project.</p>`);
}

/**
 * K14: "Save (JSON)" / Ctrl+S / "Save as… (JSON)". In Chrome/Edge (where
 * `showSaveFilePicker` exists) writes straight to the remembered file handle
 * with no dialog, unless `saveAs` is true or there is no usable handle (none
 * remembered yet, or permission for it was lost) - then `showSaveFilePicker`
 * asks for a location and the chosen handle is remembered for next time.
 * Everywhere else (no such API) this is exactly `exportJSON()` - unchanged
 * download behaviour.
 *   - Cancelling the picker (a genuine `AbortError`, i.e. not suspiciously
 *     fast - see `isSuspiciouslyFastAbort`) leaves everything exactly as
 *     before: `dirty` is untouched and nothing is shown (no modal, no status).
 *   - Saving must never become impossible just because the File System Access
 *     API exists but does not actually work here (embedded webview, headless
 *     browser, corporate policy, a handle without `createWritable`, …): any
 *     picker failure that is NOT a genuine cancel, and a `createWritable`
 *     that is missing, fall back to `exportJSON(true)` (download, with a note)
 *     instead of leaving the project stuck unsaved.
 *   - A write that DOES start (a real `createWritable`) but then fails shows
 *     an error dialog and leaves `dirty` at true - the project is never
 *     assumed saved unless the write actually completed.
 *   - Only a confirmed successful write clears `dirty` and shows the
 *     non-modal "Saved HH:MM · name.json" toolbar status (`showSaveStatus`).
 */
async function saveProject({ saveAs = false } = {}) {
  if (typeof window.showSaveFilePicker !== 'function') { exportJSON(); return; }

  let handle = null;
  if (!saveAs && fileState.handle) {
    if (await verifyWritePermission(fileState.handle)) handle = fileState.handle;
    else fileState.handle = null;                 // permission lost - ask again below instead of failing silently
  }
  if (!handle) {
    const t0 = Date.now();
    try {
      handle = await window.showSaveFilePicker({
        suggestedName: `${safeFileName(state.name)}.json`,
        types: [{ description: 'JSON project file', accept: { 'application/json': ['.json'] } }],
      });
    } catch (e) {
      if (e && e.name === 'AbortError' && !isSuspiciouslyFastAbort(Date.now() - t0)) return;   // a real cancel: nothing changes
      exportJSON(true);   // unusable here (SecurityError/NotAllowedError/policy/too-fast "cancel", …) - never leave it unsaved
      return;
    }
    if (!(await verifyWritePermission(handle))) {
      showMessage('Permission needed', '<p>Without write permission for this file, the project cannot be saved there. Try again and allow access, or use Menu → “Save as…” to pick a different file.</p>');
      return;
    }
  }
  if (typeof handle.createWritable !== 'function') { exportJSON(true); return; }   // a handle that cannot actually write - fall back
  try {
    const writable = await handle.createWritable();
    await writable.write(buildProjectJSON());
    await writable.close();
  } catch (e) {
    showMessage('Could not save the file', `<p>${esc(e.message || String(e))}</p>` +
      `<p>Your project was <b>not</b> saved and is unchanged. Try again, or use Menu → “Save as…” to choose a different file.</p>`);
    return;                                       // dirty stays true - nothing was actually written
  }
  fileState.handle = handle;
  fileState.name = handle.name || fileState.name || `${safeFileName(state.name)}.json`;
  dirty = false;
  updateProjNameTitle();
  showSaveStatus(fileState.name);
}

/** K14: timer id for the fade-out of #saveStatus, so a second save restarts it instead of stacking timers. */
let saveStatusTimer = null;

/** K14: non-modal "Saved HH:MM · name.json" note in the toolbar, shown after a successful in-place save; fades after 3 s. */
function showSaveStatus(name) {
  const el = $('#saveStatus');
  if (!el) return;
  const now = new Date();
  const hh = String(now.getHours()).padStart(2, '0'), mm = String(now.getMinutes()).padStart(2, '0');
  el.textContent = `Saved ${hh}:${mm} · ${name}`;
  el.classList.add('show');
  clearTimeout(saveStatusTimer);
  saveStatusTimer = setTimeout(() => el.classList.remove('show'), 3000);
}

/** True when any phase or task has web links and/or attachments (format 1.2) to warn about on CSV/XML export. */
function hasLinksOrAttachments() {
  return [...state.phases, ...allTasks()].some((x) => (x.links && x.links.length) || (x.attachments && x.attachments.length));
}

/** One CSV field: quoted when it contains the separator, quotes or line breaks. */
function csvCell(v) {
  const s = String(v ?? '');
  return /[;"\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}

/**
 * CSV for Excel. Semicolon as separator and a UTF-8 BOM, because Excel with
 * Slovenian/European regional settings expects ";" and needs the BOM to show
 * č/š/ž correctly. Outline numbers are written as ="1.2" so Excel does not
 * turn them into dates.
 */
function exportCSV() {
  const num = numbering();
  const rows = [['ID', 'Type', 'Name', 'Start', 'End', 'Duration (days)', '% complete', 'Milestone reached', 'Owner', 'Predecessors', 'Start no earlier than', 'Note']];
  const idCell = (n) => `="${n}"`;
  for (const p of state.phases) {
    const s = phaseSummary(p);
    rows.push([idCell(num.get(p.id)), 'Phase', p.name, s ? dayToDisp(s.start) : '', s ? dayToDisp(s.end) : '', s ? s.duration : '', s ? s.percent : '', '', '', '', '', '']);
    for (const t of p.tasks) {
      const st = isoToDay(t.start);
      rows.push([idCell(num.get(t.id)), t.milestone ? 'Milestone' : 'Task', t.name, dayToDisp(st), dayToDisp(taskEndDay(t)),
        t.milestone ? 0 : t.duration, t.milestone ? '' : t.percent, t.milestone ? (t.done ? 'yes' : 'no') : '',
        t.person, predText(t, num), t.snet ? dayToDisp(isoToDay(t.snet)) : '', t.note]);
    }
  }
  const csv = '\uFEFF' + rows.map((r) => r.map(csvCell).join(';')).join('\r\n');
  const fn = `${safeFileName(state.name)}_${fileDate()}.csv`;
  download(fn, csv, 'text/csv;charset=utf-8');
  showMessage('CSV exported', `<p>Downloaded as <b>${esc(fn)}</b> (separator “;”, UTF-8). It opens directly in Excel.</p>` +
    `<p class="hint">CSV is for reading/analysis only – to continue working in this app, use the JSON file.</p>` +
    (hasLinksOrAttachments() ? `<p class="hint">Links and attachments are only stored in the JSON file; this CSV does not include them.</p>` : ''));
}

/**
 * Basic Microsoft Project XML (MSPDI) export: phases as summary tasks,
 * tasks, milestones, dates, durations, % complete, notes and all four link
 * types with lag. Owners, resources and baselines are NOT exported
 * (decision). A 7-day working calendar (08-12, 13-17) is included so that
 * MS Project keeps the calendar-day durations of this app. Tasks without
 * predecessors get a "Start No Earlier Than" constraint so they keep their
 * dates. Must be verified by opening it in MS Project (see Help).
 */
function exportXML() {
  const num = numbering();
  const uid = new Map();
  let k = 0;
  for (const p of state.phases) { uid.set(p.id, ++k); for (const t of p.tasks) uid.set(t.id, ++k); }
  const dt = (n, time) => `${dayToIso(n)}T${time}`;
  const tasks = allTasks();
  const pStart = tasks.length ? Math.min(...tasks.map((t) => isoToDay(t.start))) : todayDay();
  const pEnd = tasks.length ? Math.max(...tasks.map(taskEndDay)) : todayDay();
  const linkType = { FF: 0, FS: 1, SF: 2, SS: 3 };           // MSPDI codes
  const weekDays = [1, 2, 3, 4, 5, 6, 7].map((n) =>
    `<WeekDay><DayType>${n}</DayType><DayWorking>1</DayWorking><WorkingTimes>` +
    `<WorkingTime><FromTime>08:00:00</FromTime><ToTime>12:00:00</ToTime></WorkingTime>` +
    `<WorkingTime><FromTime>13:00:00</FromTime><ToTime>17:00:00</ToTime></WorkingTime>` +
    `</WorkingTimes></WeekDay>`).join('');
  const out = [];
  for (const p of state.phases) {
    const s = phaseSummary(p);
    const st = s ? s.start : pStart, en = s ? s.end : pStart, days = s ? s.duration : 1;
    out.push(`<Task><UID>${uid.get(p.id)}</UID><ID>${uid.get(p.id)}</ID><Name>${esc(p.name)}</Name><Type>1</Type><IsNull>0</IsNull>` +
      `<WBS>${num.get(p.id)}</WBS><OutlineNumber>${num.get(p.id)}</OutlineNumber><OutlineLevel>1</OutlineLevel>` +
      `<Start>${dt(st, '08:00:00')}</Start><Finish>${dt(en, '17:00:00')}</Finish><Duration>PT${days * 8}H0M0S</Duration>` +
      `<DurationFormat>7</DurationFormat><Milestone>0</Milestone><Summary>1</Summary><PercentComplete>${s ? s.percent : 0}</PercentComplete></Task>`);
    for (const t of p.tasks) {
      const s0 = isoToDay(t.start), ms = t.milestone;
      const links = t.deps.map((d) => `<PredecessorLink><PredecessorUID>${uid.get(d.pred)}</PredecessorUID><Type>${linkType[d.type]}</Type>` +
        `<CrossProject>0</CrossProject><LinkLag>${(Number(d.lag) || 0) * 4800}</LinkLag><LagFormat>7</LagFormat></PredecessorLink>`).join('');
      // ASAP for linked tasks; "Start No Earlier Than" (type 4) for unlinked tasks
      // (keeps their dates) and for linked tasks with an snet constraint.
      const snetDay = !t.deps.length ? s0 : (t.snet ? isoToDay(t.snet) : NaN);
      const constraint = isNaN(snetDay) ? '<ConstraintType>0</ConstraintType>'
        : `<ConstraintType>4</ConstraintType><ConstraintDate>${dt(snetDay, '08:00:00')}</ConstraintDate>`;
      out.push(`<Task><UID>${uid.get(t.id)}</UID><ID>${uid.get(t.id)}</ID><Name>${esc(t.name)}</Name><Type>1</Type><IsNull>0</IsNull>` +
        `<WBS>${num.get(t.id)}</WBS><OutlineNumber>${num.get(t.id)}</OutlineNumber><OutlineLevel>2</OutlineLevel>` +
        `<Start>${dt(s0, '08:00:00')}</Start><Finish>${ms ? dt(s0, '08:00:00') : dt(taskEndDay(t), '17:00:00')}</Finish>` +
        `<Duration>PT${ms ? 0 : t.duration * 8}H0M0S</Duration><DurationFormat>7</DurationFormat>` +
        `<Milestone>${ms ? 1 : 0}</Milestone><Summary>0</Summary><PercentComplete>${ms ? (t.done ? 100 : 0) : t.percent}</PercentComplete>` +
        `${constraint}${t.note ? `<Notes>${esc(t.note)}</Notes>` : ''}${links}</Task>`);
    }
  }
  const xml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n` +
    `<Project xmlns="http://schemas.microsoft.com/project">\n` +
    `<SaveVersion>14</SaveVersion><Name>${esc(safeFileName(state.name))}.xml</Name><Title>${esc(state.name)}</Title>` +
    `<ScheduleFromStart>1</ScheduleFromStart><StartDate>${dt(pStart, '08:00:00')}</StartDate><FinishDate>${dt(pEnd, '17:00:00')}</FinishDate>` +
    `<CalendarUID>1</CalendarUID><DefaultStartTime>08:00:00</DefaultStartTime><DefaultFinishTime>17:00:00</DefaultFinishTime>` +
    `<MinutesPerDay>480</MinutesPerDay><MinutesPerWeek>3360</MinutesPerWeek><DaysPerMonth>30</DaysPerMonth>` +
    `<DurationFormat>7</DurationFormat><WeekStartDay>1</WeekStartDay>\n` +
    `<Calendars><Calendar><UID>1</UID><Name>7-day calendar (Gantt Chart Planner)</Name><IsBaseCalendar>1</IsBaseCalendar>` +
    `<BaseCalendarUID>-1</BaseCalendarUID><WeekDays>${weekDays}</WeekDays></Calendar></Calendars>\n` +
    `<Tasks>\n${out.join('\n')}\n</Tasks>\n</Project>\n`;
  const fn = `${safeFileName(state.name)}_${fileDate()}.xml`;
  download(fn, xml, 'application/xml');
  showMessage('MS Project XML exported',
    `<p>Downloaded as <b>${esc(fn)}</b>. In Microsoft Project use <b>File → Open</b> and choose the file type <b>XML Format</b>.</p>` +
    `<p class="hint">Included: phases, tasks, milestones, dates, durations, % complete, notes and all link types with lag. ` +
    `Not included: owners. This basic export has not been checked against every MS Project version – please verify the result.</p>` +
    (hasLinksOrAttachments() ? `<p class="hint">Links and attachments are only stored in the JSON file; this XML does not include them.</p>` : ''));
}
</script>

<!-- ======================================================================
     5. UI DIALOGS
     ====================================================================== -->
<script id="ui-dialogs">
'use strict';

/** Small calendar icon used by the date-picker buttons. */
const CAL_ICON = '<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="1.5" y="3" width="13" height="11.5" rx="1.5" fill="none" stroke="currentColor"/><path d="M1.5 6.5h13M5 1.5v3M11 1.5v3" stroke="currentColor" fill="none"/></svg>';

/**
 * Creates a modal <dialog>, shows it and removes it from the page when it
 * closes. Esc closes it (returnValue ''). Dialogs can be stacked, e.g. a
 * confirmation on top of the task dialog.
 */
function openDialog(html, onClose) {
  const d = document.createElement('dialog');
  d.className = 'dlg';
  d.innerHTML = html;
  document.body.appendChild(d);
  d.addEventListener('close', () => { d.remove(); if (onClose) onClose(d.returnValue); });
  d.showModal();
  return d;
}

/**
 * Message / question dialog (decision: modal with an explicit button
 * instead of transient toasts). Resolves with the value of the pressed
 * button, or 'cancel' for Esc.
 */
function showMessage(title, bodyHtml, buttons = [{ label: 'OK', value: 'ok', primary: true }]) {
  return new Promise((resolve) => {
    const d = openDialog(
      `<h2>${esc(title)}</h2><div class="dlg-body">${bodyHtml}</div><div class="btns">` +
      buttons.map((b) => `<button data-v="${esc(b.value)}" class="${b.primary ? 'primary' : ''} ${b.danger ? 'danger' : ''}">${esc(b.label)}</button>`).join('') +
      `</div>`,
      (v) => resolve(v || 'cancel'));
    $$('.btns button', d).forEach((b) => b.addEventListener('click', () => d.close(b.dataset.v)));
    const focus = $('button.primary', d) || $('button.danger', d);
    if (focus) focus.focus();
  });
}

/** Yes/No confirmation. Resolves true only when the OK button was pressed. */
async function confirmBox(title, bodyHtml, okLabel = 'OK', danger = false) {
  const v = await showMessage(title, bodyHtml, [
    { label: 'Cancel', value: 'cancel' },
    { label: okLabel, value: 'ok', primary: !danger, danger },
  ]);
  return v === 'ok';
}

/**
 * Connects a DD.MM.YYYY text field with the native date picker hidden
 * behind the calendar button. On phones a tap opens the picker directly;
 * on desktop Chrome/Edge showPicker() opens it.
 */
function wireDatePicker(txt) {
  const btn = txt.parentElement.querySelector('.pick');
  const pick = btn.querySelector('.pick-in');
  const sync = () => { const n = dispToDay(txt.value); pick.value = isNaN(n) ? '' : dayToIso(n); };
  btn.addEventListener('pointerdown', sync);
  pick.addEventListener('focus', sync);
  btn.addEventListener('click', () => {
    if (txt.readOnly) return;
    sync();
    try { pick.showPicker(); } catch (_) { /* e.g. iOS: the tap already opened the native picker */ }
  });
  pick.addEventListener('change', () => {
    const n = isoToDay(pick.value);
    if (!isNaN(n)) { txt.value = dayToDisp(n); txt.dispatchEvent(new Event('change', { bubbles: true })); }
  });
}

/** Markup of a date field with its picker button. */
function dateField(id) {
  return `<span class="datebox"><input id="${id}" class="dtxt" autocomplete="off" placeholder="DD.MM.YYYY">` +
    `<span class="pick" title="Pick a date">${CAL_ICON}<input type="date" class="pick-in" tabindex="-1" aria-hidden="true"></span></span>`;
}

/**
 * Practical examples of the link types (mechanical installation in a
 * pharmaceutical engineering project). Shown in the task dialog, the link
 * dialog and the help.
 */
function depExamplesHTML(collapsible) {
  const dl = `<dl class="ex">
    <dt>FS · Finish-to-start</dt>
    <dd>Install process piping → Pressure-test the piping. The pressure test can start only after the piping is complete.</dd>
    <dt>SS · Start-to-start (here with +2 days lag)</dt>
    <dd>Install pipe supports → Install process piping, SS+2: piping starts 2 days after the supports have started, then both run in parallel with the supports staying ahead.</dd>
    <dt>FF · Finish-to-finish</dt>
    <dd>Install HVAC ductwork → Insulate the ductwork. Insulation cannot finish before the last duct section is installed.</dd>
    <dt>SF · Start-to-finish</dt>
    <dd>Start up the new WFI loop (water for injection) → Operate the old WFI loop. The old loop may only finish once the new one has started, so the WFI supply is never interrupted.</dd>
    <dt>Lag (+ days)</dt>
    <dd>Grout the pump-skid foundation → Set the pump skid, FS+3: the grout needs 3 days to cure before the skid may be placed.</dd>
    <dt>Lead (− days)</dt>
    <dd>Mechanical completion of the CIP skid (clean-in-place) → IQ walk-down (installation qualification), FS−2: the walk-down starts 2 days before mechanical completion, on the sections that are already finished.</dd>
  </dl>`;
  return collapsible ? `<details class="ex"><summary>Examples of FS, SS, FF, SF, lag and lead</summary>${dl}</details>` : dl;
}

/** Opens the details dialog of a task or a phase. */
function openDetails(id, focusDeps) {
  if (findTask(id)) openTaskDialog(id, focusDeps);
  else if (findPhase(id)) openPhaseDialog(id);
}

/**
 * K9: the task/phase dialog already open for `kind:id`, if any. Rapid
 * multi-clicks on the "#" number button or the 📎/🔗 icons (no per-click
 * debounce on those) used to stack a new <dialog> on top for every click,
 * each with its own "Add file..." wiring - confusing on its own, and a real
 * way to end up with two independent attachment actions in flight for the
 * same item. `openTaskDialog`/`openPhaseDialog` check this before creating a
 * new dialog and just focus the existing one instead.
 */
function findOpenItemDialog(kind, id) {
  return $$('dialog.dlg[open]').find((el) => el.dataset.itemDlg === `${kind}:${id}`);
}

/** Brings an already-open item dialog (see `findOpenItemDialog`) to the user's attention instead of opening a second one. */
function focusOpenItemDialog(dlg, focusAttachments) {
  if (focusAttachments) { const sec = $('#atc-sec', dlg); if (sec) sec.scrollIntoView({ block: 'start' }); }
  const target = dlg.querySelector('input, select, textarea, button');
  if (target) target.focus();
}

/* ---------------------------------------------------------------------------
 * LINKS SECTION (K4): a "Links" fieldset (label + URL rows, add/remove) that
 * the task and phase dialogs both embed. `links` is the dialog's own working
 * copy (an array of {label, url}), mutated in place until "Save". This is
 * also the template step K5 copies for the "Attachments" section, and
 * `itemIconsHTML` below is the generic name-cell slot K5 adds its own icon
 * to, so both features are kept easy to extend side by side.
 * ------------------------------------------------------------------------- */

/** One editable row of the Links section. */
function linkRowHTML(link, i) {
  return `<div class="linkrow" data-i="${i}">
    <input data-ln="label" placeholder="Label (optional)" maxlength="${LINK_LABEL_MAX}" value="${esc(link.label || '')}" aria-label="Link label">
    <input data-ln="url" placeholder="https://…" value="${esc(link.url || '')}" aria-label="Link URL" inputmode="url">
    <button type="button" data-ln="rm" title="Remove this link" aria-label="Remove link">&#10005;</button></div>`;
}

/** Static markup of the Links fieldset; the row list itself is filled in by `wireLinksSection`. */
function linksSectionHTML() {
  return `<fieldset class="itemsec"><legend>Links</legend>
    <div id="lnk-rows"></div>
    <button type="button" id="lnk-add">+ Add link</button>
  </fieldset>`;
}

/**
 * Wires a dialog's Links section: `links` is the caller's mutable working
 * array, edited in place (typing updates it without a full re-render; add
 * and remove redraw the rows). The caller reads `links` back on Save.
 */
function wireLinksSection(d, links) {
  const rowsEl = $('#lnk-rows', d);
  function renderRows(focusLast) {
    rowsEl.innerHTML = links.length ? links.map(linkRowHTML).join('')
      : '<p class="hint" style="margin:2px 0 8px">No links yet.</p>';
    if (focusLast) { const ins = $$('input[data-ln="label"]', rowsEl); if (ins.length) ins[ins.length - 1].focus(); }
  }
  rowsEl.addEventListener('input', (e) => {
    const row = e.target.closest('.linkrow');
    if (!row) return;
    const l = links[Number(row.dataset.i)], key = e.target.dataset.ln;
    if (key === 'label') l.label = e.target.value;
    else if (key === 'url') l.url = e.target.value;
  });
  rowsEl.addEventListener('click', (e) => {
    const b = e.target.closest('[data-ln="rm"]');
    if (!b) return;
    links.splice(Number(b.closest('.linkrow').dataset.i), 1);
    renderRows(false);
  });
  $('#lnk-add', d).addEventListener('click', () => { links.push({ label: '', url: '' }); renderRows(true); });
  renderRows(false);
}

/**
 * Validates a dialog's Links draft before Save: trims label/url, silently
 * drops rows left fully empty, and rejects (with `showMessage`, returning
 * null) a row whose URL is missing or uses a protocol other than
 * https/http/mailto. Returns the cleaned array on success.
 */
async function validateLinksDraft(links) {
  const clean = [];
  for (let i = 0; i < links.length; i++) {
    const label = (links[i].label || '').trim().slice(0, LINK_LABEL_MAX);
    const url = (links[i].url || '').trim();
    if (!label && !url) continue;
    if (!isSafeUrl(url)) {
      await showMessage('Invalid link', `<p>Link ${i + 1}${label ? ` (“${esc(label)}”)` : ''} needs a URL starting with "https:", "http:" or "mailto:".</p>`);
      return null;
    }
    clean.push({ label, url });
  }
  return clean;
}

/**
 * Opens the 🔗 icon of a table row (K4): a single link is opened directly in
 * a new tab; two or more open a small dialog listing every labelled link.
 * Filters out anything that is not on the safe-protocol allow-list, so an
 * unsafe URL is never opened/rendered even if it somehow got into state
 * (e.g. a hand-edited file).
 */
function openItemLinks(id) {
  const tl = findTask(id), pl = !tl && findPhase(id);
  const item = tl ? tl.task : (pl ? pl.phase : null);
  if (!item) return;
  const links = (item.links || []).filter((l) => isSafeUrl(l.url));
  if (!links.length) return;
  if (links.length === 1) { window.open(links[0].url, '_blank', 'noopener,noreferrer'); return; }
  const num = numbering();
  const d = openDialog(`
    <h2>Links – ${esc(num.get(id))} ${esc(item.name)}</h2>
    <ul class="linklist">${links.map((l) => `<li><a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.label || l.url)}</a></li>`).join('')}</ul>
    <div class="btns"><button class="primary" id="lk-close">Close</button></div>`);
  $('#lk-close', d).addEventListener('click', () => d.close());
  $('#lk-close', d).focus();
}

/** Opens the 📎 icon of a table row (K5): the item dialog, scrolled to the Attachments section. */
function openItemAttachments(id) {
  if (findTask(id)) openTaskDialog(id, false, true);
  else if (findPhase(id)) openPhaseDialog(id, true);
}

/**
 * HTML of the small icon row shown in a table name cell for a task/phase
 * (K4: 🔗 when it has links; K5 appends a 📎 attachment icon here the same
 * way). Returns '' when the item has no icons to show.
 */
function itemIconsHTML(item) {
  const icons = [];
  const n = (item.links || []).length;
  if (n) {
    const label = n === 1 ? 'Open link' : `Links (${n})`;
    icons.push(`<button type="button" class="icobtn" data-k="${esc(item.id)}|links" data-links="${esc(item.id)}" title="${esc(label)}" aria-label="${esc(label)}">&#128279;</button>`);
  }
  const m = (item.attachments || []).length;
  if (m) {
    const label = m === 1 ? 'Attachments (1)' : `Attachments (${m})`;
    icons.push(`<button type="button" class="icobtn cnt" data-k="${esc(item.id)}|atc" data-attach="${esc(item.id)}" title="${esc(label)}" aria-label="${esc(label)}">&#128206;${m}</button>`);
  }
  return icons.length ? `<span class="item-icons">${icons.join('')}</span>` : '';
}

/**
 * TASK DIALOG: every property of a task, including type (task/milestone),
 * phase, note and the list of predecessors. Changes are applied only on
 * "Save" and form ONE undo step.
 */
function openTaskDialog(id, focusDeps, focusAttachments) {
  const loc = findTask(id);
  if (!loc) return;
  const already = findOpenItemDialog('task', id);   // K9: never a second dialog for the same item
  if (already) { focusOpenItemDialog(already, focusAttachments); return; }
  const t = loc.task;
  const num = numbering();
  const original = JSON.parse(JSON.stringify(t));
  let deps = original.deps.map((d) => ({ ...d }));   // working copy of the predecessor links
  let links = (original.links || []).map((l) => ({ ...l }));   // working copy of the Links section (K4)
  // Tasks that may be chosen as predecessors: no milestones, not itself and
  // nothing that already depends on this task (that would create a loop).
  const blocked = dependentsOf(id);
  blocked.add(id);
  const candidates = allTasks().filter((x) => !x.milestone && !blocked.has(x.id));
  const phaseOpts = state.phases.map((p) =>
    `<option value="${esc(p.id)}"${p.id === loc.phase.id ? ' selected' : ''}>${esc(num.get(p.id) + ' ' + p.name)}</option>`).join('');

  const d = openDialog(`
    <h2>Task ${esc(num.get(id))}</h2>
    <label>Name<input id="f-name" value="${esc(t.name)}" autocomplete="off"></label>
    <div class="grid2">
      <label>Type<select id="f-type"><option value="task">Task</option><option value="ms">Milestone</option></select></label>
      <label>Phase<select id="f-phase">${phaseOpts}</select></label>
    </div>
    <div class="grid3">
      <label>Start${dateField('f-start')}</label>
      <label class="nm">End${dateField('f-end')}</label>
      <label class="nm">Duration (days)<input id="f-dur" type="number" min="1" step="1" inputmode="numeric"></label>
    </div>
    <p class="hint" id="f-auto">The start follows the predecessors below. Shift it relative to a predecessor with lag (+ days) or lead (− days), or keep it from starting too early with “Start no earlier than”.</p>
    <label class="snetrow">Start no earlier than (optional constraint)${dateField('f-snet')}</label>
    <div class="grid3">
      <label class="nm">% complete<input id="f-pct" type="number" min="0" max="100" step="1" inputmode="numeric"></label>
      <label class="ms chk"><input type="checkbox" id="f-done"> Milestone reached</label>
      <label>Owner<input id="f-person" value="${esc(t.person)}" autocomplete="off"></label>
    </div>
    <label>Note <span id="f-cnt"></span><textarea id="f-note" rows="6" maxlength="${NOTE_MAX}">${esc(t.note)}</textarea></label>
    <fieldset class="nm deps"><legend>Predecessors – this task depends on …</legend>
      <div id="f-deps"></div>
      <button type="button" id="f-adddep">+ Add predecessor</button>
      <p class="hint" style="margin:6px 0 0">FS finish-to-start · SS start-to-start · FF finish-to-finish · SF start-to-finish. Lag in calendar days, negative = lead.</p>
      ${depExamplesHTML(true)}
    </fieldset>
    ${linksSectionHTML()}
    ${attachSectionHTML()}
    <div class="btns">
      <button class="danger" id="f-del">Delete</button>
      <button id="f-dup">Duplicate</button>
      <span class="spacer"></span>
      <button id="f-cancel">Cancel</button>
      <button class="primary" id="f-save">Save</button>
    </div>`);
  d.dataset.itemDlg = `task:${id}`;   // K9: lets findOpenItemDialog spot this one

  const f = (sel) => d.querySelector(sel);
  const fName = f('#f-name'), fType = f('#f-type'), fPhase = f('#f-phase'), fStart = f('#f-start'), fEnd = f('#f-end'),
    fDur = f('#f-dur'), fPct = f('#f-pct'), fDone = f('#f-done'), fPerson = f('#f-person'), fNote = f('#f-note'),
    fCnt = f('#f-cnt'), fDeps = f('#f-deps'), fAuto = f('#f-auto');
  const s0 = isoToDay(t.start);
  fType.value = t.milestone ? 'ms' : 'task';
  fStart.value = dayToDisp(s0);
  fDur.value = t.milestone ? 1 : t.duration;
  fEnd.value = dayToDisp(s0 + (t.milestone ? 0 : t.duration - 1));
  fPct.value = t.percent;
  fDone.checked = !!t.done;
  const fSnet = f('#f-snet');
  fSnet.value = t.snet ? dayToDisp(isoToDay(t.snet)) : '';
  fSnet.placeholder = 'none';
  wireDatePicker(fSnet);
  wireDatePicker(fStart);
  wireDatePicker(fEnd);

  /** Current duration from the field (always a whole number >= 1). */
  const curDur = () => { const n = Math.round(Number(fDur.value)); return Number.isFinite(n) && n >= 1 ? n : 1; };

  /** Shows/hides fields depending on the type and locks the start of dependent tasks. */
  function refresh() {
    const ms = fType.value === 'ms';
    $$('.nm', d).forEach((el) => { el.hidden = ms; });
    $$('.ms', d).forEach((el) => { el.hidden = !ms; });
    const auto = !ms && deps.length > 0;
    fStart.readOnly = auto;
    fStart.parentElement.querySelector('.pick').classList.toggle('off', auto);
    fAuto.hidden = !auto;
    f('.snetrow').hidden = !auto;
    fCnt.textContent = `(${fNote.value.length}/${NOTE_MAX})`;
  }

  /** One row of the predecessor list. */
  function depRowHTML(dep, i) {
    const opts = `<option value="">— choose task —</option>` + candidates.map((c) =>
      `<option value="${esc(c.id)}"${c.id === dep.pred ? ' selected' : ''}>${esc(num.get(c.id) + ' ' + c.name)}</option>`).join('');
    return `<div class="deprow" data-i="${i}">
      <select data-dp="pred" aria-label="Predecessor task">${opts}</select>
      <select data-dp="type" aria-label="Link type">${DEP_TYPES.map((x) => `<option${x === dep.type ? ' selected' : ''}>${x}</option>`).join('')}</select>
      <input data-dp="lag" type="number" step="1" value="${Number(dep.lag) || 0}" aria-label="Lag in days" title="Lag in days (negative = lead)">
      <button type="button" data-dp="rm" title="Remove this predecessor" aria-label="Remove">&#10005;</button></div>`;
  }

  /** Redraws the predecessor list. */
  function renderDeps(focusLast) {
    fDeps.innerHTML = deps.length ? deps.map(depRowHTML).join('')
      : '<p class="hint" style="margin:2px 0 8px">No predecessors – the task starts on its own start date.</p>';
    if (focusLast) { const sels = $$('select[data-dp="pred"]', fDeps); if (sels.length) sels[sels.length - 1].focus(); }
    refresh();
  }

  // Keep start, end and duration consistent while typing.
  fStart.addEventListener('change', () => {
    const s = dispToDay(fStart.value);
    if (!isNaN(s)) { fStart.value = dayToDisp(s); fEnd.value = dayToDisp(s + curDur() - 1); }
  });
  fEnd.addEventListener('change', () => {
    const s = dispToDay(fStart.value), e = dispToDay(fEnd.value);
    if (isNaN(s) || isNaN(e)) return;
    const dur = Math.max(1, e - s + 1);          // end before start -> corrected to a 1-day task
    fDur.value = dur;
    fEnd.value = dayToDisp(s + dur - 1);
  });
  fDur.addEventListener('change', () => {
    fDur.value = curDur();
    const s = dispToDay(fStart.value);
    if (!isNaN(s)) fEnd.value = dayToDisp(s + curDur() - 1);
  });
  fPct.addEventListener('change', () => { fPct.value = clampInt(fPct.value, 0, 100, 0); });
  fNote.addEventListener('input', refresh);

  // Task <-> milestone. Milestones have no links, so converting asks first.
  fType.addEventListener('change', async () => {
    if (fType.value === 'ms') {
      const succ = successorLinkCount(id);
      const n = deps.length + succ;
      if (n > 0) {
        const ok = await confirmBox('Convert to milestone?',
          `<p>This task has <b>${deps.length}</b> predecessor link(s) and <b>${succ}</b> successor link(s).</p>` +
          `<p>Milestones cannot have dependencies, so ${n === 1 ? 'this link' : 'these links'} will be removed when you save.</p>`, 'Convert');
        if (!ok) { fType.value = 'task'; refresh(); return; }
      }
      deps = [];
    } else {
      deps = original.milestone ? [] : original.deps.map((x) => ({ ...x }));
      const s = dispToDay(fStart.value);
      if (!isNaN(s)) fEnd.value = dayToDisp(s + curDur() - 1);
    }
    renderDeps(false);
  });

  // Predecessor list editing.
  fDeps.addEventListener('change', (e) => {
    const row = e.target.closest('.deprow');
    if (!row) return;
    const dep = deps[Number(row.dataset.i)];
    const key = e.target.dataset.dp;
    if (key === 'pred') dep.pred = e.target.value;
    else if (key === 'type') dep.type = e.target.value;
    else if (key === 'lag') { dep.lag = clampInt(e.target.value, -100000, 100000, 0); e.target.value = dep.lag; }
    refresh();
  });
  fDeps.addEventListener('click', (e) => {
    const b = e.target.closest('[data-dp="rm"]');
    if (!b) return;
    deps.splice(Number(b.closest('.deprow').dataset.i), 1);
    renderDeps(false);
  });
  f('#f-adddep').addEventListener('click', () => {
    if (!candidates.length) {
      showMessage('No possible predecessor',
        '<p>No other task can be a predecessor of this one. Milestones and tasks that already depend on this task are not offered, to prevent circular dependencies.</p>');
      return;
    }
    deps.push({ pred: '', type: 'FS', lag: 0 });
    renderDeps(true);
  });
  wireLinksSection(d, links);
  wireAttachSection(d, 'task', id);   // K5: works on the live task directly (see attachments block)

  /** Validates the form and applies it as one undo step. Returns true on success. */
  async function save() {
    const active = d.querySelector(':focus');
    if (active && active.matches('input, select, textarea')) active.dispatchEvent(new Event('change', { bubbles: true }));
    const ms = fType.value === 'ms';
    const start = dispToDay(fStart.value);
    if (isNaN(start)) {
      await showMessage('Invalid start date', `<p>“${esc(fStart.value)}” is not a valid date. Please use DD.MM.YYYY, for example ${dayToDisp(todayDay())}.</p>`);
      fStart.focus();
      return false;
    }
    if (!ms && isNaN(dispToDay(fEnd.value))) {
      await showMessage('Invalid end date', `<p>“${esc(fEnd.value)}” is not a valid date. Please use DD.MM.YYYY.</p>`);
      fEnd.focus();
      return false;
    }
    let snet = NaN;
    if (!ms && deps.length && fSnet.value.trim()) {
      snet = dispToDay(fSnet.value);
      if (isNaN(snet)) {
        await showMessage('Invalid date', `<p>“${esc(fSnet.value)}” is not a valid “start no earlier than” date. Use DD.MM.YYYY or leave the field empty.</p>`);
        fSnet.focus();
        return false;
      }
    }
    const clean = [];
    for (let i = 0; i < deps.length && !ms; i++) {
      const x = deps[i];
      if (!x.pred) { await showMessage('Predecessor missing', `<p>Row ${i + 1} of the predecessor list has no task selected. Choose a task or remove the row.</p>`); return false; }
      if (clean.some((c) => c.pred === x.pred)) { await showMessage('Duplicate predecessor', `<p>Task ${esc(num.get(x.pred))} is listed more than once. Keep one link per predecessor.</p>`); return false; }
      clean.push({ pred: x.pred, type: DEP_TYPES.includes(x.type) ? x.type : 'FS', lag: clampInt(x.lag, -100000, 100000, 0) });
    }
    // Safety net (the list above never offers such tasks): no loops allowed.
    const { cycle } = topoOrder(allTasks(), (x) => (x.id === id ? clean : x.deps));
    if (cycle) {
      await showMessage('Circular dependency', `<p>This would create a loop: ${cycle.map((c) => esc(num.get(c))).join(' → ')}. The change was not saved.</p>`);
      return false;
    }
    const cleanLinks = await validateLinksDraft(links);
    if (cleanLinks === null) return false;
    const phaseId = fPhase.value;
    commit(() => {
      const cur = findTask(id);
      if (!cur) return false;
      const tt = cur.task;
      tt.name = fName.value.trim() || 'Untitled task';
      tt.milestone = ms;
      tt.start = dayToIso(start);
      tt.duration = ms ? 0 : curDur();
      tt.percent = ms ? 0 : clampInt(fPct.value, 0, 100, 0);
      tt.done = ms ? fDone.checked : false;
      tt.person = fPerson.value.trim();
      tt.note = fNote.value.slice(0, NOTE_MAX);
      tt.deps = ms ? [] : clean;
      tt.links = cleanLinks;
      if (!isNaN(snet) && clean.length) tt.snet = dayToIso(snet); else delete tt.snet;
      if (ms) for (const x of allTasks()) x.deps = x.deps.filter((dd) => dd.pred !== id);  // milestones cannot be predecessors
      if (phaseId !== cur.phase.id) {
        const np = findPhase(phaseId);
        if (np) { cur.phase.tasks.splice(cur.index, 1); np.phase.tasks.push(tt); np.phase.collapsed = false; }
      }
    });
    return true;
  }

  f('#f-save').addEventListener('click', async () => { if (await save()) d.close('saved'); });
  f('#f-cancel').addEventListener('click', () => d.close('cancel'));
  f('#f-dup').addEventListener('click', async () => { if (await save()) { d.close('dup'); duplicateTask(id); } });
  f('#f-del').addEventListener('click', async () => {
    const succ = successorLinkCount(id);
    const cur = findTask(id);
    const hasAtt = !!(cur && cur.task.attachments && cur.task.attachments.length);
    const ok = await confirmBox('Delete task?',
      `<p>Delete <b>${esc(num.get(id))} ${esc(t.name)}</b>?</p>` +
      (succ ? `<p>${succ} dependency link(s) from other tasks point to it and will be removed.</p>` : '') +
      (hasAtt ? '<p>Its attachment list entries will be removed, but the files themselves stay on disk.</p>' : '') +
      '<p class="hint">You can undo this with Ctrl+Z.</p>', 'Delete', true);
    if (ok) { d.close('del'); deleteTask(id); }
  });
  // Enter in a single-line field = Save.
  d.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.isComposing && e.target.matches('input:not([type=checkbox])')) { e.preventDefault(); f('#f-save').click(); }
  });

  renderDeps(false);
  if (focusAttachments) {
    const sec = $('#atc-sec', d);
    if (sec) sec.scrollIntoView({ block: 'start' });
  } else if (focusDeps) {
    const first = $('select[data-dp="pred"]', fDeps) || f('#f-adddep');
    first.focus();
  } else {
    fName.focus();
  }
}

  const s = phaseSummary(p);
  const d = openDialog(`
    <h2>Phase ${esc(num.get(id))}</h2>

    ${linksSectionHTML()}
    ${attachSectionHTML()}
    <div class="btns">

  wireLinksSection(d, links);
  wireAttachSection(d, 'phase', id);   // K5: works on the live phase directly (see attachments block)
  /** Validates and applies the phase's name and links as one undo step. Returns true on success. */
  async function apply() {
    const cleanLinks = await validateLinksDraft(links);
    if (cleanLinks === null) return false;
    commit(() => {
      const cur = findPhase(id);
      if (!cur) return false;
      cur.phase.name = name.value.trim() || 'Untitled phase';
