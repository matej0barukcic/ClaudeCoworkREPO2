<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Gantt Chart Planner</title>
<!--
==============================================================================
  Gantt Chart Planner — version 2.0
  Author: Matej Barukčić, 2026. For personal use.

  WHAT THIS IS
    A single, self-contained HTML file that works as a small Gantt chart
    editor (a focused subset of Microsoft Project). It runs completely
    offline: no installation, no admin rights, no server, no external
    libraries, no fonts to download, no tracking. Double-click to open.

  HOW DATA IS STORED
    Nothing is stored in the browser (no localStorage, no cookies). The
    project only lives in memory while this page is open. Use
    Menu -> "Save project (JSON)" (Ctrl+S) to download a .json file and
    Menu -> "Open project" to load it again. The browser warns before the
    page is closed while there are unsaved changes.

  CODE ORGANISATION
    Every functional area has its own <script> block. Classic scripts share
    one global scope, so functions and top-level variables declared in an
    earlier block are visible in later blocks. Order matters:
      1. core-utils      date maths, escaping, file download helpers
      1b. core-holidays  offline public holiday calendars (Slovenia, USA)
      2. core-model      project state, sample data, undo/redo
      3. core-scheduler  dependency maths, cycle detection, auto-scheduling
      4. io              JSON import + validation, JSON/CSV/MS Project XML export
      5. ui-dialogs      modal dialogs (message, task, phase, help, welcome)
      6. ui-render       table + timeline (SVG) rendering
      7. ui-print        A4-landscape print layout split across several pages
      8. ui-events       toolbar, keyboard shortcuts, start-up

  PROJECT FILE FORMAT (JSON, version "1.1"; files of version 1.0 still open)
    {
      "version": "1.1",                 required, major version must be 1
      "holidays": { "countries": ["SI"], "off": ["SI:2026-12-26"] },
                                        shown public holidays (SI Slovenia, US United
                                        States) and the ones switched off, per date
      "app": "Gantt Chart Planner",     informative
      "name": "My Project",             project name (also the page title)
      "exported": "2026-09-23",         informative (date of export)
      "phases": [
        { "id": "p1", "name": "Planning", "collapsed": false,
          "tasks": [
            { "id": "t1", "name": "Kick-off", "milestone": true,
              "start": "2026-09-21",   ISO date YYYY-MM-DD
              "duration": 0,           whole calendar days (>= 1 for tasks, 0 for milestones)
              "percent": 0,            0..100, whole numbers (tasks only)
              "done": true,            milestone reached? (milestones only)
              "person": "",            owner (free text)
              "note": "",              max. 200 characters
              "deps": [ { "pred": "t0", "type": "FS", "lag": 0 } ],
              "snet": "2026-10-01"     optional "Start No Earlier Than" of a linked task
            } ] } ] }
    Dependency types: FS finish-to-start, SS start-to-start,
    FF finish-to-finish, SF start-to-finish. "lag" is in calendar days,
    negative values are a lead.
==============================================================================
-->
<style>
/* =============================================================================
   DESIGN TOKENS
   A single fixed light theme (decision: light only). Colours used by the
   timeline are defined here so screen and print share them.
   ========================================================================== */
:root {
  --bg: #ffffff;          /* page and cell background */
  --fg: #1f2328;          /* main text */
  --muted: #5f6b7a;       /* secondary text */
  --line: #d9dee4;        /* borders of controls */
  --grid: #eceff3;        /* thin grid lines / row separators */
  --grid-strong: #c9d0d8; /* week (or month) separators */
  --head: #f5f7f9;        /* header / toolbar background */
  --phase-bg: #f7f8fa;    /* phase row background */
  --sel: #e6effa;         /* selected row */
  --hover: #f8fafc;       /* hovered row */
  --accent: #0b5cad;      /* primary buttons, links, focus ring */
  --danger: #b42318;      /* destructive actions */
  --task: #a9b5c6;        /* task bar (all tasks share one colour) */
  --task-prog: #3e5068;   /* completed part of a task bar */
  --ms: #1f2328;          /* milestone outline / fill when reached */
  --rh: 32px;             /* row height (desktop: compact) */
  --fs: 13px;             /* base font size */
  --btn: 32px;            /* minimum size of buttons */
}
/* Touch devices: at least 44x44 px touch targets and 16 px text
   (iOS Safari zooms into inputs with smaller text). */
@media (pointer: coarse) {
  :root { --rh: 45px; --fs: 16px; --btn: 44px; }
}

/* =============================================================================
   BASE
   ========================================================================== */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
  font: var(--fs)/1.35 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
[hidden] { display: none !important; }
button { font: inherit; color: var(--fg); background: #fff; border: 1px solid var(--line);
  border-radius: 6px; min-height: var(--btn); min-width: var(--btn); padding: 0 10px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
button:hover { background: var(--hover); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover { background: #094c90; }
button.danger { color: var(--danger); border-color: #efc7c2; }
input, select, textarea { font: inherit; color: var(--fg); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
kbd { font: .85em ui-monospace, SFMono-Regular, Consolas, monospace; border: 1px solid var(--line);
  border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: #fff; }

/* =============================================================================
   APP LAYOUT: toolbar on top, scrollable sheet below (fills the screen)
   ========================================================================== */
#app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
#toolbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 8px;
  padding-left: max(8px, env(safe-area-inset-left)); padding-right: max(8px, env(safe-area-inset-right));
  background: var(--head); border-bottom: 1px solid var(--line); flex: none; }
#projName { flex: 1 1 170px; min-width: 0; min-height: var(--btn); font-weight: 650; font-size: 1.08em;
  border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 0 8px; }
#projName:hover { border-color: var(--line); }
#projName:focus { border-color: var(--accent); background: #fff; outline: none; }
.tb { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
#search { flex: 1 1 110px; min-width: 0; min-height: var(--btn); border: 1px solid var(--line);
  border-radius: 6px; padding: 0 8px; background: #fff; }
#zoom { min-height: var(--btn); border: 1px solid var(--line); border-radius: 6px; background: #fff; padding: 0 6px; }
.menu { position: relative; }
.menu > summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  min-height: var(--btn); padding: 0 12px; border: 1px solid var(--line); border-radius: 6px;
  background: #fff; user-select: none; -webkit-user-select: none; }
.menu > summary::-webkit-details-marker { display: none; }
.menu-pop { position: absolute; right: 0; top: calc(100% + 4px); z-index: 30; background: #fff;
  border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 28px rgba(15, 23, 42, .18);
  padding: 4px; display: flex; flex-direction: column; min-width: 250px; max-width: calc(100vw - 16px); }
.menu-pop button { border: none; justify-content: flex-start; text-align: left; border-radius: 6px; }
.menu-pop button:hover { background: var(--sel); }
.menu-pop hr { border: none; border-top: 1px solid var(--line); margin: 4px 0; width: 100%; }
/* On wide screens everything fits on one line: move the menu to the far right. */
@media (min-width: 980px) { .menu { order: 10; } }

/* =============================================================================
   SHEET = table (left) + timeline (right) inside ONE scroll container.
   Horizontal scrolling moves both; the "#" and "Name" columns are sticky.
   ========================================================================== */
#scroller { flex: 1 1 auto; min-height: 0; overflow: auto; position: relative; overscroll-behavior: contain; }
#sheet { position: relative; }
.hdr { position: sticky; top: 0; z-index: 5; display: flex; height: 44px; background: var(--head);
  border-bottom: 1px solid var(--line); }
.hdr .cell { background: var(--head); color: var(--muted); font-weight: 600; font-size: .85em; }
.hdr .sticky { z-index: 6; }
.tlh { flex: none; height: 44px; }
.tlh svg { display: block; }
.body { position: relative; }
/* The timeline SVG lies on top of the (empty) timeline cells of the rows.
   It ignores the mouse except on bars, so clicks on empty space select the row. */
svg.tl { position: absolute; top: 0; z-index: 1; pointer-events: none; display: block; }
svg.tl .bar { pointer-events: auto; cursor: pointer; }
/* Row separators are drawn by each cell (and by the SVG for the timeline part), so the
   sticky cells cover everything that scrolls underneath them, including separators. */
.row { display: flex; height: var(--rh); }
.cell { flex: none; display: flex; align-items: center; height: 100%; padding: 0 4px; background: var(--bg);
  border-right: 1px solid var(--grid); border-bottom: 1px solid var(--grid); overflow: hidden; white-space: nowrap; }
.cell.num { justify-content: flex-end; font-variant-numeric: tabular-nums; }
.sticky { position: sticky; z-index: 3; }
.c-name { border-right: 1px solid var(--line); }
.tlc { flex: none; height: 100%; }
.row:hover .cell { background: var(--hover); }
.row.phase .cell { background: var(--phase-bg); font-weight: 600; }
.row.sel .cell, .row.sel .tlc { background: var(--sel); }
.row.task .c-name { padding-left: 30px; }
@media (pointer: coarse) { .row.task .c-name { padding-left: 18px; } }
.cell input:not([type=checkbox]) { width: 100%; min-width: 0; height: calc(100% - 6px); border: 1px solid transparent;
  border-radius: 4px; background: transparent; padding: 0 4px; text-overflow: ellipsis; font-weight: inherit; }
.cell input:not([type=checkbox]):hover { border-color: var(--line); }
.cell input:not([type=checkbox]):focus { border-color: var(--accent); background: #fff; outline: none; text-overflow: clip; }
.cell input[readonly] { color: var(--muted); cursor: default; }
.cell input[readonly]:hover { border-color: transparent; }
.cell.num input { text-align: right; }
.cell button { min-height: 0; min-width: 0; height: 100%; border: none; border-radius: 0; background: transparent; padding: 0; }
.c-act { padding: 0; }
.c-act button { width: var(--btn); flex: none; color: var(--muted); font-size: 1.05em; }
.c-act button:hover { background: var(--sel); color: var(--fg); }
.idbtn { width: 100%; justify-content: flex-start !important; padding: 0 6px !important; color: var(--accent) !important;
  font-variant-numeric: tabular-nums; font-weight: inherit; }
.tog { width: 26px; flex: none; color: var(--muted) !important; }
@media (pointer: coarse) { .tog { width: 40px; } }
.predbtn { width: 100%; justify-content: flex-start !important; padding: 0 6px !important; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; display: block !important; text-align: left; }
.predbtn.none { color: var(--muted) !important; }
.cbx { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; cursor: pointer; }
.cbx input { width: 18px; height: 18px; margin: 0; }
.muted { color: var(--muted); }
.empty { position: sticky; left: 0; padding: 28px 16px; color: var(--muted); max-width: min(560px, 100vw); white-space: normal; }

/* Timeline graphics (inline SVG uses these classes on screen and in print). */
.g1 { stroke: var(--grid); stroke-width: 1; fill: none; }
.g2 { stroke: var(--grid-strong); stroke-width: 1; fill: none; }
.th-l { stroke: var(--line); stroke-width: 1; }
.th-t { font-size: 11px; fill: var(--muted); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.th-b { font-weight: 700; fill: var(--fg); }
.bar-bg { fill: var(--task); }
.bar-pg { fill: var(--task-prog); }
.bar:hover .bar-bg { fill: #93a2b7; }
.ms-c { stroke: var(--ms); stroke-width: 3; }
.ms-open { fill: #fff; }
.ms-done { fill: var(--ms); }
.arrow { stroke: #4b5563; stroke-width: 1.25; fill: none; }
/* Alternating very light columns (days in week view, weeks in month view). */
.zb { fill: #000; fill-opacity: .022; }
/* Public holidays: light vermilion column; the day number in the header is red. */
.hol { fill: #D55E00; fill-opacity: .10; }
.th-hol { fill: var(--danger); font-weight: 700; }
/* Drag-to-link (mouse only): handles appear on the ends of a hovered bar. */
.hdl { fill: #fff; stroke: var(--accent); stroke-width: 2; opacity: 0; pointer-events: none; }
.ahd { fill: transparent; pointer-events: none; }
svg.tl .arrow-hit { stroke: transparent; stroke-width: 10; fill: none; pointer-events: stroke; cursor: pointer; }
@media (pointer: fine) {
  svg.tl .hdl.show { opacity: 1; pointer-events: auto; cursor: crosshair; }
  svg.tl .ahd { pointer-events: auto; cursor: grab; }
}
.dragline { stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; pointer-events: none; }
svg.tl .bar.drop .bar-bg { stroke: var(--accent); stroke-width: 2.5; }
svg.tl .bar.nodrop .bar-bg { stroke: var(--danger); stroke-width: 2.5; }
/* A linked task with a "start no earlier than" constraint: orange mark on its start field. */
.cell input.snet { box-shadow: inset 3px 0 0 #E69F00; }

/* =============================================================================
   DIALOGS (native <dialog>, always modal)
   ========================================================================== */
dialog.dlg { border: none; border-radius: 10px; padding: 16px; width: min(580px, calc(100vw - 16px));
  max-width: calc(100vw - 16px); max-height: calc(100dvh - 16px); overflow: auto; color: var(--fg);
  box-shadow: 0 12px 40px rgba(15, 23, 42, .28); }
dialog::backdrop { background: rgba(15, 23, 42, .45); }
.dlg h2 { margin: 0 0 12px; font-size: 1.15em; }
.dlg h3 { margin: 14px 0 6px; font-size: 1em; }
.dlg p { margin: 0 0 10px; }
.dlg label { display: flex; flex-direction: column; gap: 3px; font-size: .9em; color: var(--muted); margin-bottom: 10px; min-width: 0; }
.dlg input:not([type=checkbox]), .dlg select, .dlg textarea { font-size: var(--fs); padding: 5px 8px; border: 1px solid var(--line);
  border-radius: 6px; min-height: var(--btn); background: #fff; width: 100%; min-width: 0; }
.dlg input:not([type=checkbox]):focus, .dlg select:focus, .dlg textarea:focus { border-color: var(--accent); outline: none; }
.dlg input[readonly] { background: var(--head); color: var(--muted); }
.dlg textarea { resize: vertical; min-height: 64px; }
.dlg label.chk { flex-direction: row; align-items: center; gap: 8px; min-height: var(--btn); align-self: end; color: var(--fg); cursor: pointer; }
.dlg label.chk input { width: 20px; height: 20px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 10px; }
@media (max-width: 520px) { .grid3 { grid-template-columns: 1fr 1fr; } }
@media (max-width: 360px) { .grid2, .grid3 { grid-template-columns: 1fr; } }
.btns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin-top: 14px; }
.btns .spacer { flex: 1; }
.hint { font-size: .85em; color: var(--muted); margin: -4px 0 10px; }
.datebox { display: flex; gap: 4px; }
.datebox .dtxt { flex: 1; }
.pick { position: relative; flex: none; width: var(--btn); min-height: var(--btn); display: flex; align-items: center;
  justify-content: center; border: 1px solid var(--line); border-radius: 6px; color: var(--muted); overflow: hidden; cursor: pointer; background: #fff; }
.dlg .pick-in { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; min-height: 0; padding: 0;
  margin: 0; border: none; cursor: pointer; }
.pick.off { opacity: .4; pointer-events: none; }
fieldset.deps { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px 4px; margin: 0 0 6px; min-width: 0; }
fieldset.deps legend { font-size: .9em; color: var(--muted); padding: 0 4px; }
.deprow { display: grid; grid-template-columns: minmax(0, 1fr) 72px 76px var(--btn); gap: 6px; margin-bottom: 6px; align-items: center; }
.deprow button { padding: 0; }
.errs { margin: 0 0 10px; padding-left: 22px; max-height: 45vh; overflow: auto; }
.errs li { margin-bottom: 4px; }
.errs code, pre { font: .85em ui-monospace, SFMono-Regular, Consolas, monospace; }
pre { background: var(--head); padding: 6px 8px; border-radius: 6px; overflow: auto; margin: 4px 0 10px; }
.help ul { margin: 0 0 8px; padding-left: 20px; }
.help li { margin-bottom: 5px; }
table.keys { border-collapse: collapse; margin-bottom: 8px; }
table.keys td { padding: 3px 12px 3px 0; vertical-align: top; }
details.ex { margin: 4px 0 8px; }
details.ex > summary { cursor: pointer; color: var(--accent); font-size: .88em; }
dl.ex { margin: 6px 0 0; font-size: .88em; }
dl.ex dt { font-weight: 650; margin-top: 6px; color: var(--fg); }
dl.ex dd { margin: 1px 0 0 0; color: var(--muted); }
.holi { max-height: 48vh; overflow: auto; border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; margin-bottom: 8px; }
.holi h4 { margin: 8px 0 4px; font-size: .95em; }
.holi label.hr { flex-direction: row; align-items: center; gap: 8px; margin: 0; min-height: var(--btn); color: var(--fg); font-size: .92em; }
.holi label.hr input { width: 18px; height: 18px; flex: none; }
.holi .hd { font-variant-numeric: tabular-nums; min-width: 92px; }
.holi .wd { color: var(--muted); min-width: 30px; }

/* =============================================================================
   PRINT (A4 landscape, several pages when the chart is wide or long).
   The printable pages are generated by JavaScript into #printArea just
   before printing; the interactive app is hidden on paper.
   ========================================================================== */
#printArea { display: none; }
.page { width: 1046px; height: 716px; overflow: hidden; display: flex; flex-direction: column; background: #fff;
  font: 10px/1.2 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #111;
  break-after: page; page-break-after: always; }
.page:last-child { break-after: auto; page-break-after: auto; }
.ph { display: flex; justify-content: space-between; align-items: center; gap: 12px; height: 30px; flex: none;
  border-bottom: 1.5px solid #333; font-size: 12px; }
.pb { display: flex; flex: none; }
.pl { flex: none; border-right: 1px solid #bbb; }
.prw { display: flex; border-bottom: 1px solid #e6e8eb; }
.prw > div { padding: 0 4px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; line-height: 21px; border-right: 1px solid #eef0f2; flex: none; }
.prw.hd > div { font-weight: 700; line-height: 20px; padding-top: 4px; }
.prw.phase { font-weight: 700; background: #f3f4f6; }
.pt svg { display: block; }
.pf { margin-top: auto; height: 20px; flex: none; font-size: 9px; color: #444; border-top: 1px solid #ccc; display: flex; align-items: center; }
@media print {
  @page { size: A4 landscape; margin: 10mm; }
  html, body { height: auto !important; overflow: visible !important; background: #fff; }
  #app, dialog { display: none !important; }
  #printArea { display: block !important; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>
<body>
<div id="app">
  <header id="toolbar">
    <input id="projName" aria-label="Project name" title="Project name (also used as the file name)" autocomplete="off">
    <details class="menu" id="menu">
      <summary aria-label="Menu">&#9776; Menu</summary>
      <div class="menu-pop" role="menu">
        <button data-act="open" role="menuitem">Open project (JSON)&hellip;</button>
        <button data-act="save" role="menuitem">Save project (JSON) &nbsp;<span class="muted">Ctrl+S</span></button>
        <hr>
        <button data-act="csv" role="menuitem">Export CSV (Excel)</button>
        <button data-act="xml" role="menuitem">Export MS Project XML</button>
        <button data-act="print" role="menuitem">Print / PDF (A4 landscape)</button>
        <hr>
        <button data-act="holidays" role="menuitem">Public holidays&hellip;</button>
        <hr>
        <button data-act="new" role="menuitem">New empty project</button>
        <button data-act="help" role="menuitem">Help &amp; shortcuts</button>
      </div>
    </details>
    <div class="tb">
      <button id="bAddPhase" title="Add a phase">+ Phase</button>
      <button id="bAddTask" title="Add a task (Alt+N)">+ Task</button>
    </div>
    <div class="tb">
      <button id="bUndo" title="Undo (Ctrl+Z)" aria-label="Undo">&#8630;</button>
      <button id="bRedo" title="Redo (Ctrl+Y)" aria-label="Redo">&#8631;</button>
    </div>
    <div class="tb">
      <select id="zoom" aria-label="Timeline zoom" title="Timeline zoom">
        <option value="week">Week</option>
        <option value="month">Month</option>
      </select>
      <button id="bToday" title="Scroll the timeline to today">Today</button>
    </div>
    <input id="search" type="search" placeholder="Search tasks&hellip;" aria-label="Search tasks by name" autocomplete="off">
  </header>
  <main id="scroller"><div id="sheet"></div></main>
</div>
<div id="printArea" aria-hidden="true"></div>
<!-- Hidden file picker used by "Open project". Kept off-screen instead of
     display:none, because some mobile browsers refuse to open hidden pickers. -->
<input type="file" id="fileInput" accept=".json,application/json" style="position:fixed;left:-9999px;top:0;opacity:0" tabindex="-1" aria-hidden="true">

<!-- ======================================================================
     1. CORE UTILITIES
     ====================================================================== -->
<script id="core-utils">
'use strict';
/*
 * Dates are handled as whole "day numbers": the number of days since
 * 1970-01-01, computed in UTC. Time of day and time zones are ignored on
 * purpose (decision: one time zone, no special handling), so a task that
 * starts on 23.09.2026 starts on that calendar day on every device.
 */

/** Milliseconds in one day. */
const DAY_MS = 86400000;

/** Short English month names for the timeline header. */
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

/**
 * 'YYYY-MM-DD' (the format inside the JSON file) -> day number.
 * Returns NaN for anything that is not a real calendar date (e.g. 2026-02-30).
 */
function isoToDay(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(typeof iso === 'string' ? iso : '');
  if (!m) return NaN;
  const y = +m[1], mo = +m[2], d = +m[3];
  const t = Date.UTC(y, mo - 1, d);
  const dt = new Date(t);
  // Date.UTC silently rolls invalid dates over (31.02 -> 03.03); reject those.
  if (dt.getUTCFullYear() !== y || dt.getUTCMonth() !== mo - 1 || dt.getUTCDate() !== d) return NaN;
  return Math.round(t / DAY_MS);
}

/** Day number -> 'YYYY-MM-DD'. */
function dayToIso(n) { return new Date(n * DAY_MS).toISOString().slice(0, 10); }

/** Day number -> 'DD.MM.YYYY' (the display format everywhere in the UI). */
function dayToDisp(n) {
  const s = dayToIso(n);
  return `${s.slice(8, 10)}.${s.slice(5, 7)}.${s.slice(0, 4)}`;
}

/**
 * User text -> day number. Accepts 'DD.MM.YYYY' and forgiving variants such
 * as '3.9.2026', '03/09/2026', '03-09-2026' or '3. 9. 2026'. NaN when invalid.
 */
function dispToDay(txt) {
  const m = /^\s*(\d{1,2})\s*[.\/-]\s*(\d{1,2})\s*[.\/-]\s*(\d{4})\s*\.?\s*$/.exec(String(txt ?? ''));
  if (!m) return NaN;
  return isoToDay(`${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`);
}

/** Today's local calendar date as a day number. */
function todayDay() {
  const d = new Date();
  return Math.round(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / DAY_MS);
}

/**
 * Weekday index with Monday = 0 ... Sunday = 6 (decision: weeks start on
 * Monday). Day 0 (1970-01-01) was a Thursday, hence the +3.
 */
function mondayIndex(n) { return (((n + 3) % 7) + 7) % 7; }

/** Day number -> {y, m (0-11), d (1-31)}. */
function dayParts(n) {
  const d = new Date(n * DAY_MS);
  return { y: d.getUTCFullYear(), m: d.getUTCMonth(), d: d.getUTCDate() };
}

/** First day of the month containing day n, shifted by k months. */
function firstOfMonth(n, k = 0) {
  const p = dayParts(n);
  return Math.round(Date.UTC(p.y, p.m + k, 1) / DAY_MS);
}

/** First day of the year containing day n, shifted by k years. */
function firstOfYear(n, k = 0) {
  return Math.round(Date.UTC(dayParts(n).y + k, 0, 1) / DAY_MS);
}

/** Escapes text for safe use inside HTML/SVG/XML markup and attributes. */
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/** Rounds v to an integer and clamps it to [min, max]; fallback when not a number. */
function clampInt(v, min, max, fallback) {
  if (v === '' || v === null || v === undefined) return fallback;
  const n = Math.round(Number(v));
  if (!Number.isFinite(n)) return fallback;
  return Math.min(max, Math.max(min, n));
}

/** Turns a project name into something usable as a file name. */
function safeFileName(name) {
  const s = String(name || '').trim()
    .replace(/[\\/:*?"<>|\u0000-\u001f]+/g, '-')
    .replace(/\s+/g, '_')
    .slice(0, 80);
  return s || 'project';
}

/**
 * Offers text as a file download. Works from file:// in Chromium/Edge and
 * in Safari on iOS (the file lands in "Downloads"/"Files").
 */
function download(filename, text, mime) {
  const blob = new Blob([text], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
}

/** Tiny DOM helpers. */
function $(sel, root = document) { return root.querySelector(sel); }
function $$(sel, root = document) { return Array.from(root.querySelectorAll(sel)); }
</script>

<!-- ======================================================================
     1b. CORE HOLIDAYS: offline public-holiday calendars
     ====================================================================== -->
<script id="core-holidays">
'use strict';
/*
 * Public holidays are CALCULATED, not downloaded, so they work offline for
 * any year. They are only SHOWN on the timeline (decision): durations stay
 * in calendar days.
 *
 * Slovenia – work-free days (dela prosti dnevi) according to the Zakon o
 * praznikih in dela prostih dnevih v RS (ZPDPD). Holidays that are NOT
 * work-free (e.g. 8 June, 17 August, 23 November) are not included.
 * A holiday on a Sunday is not moved to Monday.
 *
 * USA – the 11 federal holidays (5 U.S.C. 6103, as listed by OPM). A holiday
 * on a Saturday is observed on the Friday before, on a Sunday on the Monday
 * after; the OBSERVED day (the day off) is shown.
 *
 * Checked against official sources in September 2026. Laws can change –
 * single holidays can be switched off per year in Menu → Public holidays.
 */

/** Countries offered in the holidays dialog. */
const HOLIDAY_COUNTRIES = { SI: 'Slovenia', US: 'United States' };
/** Short weekday names (Monday first). */
const WEEKDAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

/** Day number of a calendar date (month 1-12). Day 0 of a month = last day of the previous month. */
function ymd(y, m, d) { return Math.round(Date.UTC(y, m - 1, d) / DAY_MS); }

/** Easter Sunday (Gregorian calendar, "anonymous Gregorian algorithm"). */
function easterSunday(y) {
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4;
  const f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  const month = Math.floor((h + l - 7 * m + 114) / 31), day = ((h + l - 7 * m + 114) % 31) + 1;
  return ymd(y, month, day);
}

/** n-th weekday (0 = Monday) of a month, e.g. 3rd Monday of January. */
function nthWeekday(y, m, wd, n) {
  const first = ymd(y, m, 1);
  return first + ((wd - mondayIndex(first) + 7) % 7) + 7 * (n - 1);
}

/** Last weekday (0 = Monday) of a month, e.g. last Monday of May. */
function lastWeekday(y, m, wd) {
  const last = ymd(y, m + 1, 0);
  return last - ((mondayIndex(last) - wd + 7) % 7);
}

/** Holidays of one country in one year: [{ day, name, key }], sorted by date. */
function holidaysForYear(cc, y) {
  const list = [];
  const add = (day, name) => list.push({ day, name, key: `${cc}:${dayToIso(day)}` });
  if (cc === 'SI') {
    const e = easterSunday(y);
    add(ymd(y, 1, 1), 'New Year (novo leto)');
    add(ymd(y, 1, 2), 'New Year, 2nd day (novo leto)');
    add(ymd(y, 2, 8), 'Prešeren Day (Prešernov dan)');
    add(e, 'Easter Sunday (velikonočna nedelja)');
    add(e + 1, 'Easter Monday (velikonočni ponedeljek)');
    add(ymd(y, 4, 27), 'Day of Uprising Against Occupation (dan upora proti okupatorju)');
    add(ymd(y, 5, 1), 'Labour Day (praznik dela)');
    add(ymd(y, 5, 2), 'Labour Day, 2nd day (praznik dela)');
    add(e + 49, 'Whit Sunday (binkoštna nedelja)');
    add(ymd(y, 6, 25), 'Statehood Day (dan državnosti)');
    add(ymd(y, 8, 15), 'Assumption Day (Marijino vnebovzetje)');
    add(ymd(y, 10, 31), 'Reformation Day (dan reformacije)');
    add(ymd(y, 11, 1), 'Remembrance Day (dan spomina na mrtve)');
    add(ymd(y, 12, 25), 'Christmas (božič)');
    add(ymd(y, 12, 26), 'Independence and Unity Day (dan samostojnosti in enotnosti)');
  } else if (cc === 'US') {
    // Fixed-date holidays move to the nearest weekday; they are computed for
    // this and the next year because 1 January may be observed on 31 December.
    for (const yy of [y, y + 1]) {
      const fixed = [[ymd(yy, 1, 1), "New Year's Day"], [ymd(yy, 6, 19), 'Juneteenth National Independence Day'],
        [ymd(yy, 7, 4), 'Independence Day'], [ymd(yy, 11, 11), 'Veterans Day'], [ymd(yy, 12, 25), 'Christmas Day']];
      for (const [day, name] of fixed) {
        const wd = mondayIndex(day);
        const obs = wd === 5 ? day - 1 : wd === 6 ? day + 1 : day;
        if (dayParts(obs).y === y) add(obs, obs === day ? name : `${name} (observed)`);
      }
    }
    add(nthWeekday(y, 1, 0, 3), 'Birthday of Martin Luther King, Jr.');
    add(nthWeekday(y, 2, 0, 3), "Washington's Birthday");
    add(lastWeekday(y, 5, 0), 'Memorial Day');
    add(nthWeekday(y, 9, 0, 1), 'Labor Day');
    add(nthWeekday(y, 10, 0, 2), 'Columbus Day');
    add(nthWeekday(y, 11, 3, 4), 'Thanksgiving Day');
  }
  return list.sort((a, b) => a.day - b.day);
}

/** Default holiday settings of a new project: Slovenia on, USA available. */
function defaultHolidays() { return { countries: ['SI'], off: [] }; }

/**
 * Holidays to draw between two days: Map day -> ['SI: Christmas (božič)', ...].
 * Only countries switched on and holidays not switched off are included.
 */
function holidayIndex(from, to) {
  const h = state.holidays || defaultHolidays();
  const off = new Set(h.off || []);
  const map = new Map();
  for (const cc of h.countries || []) {
    for (let y = dayParts(from).y; y <= dayParts(to).y; y++) {
      for (const x of holidaysForYear(cc, y)) {
        if (x.day < from || x.day > to || off.has(x.key)) continue;
        if (!map.has(x.day)) map.set(x.day, []);
        map.get(x.day).push(`${cc}: ${x.name}`);
      }
    }
  }
  return map;
}
</script>

<!-- ======================================================================
     2. CORE MODEL: state, sample data, undo/redo
     ====================================================================== -->
<script id="core-model">
'use strict';

/** Version written into every saved file. Files with a different MAJOR version are refused. */
const FILE_VERSION = '1.1';
/** Undo depth (decision: 10 steps; an import counts as one step). */
const UNDO_LIMIT = 10;
/** Above this many tasks a one-time, soft performance hint is shown (no hard limit). */
const LARGE_PROJECT = 100;
/** Maximum length of a task note. */
const NOTE_MAX = 200;
/** Supported dependency types. */
const DEP_TYPES = ['FS', 'SS', 'FF', 'SF'];
/**
 * Okabe-Ito palette: distinguishable for the common types of colour
 * blindness. Phases get these colours in order; with more phases than
 * colours the palette repeats (decision: recycle).
 */
const PALETTE = ['#0072B2', '#E69F00', '#009E73', '#CC79A7', '#56B4E9', '#D55E00', '#F0E442'];

/**
 * The whole project. Shape: { name, phases: [ { id, name, collapsed, tasks: [task] } ] }
 * task: { id, name, milestone, start 'YYYY-MM-DD', duration, percent, done, person, note, deps: [{pred, type, lag}] }
 */
let state = null;
/** Undo/redo stacks hold JSON snapshots of `state`. */
let undoStack = [];
let redoStack = [];
/** True when there are changes that have not been saved to a JSON file. */
let dirty = false;
/** The large-project hint is shown only once per session. */
let warnedLarge = false;
/** View state that is NOT part of the project file. */
const ui = { zoom: 'week', filter: '', selected: null };
/** Counter used to create unique ids such as 't12' or 'p3'. */
let idCounter = 0;

/** True if any phase or task already uses this id. */
function idExists(id) {
  for (const p of state?.phases || []) {
    if (p.id === id) return true;
    for (const t of p.tasks) if (t.id === id) return true;
  }
  return false;
}

/** Creates a new unique id with the given prefix ('t' task, 'p' phase). */
function newId(prefix) {
  let id;
  do { id = prefix + (++idCounter); } while (idExists(id));
  return id;
}

/** After loading a file, make sure new ids continue after the highest existing number. */
function syncIdCounter() {
  const bump = (id) => { const m = /(\d+)$/.exec(id); if (m) idCounter = Math.max(idCounter, Number(m[1])); };
  for (const p of state.phases) { bump(p.id); for (const t of p.tasks) bump(t.id); }
}

/** Factory for a task with sensible defaults (starts today, 5 days). */
function makeTask(o = {}) {
  return { id: newId('t'), name: 'New task', milestone: false, start: dayToIso(todayDay()), duration: 5,
    percent: 0, done: false, person: '', note: '', deps: [], ...o };
}

/** Factory for an empty phase. */
function makePhase(o = {}) {
  return { id: newId('p'), name: 'New phase', collapsed: false, tasks: [], ...o };
}

/** All tasks of all phases in display order. */
function allTasks() { return state.phases.flatMap((p) => p.tasks); }

/** Locates a task: { phase, index, task } or null. */
function findTask(id) {
  for (const p of state.phases) {
    const i = p.tasks.findIndex((t) => t.id === id);
    if (i >= 0) return { phase: p, index: i, task: p.tasks[i] };
  }
  return null;
}

/** Locates a phase: { phase, index } or null. */
function findPhase(id) {
  const i = state.phases.findIndex((p) => p.id === id);
  return i >= 0 ? { phase: state.phases[i], index: i } : null;
}

/**
 * Hierarchical numbers derived from the current order (decision: 1, 1.1, 1.2, 2, 2.1 ...).
 * They are recomputed on every render, so moving/deleting rows renumbers automatically.
 */
function numbering() {
  const m = new Map();
  state.phases.forEach((p, i) => {
    m.set(p.id, String(i + 1));
    p.tasks.forEach((t, j) => m.set(t.id, `${i + 1}.${j + 1}`));
  });
  return m;
}

/** Last day (inclusive) of a task; for a milestone the milestone date itself. */
function taskEndDay(t) {
  const s = isoToDay(t.start);
  return t.milestone ? s : s + t.duration - 1;
}

/**
 * Summary of a phase computed from its tasks: first start, last end, span in
 * days and % complete weighted by task duration. null for an empty phase.
 */
function phaseSummary(p) {
  if (!p.tasks.length) return null;
  let s = Infinity, e = -Infinity, w = 0, done = 0;
  for (const t of p.tasks) {
    s = Math.min(s, isoToDay(t.start));
    e = Math.max(e, taskEndDay(t));
    if (!t.milestone) { w += t.duration; done += t.duration * t.percent; }
  }
  return { start: s, end: e, duration: e - s + 1, percent: w ? Math.round(done / w) : 0 };
}

/** Colour of a phase (by its position; the palette repeats after 7 phases). */
function phaseColor(p) { return PALETTE[Math.max(0, state.phases.indexOf(p)) % PALETTE.length]; }

/** Number of dependency links in other tasks that point to task `id`. */
function successorLinkCount(id) {
  let n = 0;
  for (const t of allTasks()) n += t.deps.filter((d) => d.pred === id).length;
  return n;
}

/**
 * Text such as "1.2, 2.1SS+3d, 1.4FF-1d" describing the predecessors of a task
 * (MS Project notation: a plain number means finish-to-start without lag).
 */
function predText(t, num) {
  return t.deps.map((d) => {
    const lag = d.lag ? `${d.lag > 0 ? '+' : ''}${d.lag}d` : '';
    return `${num.get(d.pred) ?? '?'}${d.type === 'FS' && !lag ? '' : d.type}${lag}`;
  }).join(', ');
}

/**
 * Example project shown at every start (the app has no memory between
 * sessions). Dates are relative to today so the example is always current.
 */
function sampleProject(name) {
  idCounter = 0;
  state = { name: name || 'My Project', holidays: defaultHolidays(), phases: [] };   // newId() needs a state to check against
  const base = todayDay() - mondayIndex(todayDay()) - 7;   // Monday of last week
  const d = (n) => dayToIso(base + n);
  const planning = makePhase({ name: 'Planning' });
  const execution = makePhase({ name: 'Execution' });
  const closing = makePhase({ name: 'Testing & handover' });
  const kickoff = makeTask({ name: 'Kick-off meeting', milestone: true, start: d(0), duration: 0, done: true });
  const req = makeTask({ name: 'Define requirements', start: d(0), duration: 5, percent: 100, person: 'Anna' });
  const design = makeTask({ name: 'Design and review', start: d(5), duration: 6, percent: 50, person: 'Luka',
    deps: [{ pred: req.id, type: 'FS', lag: 0 }] });
  const order = makeTask({ name: 'Order equipment', start: d(13), duration: 10, percent: 10, person: 'Anna',
    deps: [{ pred: design.id, type: 'FS', lag: 2 }] });
  const install = makeTask({ name: 'Installation', start: d(18), duration: 8, person: 'Luka',
    deps: [{ pred: order.id, type: 'SS', lag: 5 }] });
  const docs = makeTask({ name: 'Write documentation', start: d(20), duration: 6, person: 'Maja',
    deps: [{ pred: install.id, type: 'FF', lag: 0 }] });
  const test = makeTask({ name: 'Testing', start: d(26), duration: 7, person: 'Maja',
    deps: [{ pred: install.id, type: 'FS', lag: 0 }] });
  const report = makeTask({ name: 'Final report', start: d(33), duration: 3, person: 'Anna',
    deps: [{ pred: test.id, type: 'FS', lag: 0 }, { pred: docs.id, type: 'FS', lag: 0 }] });
  const handover = makeTask({ name: 'Handover', milestone: true, start: d(38), duration: 0 });
  planning.tasks.push(kickoff, req, design);
  execution.tasks.push(order, install, docs);
  closing.tasks.push(test, report, handover);
  state.phases.push(planning, execution, closing);
  return state;
}

/**
 * Runs `mutator` as ONE undoable step: snapshot -> change -> auto-schedule ->
 * store the snapshot if something really changed -> re-render.
 * The mutator may return false to cancel (nothing is recorded).
 */
function commit(mutator) {
  const before = JSON.stringify(state);
  if (mutator() === false) return false;
  schedule();
  if (JSON.stringify(state) !== before) {
    undoStack.push(before);
    if (undoStack.length > UNDO_LIMIT) undoStack.shift();
    redoStack = [];
    dirty = true;
    checkLarge();
  }
  requestRender();
  return true;
}

/** Undo the last step (no confirmation dialog on purpose - it must be quick). */
function undo() {
  if (!undoStack.length) return;
  redoStack.push(JSON.stringify(state));
  state = JSON.parse(undoStack.pop());
  afterHistoryJump();
}

/** Redo the last undone step. */
function redo() {
  if (!redoStack.length) return;
  undoStack.push(JSON.stringify(state));
  if (undoStack.length > UNDO_LIMIT) undoStack.shift();
  state = JSON.parse(redoStack.pop());
  afterHistoryJump();
}

/** Common clean-up after undo/redo. */
function afterHistoryJump() {
  syncIdCounter();
  schedule();
  dirty = true;
  if (ui.selected && !findTask(ui.selected) && !findPhase(ui.selected)) ui.selected = null;
  requestRender();
}

/** Soft, one-time hint for big projects (decision: warn, never block). */
function checkLarge() {
  const n = allTasks().length;
  if (n > LARGE_PROJECT && !warnedLarge) {
    warnedLarge = true;
    setTimeout(() => showMessage('Large project',
      `<p>This project now has <b>${n}</b> tasks. The app is designed for roughly 20–${LARGE_PROJECT} tasks; ` +
      `with more, editing and printing can become slower.</p><p>You can continue — this is only a hint and is shown once.</p>`), 0);
  }
}
</script>

<!-- ======================================================================
     3. CORE SCHEDULER: dependencies, cycles, automatic scheduling
     ====================================================================== -->
<script id="core-scheduler">
'use strict';
/*
 * Scheduling model
 * ----------------
 * A task occupies the days [start, start + duration - 1]. For the maths we
 * use an EXCLUSIVE finish f = start + duration (the morning after the last
 * day). With that, the four dependency types become simple inequalities for
 * the successor's start s (lag in calendar days, negative = lead):
 *
 *   FS  successor starts after the predecessor finishes:   s >= f_pred + lag
 *   SS  successor starts after the predecessor starts:     s >= s_pred + lag
 *   FF  successor finishes after the predecessor finishes: s + dur >= f_pred + lag
 *   SF  successor finishes after the predecessor starts:   s + dur >= s_pred + lag
 *
 * Tasks WITH predecessors are scheduled "as soon as possible" like in
 * MS Project: their start is the largest of these limits, so they move
 * later AND earlier when their predecessors move. Optionally such a task has
 * a "Start No Earlier Than" date (snet): then its start is the later of the
 * link result and that date (MS Project behaviour). Tasks WITHOUT
 * predecessors keep the start date typed by the user. Milestones never
 * take part in dependencies (decision).
 */

/** Earliest allowed start of the successor for one dependency link. */
function depConstraint(dep, pred, succDuration) {
  const ps = isoToDay(pred.start);
  const pf = ps + pred.duration;
  const lag = Number(dep.lag) || 0;
  switch (dep.type) {
    case 'SS': return ps + lag;
    case 'FF': return pf + lag - succDuration;
    case 'SF': return ps + lag - succDuration;
    default: return pf + lag; // FS
  }
}

/**
 * Orders tasks so that every predecessor comes before its successors
 * (depth-first search). If the links contain a loop, `cycle` is the list of
 * task ids forming it, e.g. [A, B, A] meaning "A depends on B, B depends on A".
 * `depsOf` lets callers test a hypothetical change without applying it.
 */
function topoOrder(tasks, depsOf = (t) => t.deps) {
  const byId = new Map(tasks.map((t) => [t.id, t]));
  const mark = new Map(); // undefined = not visited, 1 = on the current path, 2 = finished
  const order = [];
  const path = [];
  let cycle = null;
  function visit(t) {
    if (cycle) return;
    const m = mark.get(t.id);
    if (m === 2) return;
    if (m === 1) { cycle = path.slice(path.indexOf(t.id)).concat(t.id); return; }
    mark.set(t.id, 1);
    path.push(t.id);
    for (const d of depsOf(t)) {
      const p = byId.get(d.pred);
      if (p) visit(p);
      if (cycle) return;
    }
    path.pop();
    mark.set(t.id, 2);
    order.push(t);
  }
  for (const t of tasks) { visit(t); if (cycle) break; }
  return { order, cycle };
}

/**
 * Recomputes the start of every task that has predecessors. Runs after
 * every change (see commit()). Returns the cycle if one exists (should never
 * happen, because cycles are prevented on input and on import).
 */
function schedule() {
  const tasks = allTasks();
  const { order, cycle } = topoOrder(tasks);
  if (cycle) return cycle;
  const byId = new Map(tasks.map((t) => [t.id, t]));
  for (const t of order) {
    if (!t.deps.length && t.snet) delete t.snet;   // a constraint only makes sense on a linked task
    if (t.milestone || !t.deps.length) continue;
    let earliest = -Infinity;
    for (const d of t.deps) {
      const p = byId.get(d.pred);
      if (p && !p.milestone) earliest = Math.max(earliest, depConstraint(d, p, t.duration));
    }
    // "Start No Earlier Than" (good practice as in MS Project): the task may not start before this date.
    const snet = isoToDay(t.snet);
    if (!isNaN(snet)) earliest = Math.max(earliest, snet);
    if (earliest > -Infinity) t.start = dayToIso(earliest);
  }
  return null;
}

/**
 * Ids of all tasks that depend on task `id`, directly or indirectly. Those
 * tasks can never become predecessors of `id` (that would close a loop), so
 * the task dialog simply does not offer them.
 */
function dependentsOf(id) {
  const successors = new Map();
  for (const t of allTasks()) {
    for (const d of t.deps) {
      if (!successors.has(d.pred)) successors.set(d.pred, []);
      successors.get(d.pred).push(t.id);
    }
  }
  const out = new Set();
  const queue = [id];
  while (queue.length) {
    const x = queue.pop();
    for (const y of successors.get(x) || []) if (!out.has(y)) { out.add(y); queue.push(y); }
  }
  return out;
}
</script>

<!-- ======================================================================
     4. IO: open (validate) and save/export (JSON, CSV, MS Project XML)
     ====================================================================== -->
<script id="io">
'use strict';

/**
 * Checks a parsed JSON object and converts it into a clean project.
 * Collects EVERY problem with its exact location (e.g.
 * "phases[1].tasks[3].start") so a broken file can be fixed by hand
 * (decision: detailed debug messages). Returns { errors: [{path, msg}], project }.
 */
function validateProject(obj) {
  const errors = [];
  const err = (path, msg) => errors.push({ path, msg });
  const isInt = (v) => typeof v === 'number' && Number.isInteger(v);
  if (!obj || typeof obj !== 'object' || Array.isArray(obj)) {
    err('(file)', 'the file must contain one JSON object { ... }');
    return { errors };
  }
  if (typeof obj.version !== 'string') err('version', 'missing or not a text value (expected "1.0")');
  else if (obj.version.split('.')[0] !== FILE_VERSION.split('.')[0]) err('version', `unsupported file version "${obj.version}" – this app reads version 1.x`);
  if (obj.name !== undefined && typeof obj.name !== 'string') err('name', 'must be text');
  if (!Array.isArray(obj.phases)) { err('phases', 'missing or not a list [ ... ]'); return { errors }; }

  const ids = new Set();
  const seen = [];   // [{ task, path }] for the second pass
  const out = { name: typeof obj.name === 'string' && obj.name.trim() ? obj.name : 'Imported project', holidays: defaultHolidays(), phases: [] };
  // Holiday settings (new in file version 1.1; older files get the default: Slovenia).
  if (obj.holidays !== undefined) {
    const h = obj.holidays;
    if (!h || typeof h !== 'object' || Array.isArray(h)) err('holidays', 'must be an object { "countries": [...], "off": [...] }');
    else {
      if (!Array.isArray(h.countries) || h.countries.some((c) => !HOLIDAY_COUNTRIES[c])) err('holidays.countries', `must be a list of country codes: ${Object.keys(HOLIDAY_COUNTRIES).join(', ')}`);
      else out.holidays.countries = [...new Set(h.countries)];
      if (h.off !== undefined && (!Array.isArray(h.off) || h.off.some((k) => typeof k !== 'string'))) err('holidays.off', 'must be a list of texts such as "SI:2026-12-26"');
      else out.holidays.off = [...new Set(h.off || [])];
    }
  }
  const checkId = (v, path) => {
    if (typeof v !== 'string' || !v) { err(path, 'missing or empty id (must be text, e.g. "t1")'); return false; }
    if (ids.has(v)) { err(path, `duplicate id "${v}" – every phase and task needs its own id`); return false; }
    ids.add(v); return true;
  };

  obj.phases.forEach((p, i) => {
    const P = `phases[${i}]`;
    if (!p || typeof p !== 'object' || Array.isArray(p)) { err(P, 'must be an object { ... }'); return; }
    checkId(p.id, `${P}.id`);
    if (typeof p.name !== 'string') err(`${P}.name`, 'missing or not text');
    if (p.collapsed !== undefined && typeof p.collapsed !== 'boolean') err(`${P}.collapsed`, 'must be true or false');
    if (!Array.isArray(p.tasks)) { err(`${P}.tasks`, 'missing or not a list [ ... ]'); return; }
    const phase = { id: p.id, name: String(p.name ?? ''), collapsed: !!p.collapsed, tasks: [] };
    p.tasks.forEach((t, j) => {
      const T = `${P}.tasks[${j}]`;
      if (!t || typeof t !== 'object' || Array.isArray(t)) { err(T, 'must be an object { ... }'); return; }
      checkId(t.id, `${T}.id`);
      if (typeof t.name !== 'string') err(`${T}.name`, 'missing or not text');
      if (t.milestone !== undefined && typeof t.milestone !== 'boolean') err(`${T}.milestone`, 'must be true or false');
      const ms = t.milestone === true;
      if (isNaN(isoToDay(t.start))) err(`${T}.start`, `invalid date ${JSON.stringify(t.start)} – expected a real date as "YYYY-MM-DD", e.g. "2026-09-23"`);
      if (!ms && !(isInt(t.duration) && t.duration >= 1)) err(`${T}.duration`, `must be a whole number of days ≥ 1 (found ${JSON.stringify(t.duration)})`);
      if (t.percent !== undefined && !(isInt(t.percent) && t.percent >= 0 && t.percent <= 100)) err(`${T}.percent`, `must be a whole number 0–100 (found ${JSON.stringify(t.percent)})`);
      if (t.done !== undefined && typeof t.done !== 'boolean') err(`${T}.done`, 'must be true or false');
      if (t.person !== undefined && typeof t.person !== 'string') err(`${T}.person`, 'must be text');
      if (t.note !== undefined && typeof t.note !== 'string') err(`${T}.note`, 'must be text');
      else if (typeof t.note === 'string' && t.note.length > NOTE_MAX) err(`${T}.note`, `too long (${t.note.length} characters, maximum ${NOTE_MAX})`);
      const deps = [];
      if (t.deps !== undefined && !Array.isArray(t.deps)) err(`${T}.deps`, 'must be a list [ ... ]');
      else (t.deps || []).forEach((d, k) => {
        const D = `${T}.deps[${k}]`;
        if (!d || typeof d !== 'object') { err(D, 'must be an object { "pred": ..., "type": ..., "lag": ... }'); return; }
        if (typeof d.pred !== 'string' || !d.pred) err(`${D}.pred`, 'missing predecessor id');
        if (!DEP_TYPES.includes(d.type)) err(`${D}.type`, `must be one of ${DEP_TYPES.join(', ')} (found ${JSON.stringify(d.type)})`);
        if (d.lag !== undefined && !isInt(d.lag)) err(`${D}.lag`, `must be a whole number of days (found ${JSON.stringify(d.lag)})`);
        deps.push({ pred: d.pred, type: d.type, lag: isInt(d.lag) ? d.lag : 0 });
      });
      if (ms && deps.length) err(`${T}.deps`, 'milestones cannot have dependencies');
      if (t.snet !== undefined && isNaN(isoToDay(t.snet))) err(`${T}.snet`, `invalid date ${JSON.stringify(t.snet)} – expected "YYYY-MM-DD"`);
      const task = {
        id: t.id, name: String(t.name ?? ''), milestone: ms, start: t.start,
        duration: ms ? 0 : t.duration, percent: ms ? 0 : (isInt(t.percent) ? t.percent : 0),
        done: ms ? t.done === true : false, person: typeof t.person === 'string' ? t.person : '',
        note: typeof t.note === 'string' ? t.note : '', deps,
      };
      if (!ms && deps.length && !isNaN(isoToDay(t.snet))) task.snet = t.snet;
      phase.tasks.push(task);
      seen.push({ task, path: T });
    });
    out.phases.push(phase);
  });

  // Second pass: links must point to existing, non-milestone, other tasks.
  const byId = new Map(seen.map((x) => [x.task.id, x.task]));
  for (const { task, path } of seen) {
    const used = new Set();
    task.deps.forEach((d, k) => {
      const D = `${path}.deps[${k}].pred`;
      if (typeof d.pred !== 'string' || !d.pred) return;
      if (!byId.has(d.pred)) err(D, `unknown task id "${d.pred}"`);
      else if (d.pred === task.id) err(D, 'a task cannot depend on itself');
      else if (byId.get(d.pred).milestone) err(D, `"${d.pred}" is a milestone – milestones cannot be predecessors`);
      if (used.has(d.pred)) err(D, `predecessor "${d.pred}" is listed twice`);
      used.add(d.pred);
    });
  }
  if (!errors.length) {
    const { cycle } = topoOrder(seen.map((x) => x.task));
    if (cycle) err('deps', `circular dependency: ${cycle.map((id) => `"${byId.get(id)?.name}" (${id})`).join(' depends on ')}`);
  }
  return { errors, project: errors.length ? null : out };
}

/**
 * Finds the character position of the first JSON syntax error with a small
 * strict JSON scanner. Needed because newer browsers no longer include the
 * position in JSON.parse error messages. Returns -1 if no error is found.
 */
function findJsonErrorPos(text) {
  let i = 0;
  const n = text.length;
  const ws = () => { while (i < n && ' \t\n\r'.includes(text[i])) i++; };
  const fail = () => { throw i; };
  function string() {
    i++;                                     // opening quote
    while (i < n) {
      const ch = text[i];
      if (ch === '"') { i++; return; }
      if (ch === '\\') { i += 2; continue; }
      if (ch < ' ') fail();                  // raw line breaks/tabs are not allowed inside strings
      i++;
    }
    fail();
  }
  function value() {
    ws();
    const c = text[i];
    if (c === '{') {
      i++; ws();
      if (text[i] === '}') { i++; return; }
      for (;;) {
        ws(); if (text[i] !== '"') fail(); string();
        ws(); if (text[i] !== ':') fail(); i++;
        value(); ws();
        if (text[i] === ',') { i++; continue; }
        if (text[i] === '}') { i++; return; }
        fail();
      }
    }
    if (c === '[') {
      i++; ws();
      if (text[i] === ']') { i++; return; }
      for (;;) {
        value(); ws();
        if (text[i] === ',') { i++; continue; }
        if (text[i] === ']') { i++; return; }
        fail();
      }
    }
    if (c === '"') { string(); return; }
    const m = /^-?(0|[1-9]\d*)(\.\d+)?([eE][+-]?\d+)?/.exec(text.slice(i, i + 400));
    if (m && m[0]) { i += m[0].length; return; }
    for (const lit of ['true', 'false', 'null']) if (text.startsWith(lit, i)) { i += lit.length; return; }
    fail();
  }
  try { value(); ws(); if (i < n) fail(); return -1; }
  catch (p) { return typeof p === 'number' ? p : -1; }
}

/** Explains where a JSON syntax error is (line, column and the line itself). */
function jsonErrorWhere(e, text) {
  let pos = findJsonErrorPos(text);
  const m = pos < 0 ? /position (\d+)/.exec(e.message) : null;
  if (m) pos = Number(m[1]);
  if (pos >= 0) {
    const before = text.slice(0, pos);
    const line = before.split('\n').length;
    const col = pos - before.lastIndexOf('\n');
    const src = (text.split('\n')[line - 1] || '').slice(0, 160);
    return `<p>Line ${line}, column ${col}:</p><pre>${esc(src)}\n${' '.repeat(Math.max(0, Math.min(col - 1, 160)))}^</pre>`;
  }
  const m2 = /line (\d+) column (\d+)/.exec(e.message);
  return m2 ? `<p>Line ${m2[1]}, column ${m2[2]}.</p>` : '';
}

/**
 * Opens a project file chosen by the user. On ANY problem the current
 * project stays untouched and a detailed report is shown. A successful
 * import is one undo step, so it can be reverted with Ctrl+Z.
 */
async function importFile(file) {
  let text;
  try { text = await file.text(); }
  catch (e) { showMessage('Could not read the file', `<p>${esc(file.name)}: ${esc(e.message)}</p><p>Your current project was not changed.</p>`); return; }
  let obj;
  text = text.replace(/^\uFEFF/, '');          // ignore a UTF-8 byte order mark
  try { obj = JSON.parse(text); }
  catch (e) {
    showMessage('Not a valid JSON file',
      `<p><b>${esc(file.name)}</b> could not be opened because it is not valid JSON. Your current project was not changed.</p>` +
      `<p><b>Problem:</b> ${esc(e.message)}</p>${jsonErrorWhere(e, text)}`);
    return;
  }
  const { errors, project } = validateProject(obj);
  if (errors.length) {
    const shown = errors.slice(0, 60);
    showMessage('This file is not a valid project',
      `<p><b>${esc(file.name)}</b> has ${errors.length} problem${errors.length > 1 ? 's' : ''}. Your current project was not changed.</p>` +
      `<ol class="errs">${shown.map((x) => `<li><code>${esc(x.path)}</code> – ${esc(x.msg)}</li>`).join('')}</ol>` +
      (errors.length > shown.length ? `<p>… and ${errors.length - shown.length} more.</p>` : ''));
    return;
  }
  commit(() => { state = project; syncIdCounter(); ui.selected = null; ui.filter = ''; $('#search').value = ''; });
  dirty = false;                       // the project now equals the file on disk
  render();
  const tasks = allTasks();
  if (tasks.length) scrollToDay(Math.min(...tasks.map((t) => isoToDay(t.start))), false);
  showMessage('Project opened',
    `<p><b>${esc(file.name)}</b> – ${state.phases.length} phase(s), ${tasks.length} task(s).</p>` +
    `<p class="hint">Opened by mistake? Undo (Ctrl+Z) brings the previous project back.</p>`);
}

/** Today's date as used in file names: YYYY-MM-DD. */
function fileDate() { return dayToIso(todayDay()); }

/** Saves the project as JSON (the app's own format). Clears the "unsaved" flag. */
function exportJSON() {
  const data = { version: FILE_VERSION, app: 'Gantt Chart Planner', name: state.name, exported: fileDate(),
    holidays: state.holidays || defaultHolidays(), phases: state.phases };
  const fn = `${safeFileName(state.name)}_${fileDate()}.json`;
  download(fn, JSON.stringify(data, null, 2), 'application/json');
  dirty = false;
  showMessage('Project saved',
    `<p>The project was downloaded as <b>${esc(fn)}</b>.</p>` +
    `<p class="hint">Keep this file – it is the only copy of your project. Open it later with Menu → Open project.</p>`);
}

/** One CSV field: quoted when it contains the separator, quotes or line breaks. */
function csvCell(v) {
  const s = String(v ?? '');
  return /[;"\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}

/**
 * CSV for Excel. Semicolon as separator and a UTF-8 BOM, because Excel with
 * Slovenian/European regional settings expects ";" and needs the BOM to show
 * č/š/ž correctly. Outline numbers are written as ="1.2" so Excel does not
 * turn them into dates.
 */
function exportCSV() {
  const num = numbering();
  const rows = [['ID', 'Type', 'Name', 'Start', 'End', 'Duration (days)', '% complete', 'Milestone reached', 'Owner', 'Predecessors', 'Start no earlier than', 'Note']];
  const idCell = (n) => `="${n}"`;
  for (const p of state.phases) {
    const s = phaseSummary(p);
    rows.push([idCell(num.get(p.id)), 'Phase', p.name, s ? dayToDisp(s.start) : '', s ? dayToDisp(s.end) : '', s ? s.duration : '', s ? s.percent : '', '', '', '', '', '']);
    for (const t of p.tasks) {
      const st = isoToDay(t.start);
      rows.push([idCell(num.get(t.id)), t.milestone ? 'Milestone' : 'Task', t.name, dayToDisp(st), dayToDisp(taskEndDay(t)),
        t.milestone ? 0 : t.duration, t.milestone ? '' : t.percent, t.milestone ? (t.done ? 'yes' : 'no') : '',
        t.person, predText(t, num), t.snet ? dayToDisp(isoToDay(t.snet)) : '', t.note]);
    }
  }
  const csv = '\uFEFF' + rows.map((r) => r.map(csvCell).join(';')).join('\r\n');
  const fn = `${safeFileName(state.name)}_${fileDate()}.csv`;
  download(fn, csv, 'text/csv;charset=utf-8');
  showMessage('CSV exported', `<p>Downloaded as <b>${esc(fn)}</b> (separator “;”, UTF-8). It opens directly in Excel.</p>` +
    `<p class="hint">CSV is for reading/analysis only – to continue working in this app, use the JSON file.</p>`);
}

/**
 * Basic Microsoft Project XML (MSPDI) export: phases as summary tasks,
 * tasks, milestones, dates, durations, % complete, notes and all four link
 * types with lag. Owners, resources and baselines are NOT exported
 * (decision). A 7-day working calendar (08-12, 13-17) is included so that
 * MS Project keeps the calendar-day durations of this app. Tasks without
 * predecessors get a "Start No Earlier Than" constraint so they keep their
 * dates. Must be verified by opening it in MS Project (see Help).
 */
function exportXML() {
  const num = numbering();
  const uid = new Map();
  let k = 0;
  for (const p of state.phases) { uid.set(p.id, ++k); for (const t of p.tasks) uid.set(t.id, ++k); }
  const dt = (n, time) => `${dayToIso(n)}T${time}`;
  const tasks = allTasks();
  const pStart = tasks.length ? Math.min(...tasks.map((t) => isoToDay(t.start))) : todayDay();
  const pEnd = tasks.length ? Math.max(...tasks.map(taskEndDay)) : todayDay();
  const linkType = { FF: 0, FS: 1, SF: 2, SS: 3 };           // MSPDI codes
  const weekDays = [1, 2, 3, 4, 5, 6, 7].map((n) =>
    `<WeekDay><DayType>${n}</DayType><DayWorking>1</DayWorking><WorkingTimes>` +
    `<WorkingTime><FromTime>08:00:00</FromTime><ToTime>12:00:00</ToTime></WorkingTime>` +
    `<WorkingTime><FromTime>13:00:00</FromTime><ToTime>17:00:00</ToTime></WorkingTime>` +
    `</WorkingTimes></WeekDay>`).join('');
  const out = [];
  for (const p of state.phases) {
    const s = phaseSummary(p);
    const st = s ? s.start : pStart, en = s ? s.end : pStart, days = s ? s.duration : 1;
    out.push(`<Task><UID>${uid.get(p.id)}</UID><ID>${uid.get(p.id)}</ID><Name>${esc(p.name)}</Name><Type>1</Type><IsNull>0</IsNull>` +
      `<WBS>${num.get(p.id)}</WBS><OutlineNumber>${num.get(p.id)}</OutlineNumber><OutlineLevel>1</OutlineLevel>` +
      `<Start>${dt(st, '08:00:00')}</Start><Finish>${dt(en, '17:00:00')}</Finish><Duration>PT${days * 8}H0M0S</Duration>` +
      `<DurationFormat>7</DurationFormat><Milestone>0</Milestone><Summary>1</Summary><PercentComplete>${s ? s.percent : 0}</PercentComplete></Task>`);
    for (const t of p.tasks) {
      const s0 = isoToDay(t.start), ms = t.milestone;
      const links = t.deps.map((d) => `<PredecessorLink><PredecessorUID>${uid.get(d.pred)}</PredecessorUID><Type>${linkType[d.type]}</Type>` +
        `<CrossProject>0</CrossProject><LinkLag>${(Number(d.lag) || 0) * 4800}</LinkLag><LagFormat>7</LagFormat></PredecessorLink>`).join('');
      // ASAP for linked tasks; "Start No Earlier Than" (type 4) for unlinked tasks
      // (keeps their dates) and for linked tasks with an snet constraint.
      const snetDay = !t.deps.length ? s0 : (t.snet ? isoToDay(t.snet) : NaN);
      const constraint = isNaN(snetDay) ? '<ConstraintType>0</ConstraintType>'
        : `<ConstraintType>4</ConstraintType><ConstraintDate>${dt(snetDay, '08:00:00')}</ConstraintDate>`;
      out.push(`<Task><UID>${uid.get(t.id)}</UID><ID>${uid.get(t.id)}</ID><Name>${esc(t.name)}</Name><Type>1</Type><IsNull>0</IsNull>` +
        `<WBS>${num.get(t.id)}</WBS><OutlineNumber>${num.get(t.id)}</OutlineNumber><OutlineLevel>2</OutlineLevel>` +
        `<Start>${dt(s0, '08:00:00')}</Start><Finish>${ms ? dt(s0, '08:00:00') : dt(taskEndDay(t), '17:00:00')}</Finish>` +
        `<Duration>PT${ms ? 0 : t.duration * 8}H0M0S</Duration><DurationFormat>7</DurationFormat>` +
        `<Milestone>${ms ? 1 : 0}</Milestone><Summary>0</Summary><PercentComplete>${ms ? (t.done ? 100 : 0) : t.percent}</PercentComplete>` +
        `${constraint}${t.note ? `<Notes>${esc(t.note)}</Notes>` : ''}${links}</Task>`);
    }
  }
  const xml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n` +
    `<Project xmlns="http://schemas.microsoft.com/project">\n` +
    `<SaveVersion>14</SaveVersion><Name>${esc(safeFileName(state.name))}.xml</Name><Title>${esc(state.name)}</Title>` +
    `<ScheduleFromStart>1</ScheduleFromStart><StartDate>${dt(pStart, '08:00:00')}</StartDate><FinishDate>${dt(pEnd, '17:00:00')}</FinishDate>` +
    `<CalendarUID>1</CalendarUID><DefaultStartTime>08:00:00</DefaultStartTime><DefaultFinishTime>17:00:00</DefaultFinishTime>` +
    `<MinutesPerDay>480</MinutesPerDay><MinutesPerWeek>3360</MinutesPerWeek><DaysPerMonth>30</DaysPerMonth>` +
    `<DurationFormat>7</DurationFormat><WeekStartDay>1</WeekStartDay>\n` +
    `<Calendars><Calendar><UID>1</UID><Name>7-day calendar (Gantt Chart Planner)</Name><IsBaseCalendar>1</IsBaseCalendar>` +
    `<BaseCalendarUID>-1</BaseCalendarUID><WeekDays>${weekDays}</WeekDays></Calendar></Calendars>\n` +
    `<Tasks>\n${out.join('\n')}\n</Tasks>\n</Project>\n`;
  const fn = `${safeFileName(state.name)}_${fileDate()}.xml`;
  download(fn, xml, 'application/xml');
  showMessage('MS Project XML exported',
    `<p>Downloaded as <b>${esc(fn)}</b>. In Microsoft Project use <b>File → Open</b> and choose the file type <b>XML Format</b>.</p>` +
    `<p class="hint">Included: phases, tasks, milestones, dates, durations, % complete, notes and all link types with lag. ` +
    `Not included: owners. This basic export has not been checked against every MS Project version – please verify the result.</p>`);
}
</script>

<!-- ======================================================================
     5. UI DIALOGS
     ====================================================================== -->
<script id="ui-dialogs">
'use strict';

/** Small calendar icon used by the date-picker buttons. */
const CAL_ICON = '<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="1.5" y="3" width="13" height="11.5" rx="1.5" fill="none" stroke="currentColor"/><path d="M1.5 6.5h13M5 1.5v3M11 1.5v3" stroke="currentColor" fill="none"/></svg>';

/**
 * Creates a modal <dialog>, shows it and removes it from the page when it
 * closes. Esc closes it (returnValue ''). Dialogs can be stacked, e.g. a
 * confirmation on top of the task dialog.
 */
function openDialog(html, onClose) {
  const d = document.createElement('dialog');
  d.className = 'dlg';
  d.innerHTML = html;
  document.body.appendChild(d);
  d.addEventListener('close', () => { d.remove(); if (onClose) onClose(d.returnValue); });
  d.showModal();
  return d;
}

/**
 * Message / question dialog (decision: modal with an explicit button
 * instead of transient toasts). Resolves with the value of the pressed
 * button, or 'cancel' for Esc.
 */
function showMessage(title, bodyHtml, buttons = [{ label: 'OK', value: 'ok', primary: true }]) {
  return new Promise((resolve) => {
    const d = openDialog(
      `<h2>${esc(title)}</h2><div class="dlg-body">${bodyHtml}</div><div class="btns">` +
      buttons.map((b) => `<button data-v="${esc(b.value)}" class="${b.primary ? 'primary' : ''} ${b.danger ? 'danger' : ''}">${esc(b.label)}</button>`).join('') +
      `</div>`,
      (v) => resolve(v || 'cancel'));
    $$('.btns button', d).forEach((b) => b.addEventListener('click', () => d.close(b.dataset.v)));
    const focus = $('button.primary', d) || $('button.danger', d);
    if (focus) focus.focus();
  });
}

/** Yes/No confirmation. Resolves true only when the OK button was pressed. */
async function confirmBox(title, bodyHtml, okLabel = 'OK', danger = false) {
  const v = await showMessage(title, bodyHtml, [
    { label: 'Cancel', value: 'cancel' },
    { label: okLabel, value: 'ok', primary: !danger, danger },
  ]);
  return v === 'ok';
}

/**
 * Connects a DD.MM.YYYY text field with the native date picker hidden
 * behind the calendar button. On phones a tap opens the picker directly;
 * on desktop Chrome/Edge showPicker() opens it.
 */
function wireDatePicker(txt) {
  const btn = txt.parentElement.querySelector('.pick');
  const pick = btn.querySelector('.pick-in');
  const sync = () => { const n = dispToDay(txt.value); pick.value = isNaN(n) ? '' : dayToIso(n); };
  btn.addEventListener('pointerdown', sync);
  pick.addEventListener('focus', sync);
  btn.addEventListener('click', () => {
    if (txt.readOnly) return;
    sync();
    try { pick.showPicker(); } catch (_) { /* e.g. iOS: the tap already opened the native picker */ }
  });
  pick.addEventListener('change', () => {
    const n = isoToDay(pick.value);
    if (!isNaN(n)) { txt.value = dayToDisp(n); txt.dispatchEvent(new Event('change', { bubbles: true })); }
  });
}

/** Markup of a date field with its picker button. */
function dateField(id) {
  return `<span class="datebox"><input id="${id}" class="dtxt" autocomplete="off" placeholder="DD.MM.YYYY">` +
    `<span class="pick" title="Pick a date">${CAL_ICON}<input type="date" class="pick-in" tabindex="-1" aria-hidden="true"></span></span>`;
}

/**
 * Practical examples of the link types (mechanical installation in a
 * pharmaceutical engineering project). Shown in the task dialog, the link
 * dialog and the help.
 */
function depExamplesHTML(collapsible) {
  const dl = `<dl class="ex">
    <dt>FS · Finish-to-start</dt>
    <dd>Install process piping → Pressure-test the piping. The pressure test can start only after the piping is complete.</dd>
    <dt>SS · Start-to-start (here with +2 days lag)</dt>
    <dd>Install pipe supports → Install process piping, SS+2: piping starts 2 days after the supports have started, then both run in parallel with the supports staying ahead.</dd>
    <dt>FF · Finish-to-finish</dt>
    <dd>Install HVAC ductwork → Insulate the ductwork. Insulation cannot finish before the last duct section is installed.</dd>
    <dt>SF · Start-to-finish</dt>
    <dd>Start up the new WFI loop (water for injection) → Operate the old WFI loop. The old loop may only finish once the new one has started, so the WFI supply is never interrupted.</dd>
    <dt>Lag (+ days)</dt>
    <dd>Grout the pump-skid foundation → Set the pump skid, FS+3: the grout needs 3 days to cure before the skid may be placed.</dd>
    <dt>Lead (− days)</dt>
    <dd>Mechanical completion of the CIP skid (clean-in-place) → IQ walk-down (installation qualification), FS−2: the walk-down starts 2 days before mechanical completion, on the sections that are already finished.</dd>
  </dl>`;
  return collapsible ? `<details class="ex"><summary>Examples of FS, SS, FF, SF, lag and lead</summary>${dl}</details>` : dl;
}

/** Opens the details dialog of a task or a phase. */
function openDetails(id, focusDeps) {
  if (findTask(id)) openTaskDialog(id, focusDeps);
  else if (findPhase(id)) openPhaseDialog(id);
}

/**
 * TASK DIALOG: every property of a task, including type (task/milestone),
 * phase, note and the list of predecessors. Changes are applied only on
 * "Save" and form ONE undo step.
 */
function openTaskDialog(id, focusDeps) {
  const loc = findTask(id);
  if (!loc) return;
  const t = loc.task;
  const num = numbering();
  const original = JSON.parse(JSON.stringify(t));
  let deps = original.deps.map((d) => ({ ...d }));   // working copy of the links
  // Tasks that may be chosen as predecessors: no milestones, not itself and
  // nothing that already depends on this task (that would create a loop).
  const blocked = dependentsOf(id);
  blocked.add(id);
  const candidates = allTasks().filter((x) => !x.milestone && !blocked.has(x.id));
  const phaseOpts = state.phases.map((p) =>
    `<option value="${esc(p.id)}"${p.id === loc.phase.id ? ' selected' : ''}>${esc(num.get(p.id) + ' ' + p.name)}</option>`).join('');

  const d = openDialog(`
    <h2>Task ${esc(num.get(id))}</h2>
    <label>Name<input id="f-name" value="${esc(t.name)}" autocomplete="off"></label>
    <div class="grid2">
      <label>Type<select id="f-type"><option value="task">Task</option><option value="ms">Milestone</option></select></label>
      <label>Phase<select id="f-phase">${phaseOpts}</select></label>
    </div>
    <div class="grid3">
      <label>Start${dateField('f-start')}</label>
      <label class="nm">End${dateField('f-end')}</label>
      <label class="nm">Duration (days)<input id="f-dur" type="number" min="1" step="1" inputmode="numeric"></label>
    </div>
    <p class="hint" id="f-auto">The start follows the predecessors below. Shift it relative to a predecessor with lag (+ days) or lead (− days), or keep it from starting too early with “Start no earlier than”.</p>
    <label class="snetrow">Start no earlier than (optional constraint)${dateField('f-snet')}</label>
    <div class="grid3">
      <label class="nm">% complete<input id="f-pct" type="number" min="0" max="100" step="1" inputmode="numeric"></label>
      <label class="ms chk"><input type="checkbox" id="f-done"> Milestone reached</label>
      <label>Owner<input id="f-person" value="${esc(t.person)}" autocomplete="off"></label>
    </div>
    <label>Note <span id="f-cnt"></span><textarea id="f-note" rows="3" maxlength="${NOTE_MAX}">${esc(t.note)}</textarea></label>
    <fieldset class="nm deps"><legend>Predecessors – this task depends on …</legend>
      <div id="f-deps"></div>
      <button type="button" id="f-adddep">+ Add predecessor</button>
      <p class="hint" style="margin:6px 0 0">FS finish-to-start · SS start-to-start · FF finish-to-finish · SF start-to-finish. Lag in calendar days, negative = lead.</p>
      ${depExamplesHTML(true)}
    </fieldset>
    <div class="btns">
      <button class="danger" id="f-del">Delete</button>
      <button id="f-dup">Duplicate</button>
      <span class="spacer"></span>
      <button id="f-cancel">Cancel</button>
      <button class="primary" id="f-save">Save</button>
    </div>`);

  const f = (sel) => d.querySelector(sel);
  const fName = f('#f-name'), fType = f('#f-type'), fPhase = f('#f-phase'), fStart = f('#f-start'), fEnd = f('#f-end'),
    fDur = f('#f-dur'), fPct = f('#f-pct'), fDone = f('#f-done'), fPerson = f('#f-person'), fNote = f('#f-note'),
    fCnt = f('#f-cnt'), fDeps = f('#f-deps'), fAuto = f('#f-auto');
  const s0 = isoToDay(t.start);
  fType.value = t.milestone ? 'ms' : 'task';
  fStart.value = dayToDisp(s0);
  fDur.value = t.milestone ? 1 : t.duration;
  fEnd.value = dayToDisp(s0 + (t.milestone ? 0 : t.duration - 1));
  fPct.value = t.percent;
  fDone.checked = !!t.done;
  const fSnet = f('#f-snet');
  fSnet.value = t.snet ? dayToDisp(isoToDay(t.snet)) : '';
  fSnet.placeholder = 'none';
  wireDatePicker(fSnet);
  wireDatePicker(fStart);
  wireDatePicker(fEnd);

  /** Current duration from the field (always a whole number >= 1). */
  const curDur = () => { const n = Math.round(Number(fDur.value)); return Number.isFinite(n) && n >= 1 ? n : 1; };

  /** Shows/hides fields depending on the type and locks the start of dependent tasks. */
  function refresh() {
    const ms = fType.value === 'ms';
    $$('.nm', d).forEach((el) => { el.hidden = ms; });
    $$('.ms', d).forEach((el) => { el.hidden = !ms; });
    const auto = !ms && deps.length > 0;
    fStart.readOnly = auto;
    fStart.parentElement.querySelector('.pick').classList.toggle('off', auto);
    fAuto.hidden = !auto;
    f('.snetrow').hidden = !auto;
    fCnt.textContent = `(${fNote.value.length}/${NOTE_MAX})`;
  }

  /** One row of the predecessor list. */
  function depRowHTML(dep, i) {
    const opts = `<option value="">— choose task —</option>` + candidates.map((c) =>
      `<option value="${esc(c.id)}"${c.id === dep.pred ? ' selected' : ''}>${esc(num.get(c.id) + ' ' + c.name)}</option>`).join('');
    return `<div class="deprow" data-i="${i}">
      <select data-dp="pred" aria-label="Predecessor task">${opts}</select>
      <select data-dp="type" aria-label="Link type">${DEP_TYPES.map((x) => `<option${x === dep.type ? ' selected' : ''}>${x}</option>`).join('')}</select>
      <input data-dp="lag" type="number" step="1" value="${Number(dep.lag) || 0}" aria-label="Lag in days" title="Lag in days (negative = lead)">
      <button type="button" data-dp="rm" title="Remove this predecessor" aria-label="Remove">&#10005;</button></div>`;
  }

  /** Redraws the predecessor list. */
  function renderDeps(focusLast) {
    fDeps.innerHTML = deps.length ? deps.map(depRowHTML).join('')
      : '<p class="hint" style="margin:2px 0 8px">No predecessors – the task starts on its own start date.</p>';
    if (focusLast) { const sels = $$('select[data-dp="pred"]', fDeps); if (sels.length) sels[sels.length - 1].focus(); }
    refresh();
  }

  // Keep start, end and duration consistent while typing.
  fStart.addEventListener('change', () => {
    const s = dispToDay(fStart.value);
    if (!isNaN(s)) { fStart.value = dayToDisp(s); fEnd.value = dayToDisp(s + curDur() - 1); }
  });
  fEnd.addEventListener('change', () => {
    const s = dispToDay(fStart.value), e = dispToDay(fEnd.value);
    if (isNaN(s) || isNaN(e)) return;
    const dur = Math.max(1, e - s + 1);          // end before start -> corrected to a 1-day task
    fDur.value = dur;
    fEnd.value = dayToDisp(s + dur - 1);
  });
  fDur.addEventListener('change', () => {
    fDur.value = curDur();
    const s = dispToDay(fStart.value);
    if (!isNaN(s)) fEnd.value = dayToDisp(s + curDur() - 1);
  });
  fPct.addEventListener('change', () => { fPct.value = clampInt(fPct.value, 0, 100, 0); });
  fNote.addEventListener('input', refresh);

  // Task <-> milestone. Milestones have no links, so converting asks first.
  fType.addEventListener('change', async () => {
    if (fType.value === 'ms') {
      const succ = successorLinkCount(id);
      const n = deps.length + succ;
      if (n > 0) {
        const ok = await confirmBox('Convert to milestone?',
          `<p>This task has <b>${deps.length}</b> predecessor link(s) and <b>${succ}</b> successor link(s).</p>` +
          `<p>Milestones cannot have dependencies, so ${n === 1 ? 'this link' : 'these links'} will be removed when you save.</p>`, 'Convert');
        if (!ok) { fType.value = 'task'; refresh(); return; }
      }
      deps = [];
    } else {
      deps = original.milestone ? [] : original.deps.map((x) => ({ ...x }));
      const s = dispToDay(fStart.value);
      if (!isNaN(s)) fEnd.value = dayToDisp(s + curDur() - 1);
    }
    renderDeps(false);
  });

  // Predecessor list editing.
  fDeps.addEventListener('change', (e) => {
    const row = e.target.closest('.deprow');
    if (!row) return;
    const dep = deps[Number(row.dataset.i)];
    const key = e.target.dataset.dp;
    if (key === 'pred') dep.pred = e.target.value;
    else if (key === 'type') dep.type = e.target.value;
    else if (key === 'lag') { dep.lag = clampInt(e.target.value, -100000, 100000, 0); e.target.value = dep.lag; }
    refresh();
  });
  fDeps.addEventListener('click', (e) => {
    const b = e.target.closest('[data-dp="rm"]');
    if (!b) return;
    deps.splice(Number(b.closest('.deprow').dataset.i), 1);
    renderDeps(false);
  });
  f('#f-adddep').addEventListener('click', () => {
    if (!candidates.length) {
      showMessage('No possible predecessor',
        '<p>No other task can be a predecessor of this one. Milestones and tasks that already depend on this task are not offered, to prevent circular dependencies.</p>');
      return;
    }
    deps.push({ pred: '', type: 'FS', lag: 0 });
    renderDeps(true);
  });

  /** Validates the form and applies it as one undo step. Returns true on success. */
  async function save() {
    const active = d.querySelector(':focus');
