    if (active && active.matches('input, select, textarea')) active.dispatchEvent(new Event('change', { bubbles: true }));
    const ms = fType.value === 'ms';
    const start = dispToDay(fStart.value);
    if (isNaN(start)) {
      await showMessage('Invalid start date', `<p>“${esc(fStart.value)}” is not a valid date. Please use DD.MM.YYYY, for example ${dayToDisp(todayDay())}.</p>`);
      fStart.focus();
      return false;
    }
    if (!ms && isNaN(dispToDay(fEnd.value))) {
      await showMessage('Invalid end date', `<p>“${esc(fEnd.value)}” is not a valid date. Please use DD.MM.YYYY.</p>`);
      fEnd.focus();
      return false;
    }
    let snet = NaN;
    if (!ms && deps.length && fSnet.value.trim()) {
      snet = dispToDay(fSnet.value);
      if (isNaN(snet)) {
        await showMessage('Invalid date', `<p>“${esc(fSnet.value)}” is not a valid “start no earlier than” date. Use DD.MM.YYYY or leave the field empty.</p>`);
        fSnet.focus();
        return false;
      }
    }
    const clean = [];
    for (let i = 0; i < deps.length && !ms; i++) {
      const x = deps[i];
      if (!x.pred) { await showMessage('Predecessor missing', `<p>Row ${i + 1} of the predecessor list has no task selected. Choose a task or remove the row.</p>`); return false; }
      if (clean.some((c) => c.pred === x.pred)) { await showMessage('Duplicate predecessor', `<p>Task ${esc(num.get(x.pred))} is listed more than once. Keep one link per predecessor.</p>`); return false; }
      clean.push({ pred: x.pred, type: DEP_TYPES.includes(x.type) ? x.type : 'FS', lag: clampInt(x.lag, -100000, 100000, 0) });
    }
    // Safety net (the list above never offers such tasks): no loops allowed.
    const { cycle } = topoOrder(allTasks(), (x) => (x.id === id ? clean : x.deps));
    if (cycle) {
      await showMessage('Circular dependency', `<p>This would create a loop: ${cycle.map((c) => esc(num.get(c))).join(' → ')}. The change was not saved.</p>`);
      return false;
    }
    const phaseId = fPhase.value;
    commit(() => {
      const cur = findTask(id);
      if (!cur) return false;
      const tt = cur.task;
      tt.name = fName.value.trim() || 'Untitled task';
      tt.milestone = ms;
      tt.start = dayToIso(start);
      tt.duration = ms ? 0 : curDur();
      tt.percent = ms ? 0 : clampInt(fPct.value, 0, 100, 0);
      tt.done = ms ? fDone.checked : false;
      tt.person = fPerson.value.trim();
      tt.note = fNote.value.slice(0, NOTE_MAX);
      tt.deps = ms ? [] : clean;
      if (!isNaN(snet) && clean.length) tt.snet = dayToIso(snet); else delete tt.snet;
      if (ms) for (const x of allTasks()) x.deps = x.deps.filter((dd) => dd.pred !== id);  // milestones cannot be predecessors
      if (phaseId !== cur.phase.id) {
        const np = findPhase(phaseId);
        if (np) { cur.phase.tasks.splice(cur.index, 1); np.phase.tasks.push(tt); np.phase.collapsed = false; }
      }
    });
    return true;
  }

  f('#f-save').addEventListener('click', async () => { if (await save()) d.close('saved'); });
  f('#f-cancel').addEventListener('click', () => d.close('cancel'));
  f('#f-dup').addEventListener('click', async () => { if (await save()) { d.close('dup'); duplicateTask(id); } });
  f('#f-del').addEventListener('click', async () => {
    const succ = successorLinkCount(id);
    const ok = await confirmBox('Delete task?',
      `<p>Delete <b>${esc(num.get(id))} ${esc(t.name)}</b>?</p>` +
      (succ ? `<p>${succ} dependency link(s) from other tasks point to it and will be removed.</p>` : '') +
      '<p class="hint">You can undo this with Ctrl+Z.</p>', 'Delete', true);
    if (ok) { d.close('del'); deleteTask(id); }
  });
  // Enter in a single-line field = Save.
  d.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.isComposing && e.target.matches('input:not([type=checkbox])')) { e.preventDefault(); f('#f-save').click(); }
  });

  renderDeps(false);
  if (focusDeps) {
    const first = $('select[data-dp="pred"]', fDeps) || f('#f-adddep');
    first.focus();
  } else {
    fName.focus();
  }
}

/** PHASE DIALOG: rename, add a task into it, or delete it with all its tasks. */
function openPhaseDialog(id) {
  const loc = findPhase(id);
  if (!loc) return;
  const p = loc.phase;
  const num = numbering();
  const s = phaseSummary(p);
  const d = openDialog(`
    <h2>Phase ${esc(num.get(id))}</h2>
    <label>Name<input id="g-name" value="${esc(p.name)}" autocomplete="off"></label>
    <p class="hint">${p.tasks.length} task(s)${s ? ` · ${dayToDisp(s.start)} – ${dayToDisp(s.end)} · ${s.duration} days · ${s.percent}% complete` : ''}.
      Dates and % of a phase are calculated from its tasks.</p>
    <div class="btns">
      <button class="danger" id="g-del">Delete phase</button>
      <button id="g-add">+ Task in this phase</button>
      <span class="spacer"></span>
      <button id="g-cancel">Cancel</button>
      <button class="primary" id="g-save">Save</button>
    </div>`);
  const name = $('#g-name', d);
  const apply = () => commit(() => { const cur = findPhase(id); if (!cur) return false; cur.phase.name = name.value.trim() || 'Untitled phase'; });
  $('#g-save', d).addEventListener('click', () => { apply(); d.close('saved'); });
  $('#g-cancel', d).addEventListener('click', () => d.close('cancel'));
  $('#g-add', d).addEventListener('click', () => { apply(); d.close('add'); ui.selected = id; addTask(); });
  $('#g-del', d).addEventListener('click', async () => {
    const n = p.tasks.length;
    const ok = await confirmBox('Delete phase?',
      `<p>Delete phase <b>${esc(num.get(id))} ${esc(p.name)}</b>${n ? ` and its <b>${n}</b> task(s)` : ''}?</p>` +
      (n ? '<p>Dependency links from other tasks to these tasks will also be removed.</p>' : '') +
      '<p class="hint">You can undo this with Ctrl+Z.</p>', 'Delete', true);
    if (ok) { d.close('del'); deletePhase(id); }
  });
  d.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing && e.target === name) { e.preventDefault(); $('#g-save', d).click(); } });
  name.focus();
  name.select();
}

/**
 * LINK DIALOG (click on an arrow): change the type or lag of one dependency,
 * or delete it. One undo step.
 */
function openLinkDialog(succId, predId) {
  const s = findTask(succId), p = findTask(predId);
  if (!s || !p) return;
  const dep = s.task.deps.find((x) => x.pred === predId);
  if (!dep) return;
  const num = numbering();
  const names = { FS: 'FS – finish-to-start', SS: 'SS – start-to-start', FF: 'FF – finish-to-finish', SF: 'SF – start-to-finish' };
  const d = openDialog(`
    <h2>Link ${esc(num.get(predId))} → ${esc(num.get(succId))}</h2>
    <p><b>${esc(p.task.name)}</b> (predecessor) → <b>${esc(s.task.name)}</b> (successor)</p>
    <div class="grid2">
      <label>Type<select id="l-type">${DEP_TYPES.map((t) => `<option value="${t}"${t === dep.type ? ' selected' : ''}>${names[t]}</option>`).join('')}</select></label>
      <label>Lag in days (negative = lead)<input id="l-lag" type="number" step="1" value="${Number(dep.lag) || 0}"></label>
    </div>
    ${depExamplesHTML(true)}
    <div class="btns">
      <button class="danger" id="l-del">Delete link</button>
      <span class="spacer"></span>
      <button id="l-cancel">Cancel</button>
      <button class="primary" id="l-save">Save</button>
    </div>`);
  const save = () => {
    const type = $('#l-type', d).value, lag = clampInt($('#l-lag', d).value, -100000, 100000, 0);
    commit(() => { const x = findTask(succId)?.task.deps.find((k) => k.pred === predId); if (!x) return false; x.type = type; x.lag = lag; });
    d.close('saved');
  };
  $('#l-save', d).addEventListener('click', save);
  $('#l-cancel', d).addEventListener('click', () => d.close('cancel'));
  $('#l-del', d).addEventListener('click', () => {
    commit(() => { const x = findTask(succId); if (!x) return false; x.task.deps = x.task.deps.filter((k) => k.pred !== predId); });
    d.close('del');
  });
  d.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing && e.target.matches('input')) { e.preventDefault(); save(); } });
  $('#l-type', d).focus();
}

/**
 * PUBLIC HOLIDAYS DIALOG: choose the countries (Slovenia, USA) and switch
 * single holidays off or on again, separately for every year. The settings
 * are part of the project file. One undo step.
 */
function openHolidaysDialog() {
  const draft = JSON.parse(JSON.stringify(state.holidays || defaultHolidays()));
  const off = new Set(draft.off);
  const g = lastLayout ? lastLayout.g : timelineGeom();
  const thisYear = dayParts(todayDay()).y;
  const y0 = Math.min(dayParts(g.start).y, thisYear), y1 = Math.max(dayParts(g.end).y, thisYear) + 1;
  const years = [];
  for (let y = y0; y <= y1; y++) years.push(y);
  const d = openDialog(`
    <h2>Public holidays</h2>
    <p class="hint" style="margin:0 0 8px">Calculated offline and shown as shaded days on the timeline. Durations are not changed (calendar days).</p>
    <div class="grid2">
      ${Object.entries(HOLIDAY_COUNTRIES).map(([cc, name]) => `<label class="chk"><input type="checkbox" data-cc="${cc}"${draft.countries.includes(cc) ? ' checked' : ''}> ${esc(name)}</label>`).join('')}
    </div>
    <div class="grid2">
      <label>Year<select id="h-year">${years.map((y) => `<option${y === thisYear ? ' selected' : ''}>${y}</option>`).join('')}</select></label>
      <div class="btns" style="margin:0;align-self:end;padding-bottom:10px"><button id="h-all">All on</button><button id="h-none">All off</button></div>
    </div>
    <div class="holi" id="h-list"></div>
    <p class="hint">Slovenia: work-free days (dela prosti dnevi) under the ZPDPD act. USA: the 11 federal holidays, on the observed day. Laws can change – switch off what does not apply.</p>
    <div class="btns"><span class="spacer"></span><button id="h-cancel">Cancel</button><button class="primary" id="h-save">Save</button></div>`);
  const list = $('#h-list', d), yearSel = $('#h-year', d);
  const yearItems = () => draft.countries.flatMap((cc) => holidaysForYear(cc, Number(yearSel.value)));
  function renderList() {
    const y = Number(yearSel.value);
    if (!draft.countries.length) { list.innerHTML = '<p class="hint" style="margin:8px 0">No country selected – no holidays are shown.</p>'; return; }
    list.innerHTML = draft.countries.map((cc) => `<h4>${esc(HOLIDAY_COUNTRIES[cc])} ${y}</h4>` +
      holidaysForYear(cc, y).map((x) => `<label class="hr"><input type="checkbox" data-key="${esc(x.key)}"${off.has(x.key) ? '' : ' checked'}>` +
        `<span class="hd">${dayToDisp(x.day)}</span><span class="wd">${WEEKDAYS[mondayIndex(x.day)]}</span><span>${esc(x.name)}</span></label>`).join('')).join('');
  }
  $$('[data-cc]', d).forEach((cb) => cb.addEventListener('change', () => {
    draft.countries = Object.keys(HOLIDAY_COUNTRIES).filter((cc) => $(`[data-cc="${cc}"]`, d).checked);
    renderList();
  }));
  yearSel.addEventListener('change', renderList);
  list.addEventListener('change', (e) => { const k = e.target.dataset.key; if (!k) return; if (e.target.checked) off.delete(k); else off.add(k); });
  $('#h-all', d).addEventListener('click', () => { for (const x of yearItems()) off.delete(x.key); renderList(); });
  $('#h-none', d).addEventListener('click', () => { for (const x of yearItems()) off.add(x.key); renderList(); });
  $('#h-cancel', d).addEventListener('click', () => d.close('cancel'));
  $('#h-save', d).addEventListener('click', () => {
    commit(() => { state.holidays = { countries: draft.countries, off: [...off].sort() }; });
    d.close('saved');
  });
  renderList();
  yearSel.focus();
}

/** Help text; the short variant is used on the welcome screen. */
function helpHTML(short) {
  const k = (s) => `<kbd>${s}</kbd>`;
  const basics = `
    <ul>
      <li><b>+ Phase</b> / <b>+ Task</b> add rows. Edit names, dates, days, % and owner directly in the table.</li>
      <li>Tap a row number (e.g. <b>1.2</b>) or a bar to open all details: task or milestone, phase, note and predecessors.</li>
      <li><b>Nothing is saved automatically.</b> Use Menu → <b>Save project (JSON)</b> and later Menu → <b>Open project</b>.</li>
    </ul>`;
  if (short) return `<div class="help">${basics}<p class="hint">Menu → Help &amp; shortcuts shows this and more at any time.</p></div>`;
  return `<div class="help">${basics}
    <ul>
      <li>Tasks with predecessors are <b>scheduled automatically</b> (as soon as possible): their start follows the links and moves when a predecessor moves. Shift them with a lag (+ days) or lead (− days).</li>
      <li>Link types: <b>FS</b> finish-to-start, <b>SS</b> start-to-start, <b>FF</b> finish-to-finish, <b>SF</b> start-to-finish. Loops are prevented. Examples below.</li>
      <li><b>Linking with the mouse:</b> point at a bar – small circles appear at its start and finish. Drag a circle onto the start or finish of another task: finish → start = FS, start → start = SS, finish → finish = FF, start → finish = SF. Drag the tip of an arrow onto another task to re-connect it; click an arrow to change its type or lag, or to delete it. (On touch screens use the task dialog.)</li>
      <li><b>Start no earlier than:</b> typing a start date on a linked task sets this constraint (orange mark). The task then starts at the later of the link result and that date. Clear the field to remove it.</li>
      <li><b>Public holidays</b> (Menu → Public holidays): Slovenia and/or USA, calculated offline; single holidays can be switched off per year. They are shown only – durations stay in calendar days.</li>
      <li>Durations are <b>calendar days</b> (weekends included), at least 1 day. An end date before the start is corrected automatically.</li>
      <li><b>Milestones</b> (circles) mark a date and have no links. Tick “reached” to fill the circle.</li>
      <li>Phases: ▾/▸ collapses a phase; its bar spans all of its tasks. Use ↑/↓ to reorder rows – numbers update automatically.</li>
      <li>The browser warns you before closing the page with unsaved changes. Undo keeps the last 10 steps (an opened file counts as one step).</li>
      <li>Exports: CSV for Excel, basic MS Project XML (owners not included – please check the result in MS Project), Print/PDF on A4 landscape, split into several pages if needed.</li>
    </ul>
    <h3>Examples of link types</h3>
    ${depExamplesHTML(false)}
    <h3>Keyboard shortcuts</h3>
    <table class="keys">
      <tr><td>${k('Ctrl')} + ${k('S')}</td><td>Save project (JSON)</td></tr>
      <tr><td>${k('Ctrl')} + ${k('Z')}</td><td>Undo (outside of a field that is being edited)</td></tr>
      <tr><td>${k('Ctrl')} + ${k('Y')} &nbsp;or&nbsp; ${k('Ctrl')} + ${k('Shift')} + ${k('Z')}</td><td>Redo</td></tr>
      <tr><td>${k('Alt')} + ${k('N')}</td><td>New task (Ctrl+N is reserved by the browser)</td></tr>
      <tr><td>${k('Ctrl')} + ${k('P')}</td><td>Print / save as PDF</td></tr>
      <tr><td>${k('Tab')} / ${k('Shift')} + ${k('Tab')}</td><td>Next / previous field</td></tr>
      <tr><td>${k('Enter')}</td><td>Confirm a table edit · Save in a dialog</td></tr>
      <tr><td>${k('Esc')}</td><td>Undo the current table edit · close a dialog</td></tr>
    </table>
    <p class="hint">On a Mac use ⌘ instead of Ctrl and ⌥ instead of Alt.</p>
    <p class="hint">Gantt Chart Planner 2.0 · works offline · no data leaves this device.</p></div>`;
}

/** Help dialog (Menu → Help & shortcuts). */
function openHelp() {
  showMessage('Help & shortcuts', helpHTML(false));
}

/**
 * WELCOME SCREEN shown at every start (the app keeps no memory between
 * sessions): project name, short instructions and how to begin.
 */
function openWelcome() {
  const d = openDialog(`
    <h2>Gantt Chart Planner</h2>
    <p>A standalone Gantt chart editor that works offline. Nothing is installed and no data leaves this device – your project lives in the JSON file you save.</p>
    <label>Project name<input id="w-name" value="${esc(state.name)}" autocomplete="off"></label>
    ${helpHTML(true)}
    <div class="btns">
      <button id="w-open">Open project file…</button>
      <button id="w-empty">Start empty</button>
      <span class="spacer"></span>
      <button class="primary" id="w-start">Start with example</button>
    </div>`);
  const name = $('#w-name', d);
  const takeName = () => { state.name = name.value.trim() || 'My Project'; requestRender(); };
  $('#w-start', d).addEventListener('click', () => { takeName(); d.close('start'); });
  $('#w-empty', d).addEventListener('click', () => {
    takeName();
    state.phases = [];
    undoStack = []; redoStack = []; dirty = false; ui.selected = null;
    d.close('empty');
    requestRender();
  });
  $('#w-open', d).addEventListener('click', () => { takeName(); d.close('open'); openFilePicker(); });
  name.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); $('#w-start', d).click(); } });
  $('#w-start', d).focus();
}
</script>

<!-- ======================================================================
     6. UI RENDER: table + timeline
     ====================================================================== -->
<script id="ui-render">
'use strict';

/** Last layout, used for scrolling to dates and for keeping the view on zoom changes. */
let lastLayout = null;
/** Data key (e.g. "t5|name") of the field that should get focus after the next render. */
let pendingFocus = null;
let renderQueued = false;

/** Coalesces many change requests into one render per animation frame. */
function requestRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; render(); });
}

/** Current row height in px (CSS variable --rh: 32 on desktop, 45 on touch screens). */
function rowHeight() {
  return parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--rh')) || 32;
}

/** Column widths in px. Touch screens get 44 px buttons; narrow screens a narrower name column. */
function colDefs() {
  const coarse = matchMedia('(pointer: coarse)').matches;
  const narrow = matchMedia('(max-width: 600px)').matches;
  const b = coarse ? 44 : 30;
  return {
    id: coarse ? 50 : 48, name: narrow ? 130 : 240, act: b * 2 + 1,
    start: coarse ? 120 : 92, end: coarse ? 120 : 92, dur: coarse ? 64 : 50,
    pct: coarse ? 64 : 50, person: coarse ? 120 : 110, pred: coarse ? 140 : 120,
  };
}

/**
 * Timeline geometry for the current zoom.
 * Week view: 22 px per day, weeks start on Monday, at least 9 weeks shown.
 * Month view: 5 px per day, whole months, at least 7 months shown.
 * Always covers all tasks AND today (so "Today" always works).
 */
function timelineGeom() {
  const today = todayDay();
  let min = today, max = today;
  for (const t of allTasks()) {
    min = Math.min(min, isoToDay(t.start));
    max = Math.max(max, taskEndDay(t));
  }
  let start, end, dayW;
  if (ui.zoom === 'month') {
    dayW = 5;
    start = firstOfMonth(min, -1);
    end = firstOfMonth(max, 2) - 1;
    if (end - start < 200) end = firstOfMonth(start, 7) - 1;
  } else {
    dayW = 22;
    start = min - mondayIndex(min) - 7;
    end = max - mondayIndex(max) + 6 + 14;
    if (end - start < 62) end = start + 62;
  }
  return { zoom: ui.zoom, start, end, dayW, width: (end - start + 1) * dayW, x: (n) => (n - start) * dayW,
    hdrH: ui.zoom === 'month' ? 66 : 44,          // month view has a third header line with week numbers
    hol: holidayIndex(start, end) };
}

/**
 * Rows to display, honouring collapsed phases and the search text. While
 * searching, matching tasks are shown even inside collapsed phases; a phase
 * whose name matches shows all its tasks.
 */
function visibleRows() {
  const f = ui.filter.trim().toLowerCase();
  const rows = [];
  for (const p of state.phases) {
    const phaseMatch = !f || p.name.toLowerCase().includes(f);
    const tasks = p.tasks.filter((t) => !f || phaseMatch || t.name.toLowerCase().includes(f));
    if (f && !phaseMatch && !tasks.length) continue;
    rows.push({ kind: 'phase', phase: p });
    if (!p.collapsed || f) for (const t of tasks) rows.push({ kind: 'task', task: t, phase: p });
  }
  return rows;
}

/** SVG: timeline header (week view: weeks + days; month view: years + months + ISO week numbers). */
function timelineHeaderInner(g) {
  const H = 44, mid = 22;
  let s = `<line x1="0" y1="${mid + 0.5}" x2="${g.width}" y2="${mid + 0.5}" class="th-l"/>`;
  const seg = (from, nextFn, y1, y2, label, minW) => {
    let n = from;
    while (n <= g.end) {
      const next = Math.min(nextFn(n), g.end + 1);
      const x = g.x(n), w = (next - n) * g.dayW;
      s += `<line x1="${x + 0.5}" y1="${y1}" x2="${x + 0.5}" y2="${y2}" class="th-l"/>`;
      if (w >= minW) s += `<text x="${x + 5}" y="${y1 + 15}" class="th-t${y1 === 0 ? ' th-b' : ''}">${label(n)}</text>`;
      n = next;
    }
  };
  if (g.zoom === 'week') {
    // Top line: one label per week ("W39 · Sep 2026"), so the month is visible wherever you scroll.
    seg(g.start, (n) => n + 7, 0, mid, (n) => { const p = dayParts(n); return `W${isoWeek(n)} · ${MONTHS[p.m]} ${p.y}`; }, 90);
    for (let n = g.start; n <= g.end; n++) {
      const x = g.x(n), mon = mondayIndex(n) === 0;
      if (mon) s += `<line x1="${x + 0.5}" y1="${mid}" x2="${x + 0.5}" y2="${H}" class="th-l"/>`;
      const hol = g.hol.get(n);
      s += `<text x="${x + g.dayW / 2}" y="${mid + 15}" text-anchor="middle" class="th-t${mon ? ' th-b' : ''}${hol ? ' th-hol' : ''}">${dayParts(n).d}</text>`;
      if (hol) s += `<rect x="${x}" y="${mid}" width="${g.dayW}" height="${H - mid}" fill="transparent"><title>${esc(dayToDisp(n) + '\n' + hol.join('\n'))}</title></rect>`;
    }
  } else {
    seg(g.start, (n) => firstOfYear(n, 1), 0, mid, (n) => String(dayParts(n).y), 36);
    seg(g.start, (n) => firstOfMonth(n, 1), mid, H, (n) => { const p = dayParts(n); return `${MONTHS[p.m]} ${p.y}`; }, 60);
    // Third line: ISO week number of each week (weeks start on Monday).
    s += `<line x1="0" y1="${H + 0.5}" x2="${g.width}" y2="${H + 0.5}" class="th-l"/>`;
    for (let n = g.start; n <= g.end; n++) {
      if (mondayIndex(n) !== 0) continue;
      const x = g.x(n);
      s += `<line x1="${x + 0.5}" y1="${H}" x2="${x + 0.5}" y2="${H + 22}" class="th-l"/>`;
      s += `<text x="${x + 3.5 * g.dayW}" y="${H + 15}" text-anchor="middle" class="th-t"><title>Week ${isoWeek(n)} · ${dayToDisp(n)} – ${dayToDisp(n + 6)}</title>${isoWeek(n)}</text>`;
    }
    // Holidays: small marks at the bottom of the week line (hover shows the name).
    for (const [n, names] of g.hol) {
      s += `<rect x="${g.x(n)}" y="${H + 17}" width="${Math.max(3, g.dayW)}" height="5" fill="#D55E00"><title>${esc(dayToDisp(n) + '\n' + names.join('\n'))}</title></rect>`;
    }
  }
  return s;
}

/** ISO 8601 week number of day n (weeks start on Monday; week 1 contains the first Thursday). */
function isoWeek(n) {
  const thursday = n - mondayIndex(n) + 3;
  return Math.floor((thursday - firstOfYear(thursday)) / 7) + 1;
}

/**
 * Background of the timeline body: very light alternating columns (every
 * second day in week view, every second week in month view) and the public
 * holidays that are switched on.
 */
function backgroundInner(g, height) {
  let zebra = '', hol = '';
  for (let n = g.start; n <= g.end; n++) {
    const odd = g.zoom === 'week' ? (n - g.start) % 2 === 1 : Math.floor((n + 3) / 7) % 2 === 1;  // (n+3)/7 = week count since a Monday
    if (odd) zebra += `M${g.x(n)} 0h${g.dayW}v${height}h${-g.dayW}z`;
    if (g.hol.has(n)) hol += `M${g.x(n)} 0h${g.dayW}v${height}h${-g.dayW}z`;
  }
  return `<path d="${zebra}" class="zb"/><path d="${hol}" class="hol"/>`;
}

/** SVG path of vertical grid lines: thin per day (week view) or per week (month view), strong per week/month. */
function gridPaths(g, height) {
  let thin = '', strong = '';
  for (let n = g.start; n <= g.end + 1; n++) {
    const x = g.x(n) + 0.5;
    if (g.zoom === 'week') {
      if (mondayIndex(n) === 0) strong += `M${x} 0V${height}`; else thin += `M${x} 0V${height}`;
    } else if (dayParts(n).d === 1) strong += `M${x} 0V${height}`;
    else if (mondayIndex(n) === 0) thin += `M${x} 0V${height}`;
  }
  return `<path d="${thin}" class="g1"/><path d="${strong}" class="g2"/>`;
}

/**
 * Orthogonal dependency arrow from (x1,y1) to (x2,y2).
 * d1 = direction in which the line leaves the predecessor (+1 right from its
 * end, -1 left from its start); d2 = direction in which it enters the
 * successor (+1 from the left into its start, -1 from the right into its end).
 */
function arrowPath(x1, y1, d1, x2, y2, d2, rh) {
  const a = x1 + d1 * 8;               // first bend, just outside the predecessor
  const b = x2 - d2 * 8;               // last bend, just before the successor
  if ((d2 > 0 && a <= b) || (d2 < 0 && a >= b)) return `M${x1} ${y1}H${a}V${y2}H${x2}`;
  const ym = y2 > y1 ? y2 - rh / 2 : y2 + rh / 2;   // detour along the row boundary
  return `M${x1} ${y1}H${a}V${ym}H${b}V${y2}H${x2}`;
}

/**
 * SVG content of the timeline body for the given rows: grid, row lines,
 * phase summary bars (phase colour), task bars (one colour, darker part =
 * % complete), milestones (circle; filled when reached) and dependency arrows.
 * `markerId` must be unique per SVG (the print view contains several SVGs).
 */
function timelineBodyInner(rows, g, rh, markerId, num, interactive = true) {
  const H = rows.length * rh;
  let s = `<defs><marker id="${markerId}" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="7" markerHeight="7" orient="auto">` +
    `<path d="M0 0L8 4L0 8z" fill="#4b5563"/></marker></defs>`;
  s += backgroundInner(g, H);
  s += gridPaths(g, H);
  let lines = '';
  for (let i = 1; i <= rows.length; i++) lines += `M0 ${i * rh - 0.5}H${g.width}`;
  s += `<path d="${lines}" class="g1"/>`;
  const pos = new Map();   // task id -> {yc, xs, xe} for the arrows
  let bars = '';
  let top = '';            // arrow tips (drag to re-connect) – above bars
  let hdls = '';           // link handles – topmost
  rows.forEach((r, i) => {
    const y = i * rh;
    if (r.kind === 'phase') {
      const sm = phaseSummary(r.phase);
      if (!sm) return;
      const x = g.x(sm.start), w = Math.max(8, (sm.end - sm.start + 1) * g.dayW);
      const bh = Math.max(6, Math.round(rh * 0.22)), by = y + Math.round(rh * 0.34);
      const col = phaseColor(r.phase);
      const tip = `${num.get(r.phase.id)} ${r.phase.name}\n${dayToDisp(sm.start)} – ${dayToDisp(sm.end)} · ${sm.duration} d · ${sm.percent}%`;
      bars += `<g class="bar" data-open="${esc(r.phase.id)}"><title>${esc(tip)}</title>` +
        `<rect x="${x - 4}" y="${y}" width="${w + 8}" height="${rh}" fill="transparent"/>` +
        `<rect x="${x}" y="${by}" width="${w}" height="${bh}" fill="${col}" rx="1"/>` +
        `<path d="M${x} ${by + bh}h7l-7 6z M${x + w} ${by + bh}h-7l7 6z" fill="${col}"/></g>`;
      return;
    }
    const t = r.task;
    const s0 = isoToDay(t.start);
    const end = taskEndDay(t);
    if (t.milestone) {
      const cx = g.x(s0) + g.dayW / 2, cy = y + rh / 2, rr = Math.max(5, Math.round(rh * 0.2));
      const tip = `${num.get(t.id)} ${t.name}\nMilestone ${dayToDisp(s0)} · ${t.done ? 'reached' : 'not reached'}`;
      bars += `<g class="bar" data-open="${esc(t.id)}"><title>${esc(tip)}</title>` +
        `<rect x="${cx - rh / 2}" y="${y}" width="${rh}" height="${rh}" fill="transparent"/>` +
        `<circle cx="${cx}" cy="${cy}" r="${rr}" class="ms-c ${t.done ? 'ms-done' : 'ms-open'}"/></g>`;
      return;
    }
    const x = g.x(s0);
    const w = Math.max(8, t.duration * g.dayW);            // minimum 8 px so 1-day tasks stay visible
    const bh = Math.round(rh * 0.56), by = y + Math.round((rh - bh) / 2);
    const pw = (w * t.percent) / 100;
    const tip = `${num.get(t.id)} ${t.name}\n${dayToDisp(s0)} – ${dayToDisp(end)} · ${t.duration} d · ${t.percent}%` +
      (t.person ? `\nOwner: ${t.person}` : '') + (t.deps.length ? `\nPredecessors: ${predText(t, num)}` : '');
    bars += `<g class="bar" data-open="${esc(t.id)}"><title>${esc(tip)}</title>` +
      `<rect x="${x - 6}" y="${y}" width="${w + 12}" height="${rh}" fill="transparent"/>` +
      `<rect class="bar-bg" x="${x}" y="${by}" width="${w}" height="${bh}" rx="3"/>` +
      (pw > 0 ? `<rect class="bar-pg" x="${x}" y="${by}" width="${pw}" height="${bh}" rx="3"/>` : '') + `</g>`;
    // Link handles (shown while the mouse is over the bar, see ui-events): drag from here to another bar.
    if (interactive) {
      hdls += `<circle class="hdl" data-id="${esc(t.id)}" data-h="s" cx="${x}" cy="${y + rh / 2}" r="5"><title>Drag onto another task to link from this START</title></circle>` +
        `<circle class="hdl" data-id="${esc(t.id)}" data-h="e" cx="${x + w}" cy="${y + rh / 2}" r="5"><title>Drag onto another task to link from this FINISH</title></circle>`;
    }
    pos.set(t.id, { yc: y + rh / 2, xs: x, xe: x + w });
  });
  let arrows = '';
  for (const r of rows) {
    if (r.kind !== 'task' || r.task.milestone) continue;
    const sp = pos.get(r.task.id);
    if (!sp) continue;
    for (const dep of r.task.deps) {
      const pp = pos.get(dep.pred);
      if (!pp) continue;                   // predecessor hidden (collapsed/filtered/other print page)
      let x1, d1, x2, d2;
      switch (dep.type) {
        case 'SS': x1 = pp.xs; d1 = -1; x2 = sp.xs; d2 = 1; break;
        case 'FF': x1 = pp.xe; d1 = 1; x2 = sp.xe; d2 = -1; break;
        case 'SF': x1 = pp.xs; d1 = -1; x2 = sp.xe; d2 = -1; break;
        default: x1 = pp.xe; d1 = 1; x2 = sp.xs; d2 = 1; // FS
      }
      const path = arrowPath(x1, pp.yc, d1, x2, sp.yc, d2, rh);
      const link = `${esc(r.task.id)}|${esc(dep.pred)}`;
      arrows += `<path class="arrow" d="${path}" marker-end="url(#${markerId})"/>`;
      if (interactive) {
        // Wide invisible line = click target (opens the link editor); circle at the arrow tip = drag to re-connect.
        arrows += `<path class="arrow-hit" data-link="${link}" d="${path}"><title>${esc(`${num.get(dep.pred)} → ${num.get(r.task.id)} · ${dep.type}${dep.lag ? (dep.lag > 0 ? '+' : '') + dep.lag + 'd' : ''}\nClick to edit · drag the arrow tip to another task`)}</title></path>`;
        top += `<circle class="ahd" data-link="${link}" data-x1="${x1}" data-y1="${pp.yc}" cx="${x2 - d2 * 10}" cy="${sp.yc}" r="5"><title>Drag onto another task to re-connect this link · click to edit</title></circle>`;
      }
    }
  }
  // Order: background, arrows, bars, arrow tips, link handles on top. Tips sit 10 px before the
  // bar edge so they do not collide with the handle on that edge.
  return s + arrows + bars + top + hdls;
}

/** The two ↑/↓ buttons of a row. */
function moveBtns(id) {
  return `<button data-k="${esc(id)}|up" data-move="up" title="Move up" aria-label="Move up">&#8593;</button>` +
    `<button data-k="${esc(id)}|down" data-move="down" title="Move down" aria-label="Move down">&#8595;</button>`;
}

/** HTML of one table row (the timeline part of the row is an empty cell under the SVG). */
function rowHTML(r, C, num, g) {
  const tl = `<div class="tlc" style="width:${g.width}px"></div>`;
  const cell = (w, inner, cls = '', extra = '') => `<div class="cell ${cls}" style="width:${w}px${extra}">${inner}</div>`;
  if (r.kind === 'phase') {
    const p = r.phase, id = esc(p.id), sm = phaseSummary(p);
    return `<div class="row phase${ui.selected === p.id ? ' sel' : ''}" data-row="${id}">` +
      cell(C.id, `<button class="idbtn" data-k="${id}|id" data-open="${id}" title="Phase details">${num.get(p.id)}</button>`, 'sticky', ';left:0') +
      cell(C.name, `<button class="tog" data-k="${id}|tog" data-toggle="${id}" aria-expanded="${!p.collapsed}" title="${p.collapsed ? 'Expand' : 'Collapse'} phase">${p.collapsed ? '&#9656;' : '&#9662;'}</button>` +
        `<input data-k="${id}|name" data-f="name" value="${esc(p.name)}" title="${esc(p.name)}" aria-label="Phase name" autocomplete="off">`,
        'sticky c-name', `;left:${C.id}px;box-shadow:inset 4px 0 0 ${phaseColor(p)}`) +
      cell(C.act, moveBtns(p.id), 'c-act') +
      cell(C.start, sm ? dayToDisp(sm.start) : '', 'muted') +
      cell(C.end, sm ? dayToDisp(sm.end) : '', 'muted') +
      cell(C.dur, sm ? sm.duration : '', 'num muted') +
      cell(C.pct, sm ? `${sm.percent}%` : '', 'num muted') +
      cell(C.person, '') + cell(C.pred, '') + tl + `</div>`;
  }
  const t = r.task, id = esc(t.id), s0 = isoToDay(t.start), auto = !t.milestone && t.deps.length > 0;
  const input = (f, val, extra = '') => `<input data-k="${id}|${f}" data-f="${f}" value="${esc(val)}" autocomplete="off"${extra}>`;
  const pt = predText(t, num);
  return `<div class="row task${ui.selected === t.id ? ' sel' : ''}" data-row="${id}">` +
    cell(C.id, `<button class="idbtn" data-k="${id}|id" data-open="${id}" title="Task details">${num.get(t.id)}</button>`, 'sticky', ';left:0') +
    cell(C.name, input('name', t.name, ` title="${esc(t.name)}" aria-label="${t.milestone ? 'Milestone' : 'Task'} name"`), 'sticky c-name', `;left:${C.id}px`) +
    cell(C.act, moveBtns(t.id), 'c-act') +
    cell(C.start, input('start', dayToDisp(s0), auto
      ? (t.snet
        ? ` class="snet" title="Automatic start, but not earlier than ${dayToDisp(isoToDay(t.snet))} (constraint). Type another date to change it, clear the field to remove it." aria-label="Start (automatic, with constraint)"`
        : ' title="Automatic start from the predecessors. Typing a date sets a “start no earlier than” constraint." aria-label="Start (automatic)"')
      : ' title="Start date (DD.MM.YYYY)" aria-label="Start date"')) +
    cell(C.end, t.milestone ? '<span class="muted">—</span>' : input('end', dayToDisp(taskEndDay(t)), ' title="End date (DD.MM.YYYY)" aria-label="End date"')) +
    cell(C.dur, t.milestone ? '<span class="muted">0</span>' : input('dur', t.duration, ' inputmode="numeric" aria-label="Duration in days"'), 'num') +
    cell(C.pct, t.milestone
      ? `<label class="cbx" title="Milestone reached"><input type="checkbox" data-k="${id}|done" data-f="done"${t.done ? ' checked' : ''} aria-label="Milestone reached"></label>`
      : input('pct', t.percent, ' inputmode="numeric" aria-label="Percent complete"'), 'num') +
    cell(C.person, input('person', t.person, ' aria-label="Owner"')) +
    cell(C.pred, t.milestone ? '<span class="muted">—</span>'
      : `<button class="predbtn${pt ? '' : ' none'}" data-k="${id}|pred" data-open="${id}" data-deps="1" title="${esc(pt || 'Add a predecessor')}">${esc(pt || '+ add')}</button>`) +
    tl + `</div>`;
}

/**
 * Full re-render of the sheet. Keeps scroll position and keyboard focus,
 * so editing with Tab from field to field keeps working.
 */
function render() {
  const sc = $('#scroller'), sheet = $('#sheet');
  const sl = sc.scrollLeft, st = sc.scrollTop;
  const ae = document.activeElement;
  let focusKey = pendingFocus;
  const selectText = !!pendingFocus;
  if (!focusKey && ae && sheet.contains(ae)) focusKey = ae.dataset.k || null;
  pendingFocus = null;

  const C = colDefs(), rh = rowHeight(), g = timelineGeom(), rows = visibleRows(), num = numbering();
  const leftW = C.id + C.name + C.act + C.start + C.end + C.dur + C.pct + C.person + C.pred;
  const stickyW = C.id + C.name;
  const totalW = leftW + g.width;
  lastLayout = { g, C, leftW, stickyW, rh };

  const hc = (w, label, cls = '', extra = '') => `<div class="cell ${cls}" style="width:${w}px${extra}">${label}</div>`;
  let html = `<div class="hdr" style="width:${totalW}px;height:${g.hdrH}px">` +
    hc(C.id, '#', 'sticky', ';left:0') + hc(C.name, 'Name', 'sticky c-name', `;left:${C.id}px`) +
    hc(C.act, 'Move', 'c-act') + hc(C.start, 'Start') + hc(C.end, 'End') + hc(C.dur, 'Days', 'num') +
    hc(C.pct, '%', 'num') + hc(C.person, 'Owner') + hc(C.pred, 'Predecessors') +
    `<div class="tlh" style="width:${g.width}px;height:${g.hdrH}px"><svg width="${g.width}" height="${g.hdrH}">${timelineHeaderInner(g)}</svg></div></div>`;
  html += `<div class="body" style="width:${totalW}px;height:${rows.length * rh}px">` +
    `<svg class="tl" style="left:${leftW}px" width="${g.width}" height="${rows.length * rh}">${timelineBodyInner(rows, g, rh, 'arrowhead', num)}</svg>` +
    rows.map((r) => rowHTML(r, C, num, g)).join('') + `</div>`;
  if (!rows.length) {
    html += ui.filter.trim()
      ? `<div class="empty">No task or phase matches “${esc(ui.filter.trim())}”.</div>`
      : `<div class="empty">No phases or tasks yet. Use <b>+ Phase</b> or <b>+ Task</b> to start, or Menu → <b>Open project</b>.</div>`;
  }
  sheet.style.width = `${totalW}px`;
  sheet.innerHTML = html;
  sc.scrollLeft = sl;
  sc.scrollTop = st;
  if (focusKey) {
    const el = sheet.querySelector(`[data-k="${CSS.escape(focusKey)}"]`);
    if (el) {
      el.focus({ preventScroll: !selectText });
      if (selectText && typeof el.select === 'function') el.select();
    }
  }
  updateToolbar();
}
</script>

<!-- ======================================================================
     7. UI PRINT: A4 landscape pages
     ====================================================================== -->
<script id="ui-print">
'use strict';
/*
 * Browsers cannot split a wide element across several pages by themselves,
 * so the pages are built here: the chart (as currently shown: zoom, collapsed
 * phases and search are respected) is cut into page-sized pieces, first
 * top-to-bottom by rows, then left-to-right by time. Every page repeats the
 * task table on the left and has a header (project, print date, page x of y)
 * and a footer describing which rows and dates it contains.
 * Page = A4 landscape minus 10 mm margins = 277 x 190 mm ≈ 1046 x 716 px.
 */
function buildPrint() {
  const area = $('#printArea');
  const rows = visibleRows(), num = numbering(), g = timelineGeom();
  const PW = 1046, PH = 716, RH = 22, HH = g.hdrH, TOP = 30, BOT = 20;
  const cols = [{ w: 40, t: '#' }, { w: 196, t: 'Name' }, { w: 80, t: 'Start' }, { w: 80, t: 'End' }, { w: 38, t: 'Days' }];
  const LW = cols.reduce((a, c) => a + c.w, 0);
  const TW = PW - LW - 1;
  const perPage = Math.max(1, Math.floor((PH - TOP - BOT - HH - 4) / RH));
  const rowChunks = Math.max(1, Math.ceil(rows.length / perPage));
  const colChunks = Math.max(1, Math.ceil(g.width / TW));
  const total = rowChunks * colChunks;
  const printed = dayToDisp(todayDay());
  const head = timelineHeaderInner(g);

  /** Left table for a slice of rows. */
  const left = (slice) => {
    let s = `<div class="prw hd" style="height:${HH}px">${cols.map((c) => `<div style="width:${c.w}px">${c.t}</div>`).join('')}</div>`;
    for (const r of slice) {
      let vals, cls = '', stripe = '';
      if (r.kind === 'phase') {
        const sm = phaseSummary(r.phase);
        vals = [num.get(r.phase.id), r.phase.name, sm ? dayToDisp(sm.start) : '', sm ? dayToDisp(sm.end) : '', sm ? sm.duration : ''];
        cls = ' phase';
        stripe = `box-shadow:inset 3px 0 0 ${phaseColor(r.phase)};`;
      } else {
        const t = r.task;
        vals = [num.get(t.id), t.name, dayToDisp(isoToDay(t.start)), t.milestone ? '—' : dayToDisp(taskEndDay(t)), t.milestone ? '0' : t.duration];
      }
      s += `<div class="prw${cls}" style="height:${RH}px">` + vals.map((v, i) =>
        `<div style="width:${cols[i].w}px;${i === 0 ? stripe : ''}${i === 1 && r.kind === 'task' ? 'padding-left:14px;' : ''}${i === 4 ? 'text-align:right;' : ''}">${esc(v)}</div>`).join('') + `</div>`;
    }
    return s;
  };

  let html = '', k = 0;
  for (let rc = 0; rc < rowChunks; rc++) {
    const slice = rows.slice(rc * perPage, (rc + 1) * perPage);
    const leftHtml = left(slice);
    for (let cc = 0; cc < colChunks; cc++) {
      k++;
      const x0 = cc * TW, w = Math.min(TW, g.width - x0), bh = Math.max(1, slice.length * RH);
      const d0 = g.start + Math.floor(x0 / g.dayW);
      const d1 = Math.min(g.end, g.start + Math.ceil((x0 + w) / g.dayW) - 1);
      html += `<section class="page">
        <header class="ph"><b>${esc(state.name)}</b><span>Printed ${printed}</span><span>Page ${k} of ${total}</span></header>
        <div class="pb">
          <div class="pl" style="width:${LW}px">${leftHtml}</div>
          <div class="pt" style="width:${w}px">
            <svg width="${w}" height="${HH}" viewBox="${x0} 0 ${w} ${HH}">${head}</svg>
            <svg width="${w}" height="${bh}" viewBox="${x0} 0 ${w} ${bh}">${timelineBodyInner(slice, g, RH, `pa${k}`, num, false)}</svg>
          </div>
        </div>
        <footer class="pf">Rows ${slice.length ? rc * perPage + 1 : 0}–${rc * perPage + slice.length} of ${rows.length} · timeline part ${cc + 1} of ${colChunks} (${dayToDisp(d0)} – ${dayToDisp(d1)}) · Gantt Chart Planner</footer>
      </section>`;
    }
  }
  area.innerHTML = html;
}

/** Menu → Print / PDF. The browser's print dialog also offers "Save as PDF". */
function doPrint() {
  buildPrint();
  window.print();
}
// Ctrl+P / browser menu printing: build the pages just before printing, clean up afterwards.
window.addEventListener('beforeprint', buildPrint);
window.addEventListener('afterprint', () => { $('#printArea').innerHTML = ''; });
</script>

<!-- ======================================================================
     8. UI EVENTS: toolbar, table editing, keyboard, start-up
     ====================================================================== -->
<script id="ui-events">
'use strict';

/** Synchronises toolbar controls with the state (undo/redo availability, name, zoom, title). */
function updateToolbar() {
  $('#bUndo').disabled = !undoStack.length;
  $('#bRedo').disabled = !redoStack.length;
  const pn = $('#projName');
  if (document.activeElement !== pn) pn.value = state.name;
  $('#zoom').value = ui.zoom;
  document.title = `${state.name} – Gantt Chart Planner`;
}

/** Highlights a row without a full re-render (so clicking into a field keeps the caret). */
function selectRow(id) {
  ui.selected = id;
  $$('#sheet .row.sel').forEach((r) => r.classList.remove('sel'));
  const row = $(`#sheet .row[data-row="${CSS.escape(id)}"]`);
  if (row) row.classList.add('sel');
}

/** Scrolls the timeline so that day n is near the left edge (just right of the sticky columns). */
function scrollToDay(n, smooth) {
  const L = lastLayout;
  if (!L) return;
  const margin = (L.g.zoom === 'week' ? 3 : 10) * L.g.dayW;
  const left = Math.max(0, L.leftW + L.g.x(n) - L.stickyW - margin);
  $('#scroller').scrollTo({ left, behavior: smooth ? 'smooth' : 'auto' });
}

/** Switches week/month zoom and keeps the same date at the left edge of the visible timeline. */
function setZoom(z) {
  const sc = $('#scroller'), L = lastLayout;
  let anchor = null;
  if (L && sc.scrollLeft + L.stickyW > L.leftW) anchor = L.g.start + (sc.scrollLeft + L.stickyW - L.leftW) / L.g.dayW;
  ui.zoom = z;
  render();
  if (anchor !== null) { const N = lastLayout; sc.scrollLeft = Math.max(0, N.leftW + N.g.x(anchor) - N.stickyW); }
}

/** Adds a task after the selected task (or at the end of the selected / last phase). */
function addTask() {
  let target = null, after = -1;
  if (ui.selected) {
    const tl = findTask(ui.selected);
    if (tl) { target = tl.phase; after = tl.index; }
    else { const pl = findPhase(ui.selected); if (pl) target = pl.phase; }
  }
  let created = null;
  clearSearch();
  commit(() => {
    if (!state.phases.length) state.phases.push(makePhase({ name: 'Phase 1' }));
    if (!target || !state.phases.includes(target)) target = state.phases[state.phases.length - 1];
    created = makeTask({ name: 'New task' });
    if (after >= 0) target.tasks.splice(after + 1, 0, created); else target.tasks.push(created);
    target.collapsed = false;
    ui.selected = created.id;
  });
  if (created) pendingFocus = `${created.id}|name`;
}

/** Adds a phase after the selected phase (or after the phase of the selected task), else at the end. */
function addPhase() {
  let at = state.phases.length;
  if (ui.selected) {
    const pl = findPhase(ui.selected) || (findTask(ui.selected) ? findPhase(findTask(ui.selected).phase.id) : null);
    if (pl) at = pl.index + 1;
  }
  let created = null;
  clearSearch();
  commit(() => {
    created = makePhase({ name: `Phase ${state.phases.length + 1}` });
    state.phases.splice(at, 0, created);
    ui.selected = created.id;
  });
  if (created) pendingFocus = `${created.id}|name`;
}

/** Deletes a task and every link pointing to it. */
function deleteTask(id) {
  commit(() => {
    const loc = findTask(id);
    if (!loc) return false;
    loc.phase.tasks.splice(loc.index, 1);
    for (const x of allTasks()) x.deps = x.deps.filter((d) => d.pred !== id);
    if (ui.selected === id) ui.selected = null;
  });
}

/** Deletes a phase with all its tasks and every link pointing to those tasks. */
function deletePhase(id) {
  commit(() => {
    const loc = findPhase(id);
    if (!loc) return false;
    const gone = new Set(loc.phase.tasks.map((t) => t.id));
    state.phases.splice(loc.index, 1);
    for (const x of allTasks()) x.deps = x.deps.filter((d) => !gone.has(d.pred));
    if (ui.selected === id || gone.has(ui.selected)) ui.selected = null;
  });
}

/** Copies a task right below the original: same data, but WITHOUT links (decision). */
function duplicateTask(id) {
  let copyId = null;
  commit(() => {
    const loc = findTask(id);
    if (!loc) return false;
    const c = JSON.parse(JSON.stringify(loc.task));
    c.id = newId('t');
    c.name = `${loc.task.name} (copy)`;
    c.deps = [];
    loc.phase.tasks.splice(loc.index + 1, 0, c);
    ui.selected = c.id;
    copyId = c.id;
  });
  if (copyId) pendingFocus = `${copyId}|name`;
}

/**
 * ↑/↓: tasks move within their phase; at the edge of a phase they move into
 * the previous/next phase. Phases move among phases. Numbers update automatically.
 */
function moveRow(id, dir) {
  const ok = commit(() => {
    const ph = findPhase(id);
    const arr = state.phases;
    if (ph) {
      const j = ph.index + (dir === 'up' ? -1 : 1);
      if (j < 0 || j >= arr.length) return false;
      [arr[ph.index], arr[j]] = [arr[j], arr[ph.index]];
      return true;
    }
    const loc = findTask(id);
    if (!loc) return false;
    const { phase, index, task } = loc;
    const pi = arr.indexOf(phase);
    if (dir === 'up') {
      if (index > 0) [phase.tasks[index - 1], phase.tasks[index]] = [phase.tasks[index], phase.tasks[index - 1]];
      else if (pi > 0) { phase.tasks.splice(index, 1); arr[pi - 1].tasks.push(task); arr[pi - 1].collapsed = false; }
      else return false;
    } else {
      if (index < phase.tasks.length - 1) [phase.tasks[index + 1], phase.tasks[index]] = [phase.tasks[index], phase.tasks[index + 1]];
      else if (pi < arr.length - 1) { phase.tasks.splice(index, 1); arr[pi + 1].tasks.unshift(task); arr[pi + 1].collapsed = false; }
      else return false;
    }
    return true;
  });
  if (ok) { ui.selected = id; pendingFocus = `${id}|${dir}`; }
}

/** Collapses/expands a phase. Stored in the file, but not an undo step. */
function toggleCollapse(id) {
  const loc = findPhase(id);
  if (!loc) return;
  loc.phase.collapsed = !loc.phase.collapsed;
  dirty = true;
  pendingFocus = `${id}|tog`;
  requestRender();
}

/** Empties the search box (used when adding rows so new rows are visible). */
function clearSearch() { ui.filter = ''; $('#search').value = ''; }

/** Opens the operating system's file dialog to choose a project file. */
function openFilePicker() { const fi = $('#fileInput'); fi.value = ''; fi.click(); }

/** Shows an "invalid date" message and restores the previous value. */
function invalidDate(el, previous) {
  const bad = el.value;
  el.value = previous;
  showMessage('Invalid date', `<p>“${esc(bad)}” is not a valid date. Please use DD.MM.YYYY, for example ${dayToDisp(todayDay())}.</p>`);
}

/** Commits the field that currently has focus (used before shortcuts such as Ctrl+S). */
function flushActiveEdit() {
  const el = document.activeElement;
  if (el && el.matches('#sheet input, #projName')) el.dispatchEvent(new Event('change', { bubbles: true }));
}

/** Menu actions. */
async function menuAction(act) {
  $('#menu').open = false;
  switch (act) {
    case 'open': openFilePicker(); break;
    case 'save': flushActiveEdit(); exportJSON(); break;
    case 'csv': exportCSV(); break;
    case 'xml': exportXML(); break;
    case 'print': doPrint(); break;
    case 'help': openHelp(); break;
    case 'holidays': openHolidaysDialog(); break;
    case 'new':
      if (await confirmBox('New empty project?', '<p>The current project will be replaced by an empty one.</p><p class="hint">Save it first if you want to keep it. You can also undo this with Ctrl+Z.</p>', 'Start empty')) {
        commit(() => { state = { name: 'New project', holidays: defaultHolidays(), phases: [] }; ui.selected = null; });
        pendingFocus = null;
        $('#projName').focus();
        $('#projName').select();
      }
      break;
  }
}

/* ---------------------------------------------------------------------------
 * DRAG-TO-LINK (mouse / pen only; on touch screens the dialogs are used, so
 * that dragging never interferes with scrolling).
 *  - Drag a handle (circle at the start or finish of a bar) onto another bar.
 *    The side you drop on decides the type: finish→start FS, start→start SS,
 *    finish→finish FF, start→finish SF.
 *  - Drag the tip of an existing arrow onto another task to re-connect it.
 * Every drop is checked: no milestones, no link to itself, no loops.
 * ------------------------------------------------------------------------- */
let drag = null;
let suppressClick = false;

/** The task bar under the mouse and which half (start 's' / finish 'e') it is on. */
function barUnderPointer(e) {
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const gEl = el && el.closest('svg.tl .bar[data-open]');
  if (!gEl) return null;
  const bg = gEl.querySelector('.bar-bg');
  if (!bg) return null;                                  // phase or milestone: not linkable
  const r = bg.getBoundingClientRect();
  return { id: gEl.dataset.open, el: gEl, side: e.clientX < r.left + r.width / 2 ? 's' : 'e' };
}

/**
 * Checks and applies a link pred -> succ of the given type as one undo step.
 * `oldSucc` = the previous successor when an existing arrow is re-connected.
 * Returns an error text instead of applying when the link is not allowed.
 */
function applyLink(pred, succ, type, lag, oldSucc) {
  if (pred === succ) return 'A task cannot depend on itself.';
  const p = findTask(pred), sTask = findTask(succ);
  if (!p || !sTask) return 'Task not found.';
  if (p.task.milestone || sTask.task.milestone) return 'Milestones cannot have dependencies.';
  const depsOf = (x) => {
    let list = x.deps;
    if (oldSucc && x.id === oldSucc) list = list.filter((k) => k.pred !== pred);
    if (x.id === succ) {
      const prev = list.find((k) => k.pred === pred);
      list = list.filter((k) => k.pred !== pred).concat([{ pred, type, lag: prev ? prev.lag : lag }]);
    }
    return list;
  };
  const { cycle } = topoOrder(allTasks(), depsOf);
  if (cycle) {
    const num = numbering();
    return `This link would create a loop (${cycle.map((c) => num.get(c)).join(' → ')}), so it was not created.`;
  }
  commit(() => { for (const x of allTasks()) if (x.id === succ || x.id === oldSucc) x.deps = depsOf(x); });
  return null;
}

/** pointerdown on a handle or an arrow tip starts dragging a link. */
function startLinkDrag(e) {
  const h = e.target.closest('.hdl, .ahd');
  if (!h || e.pointerType === 'touch' || e.button !== 0) return;
  e.preventDefault();
  e.stopPropagation();
  const svg = h.ownerSVGElement;
  if (h.classList.contains('hdl')) {
    drag = { mode: 'new', pred: h.dataset.id, side: h.dataset.h, x0: Number(h.getAttribute('cx')), y0: Number(h.getAttribute('cy')) };
  } else {
    const [succ, pred] = h.dataset.link.split('|');
    const dep = findTask(succ)?.task.deps.find((k) => k.pred === pred);
    if (!dep) return;
    drag = { mode: 'move', pred, oldSucc: succ, side: dep.type[0] === 'F' ? 'e' : 's', lag: dep.lag,
      x0: Number(h.dataset.x1), y0: Number(h.dataset.y1), sx: e.clientX, sy: e.clientY };
  }
  drag.svg = svg;
  drag.sx = e.clientX; drag.sy = e.clientY; drag.moved = false; drag.target = null;
  drag.line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  drag.line.setAttribute('class', 'dragline');
  svg.appendChild(drag.line);
  window.addEventListener('pointermove', moveLinkDrag);
  window.addEventListener('pointerup', endLinkDrag);
  window.addEventListener('pointercancel', endLinkDrag);
}

/** Follows the mouse with a dashed line, highlights the drop target and scrolls near the edges. */
function moveLinkDrag(e) {
  if (!drag) return;
  if (Math.abs(e.clientX - drag.sx) + Math.abs(e.clientY - drag.sy) > 4) drag.moved = true;
  const r = drag.svg.getBoundingClientRect();
  drag.line.setAttribute('d', `M${drag.x0} ${drag.y0}L${e.clientX - r.left} ${e.clientY - r.top}`);
  if (drag.target) drag.target.el.classList.remove('drop', 'nodrop');
  drag.target = barUnderPointer(e);
  if (drag.target) {
    const ok = drag.target.id !== drag.pred && !dependentsOf(drag.target.id).has(drag.pred);
    drag.target.el.classList.add(ok ? 'drop' : 'nodrop');
  }
  const sc = $('#scroller'), b = sc.getBoundingClientRect();
  // Auto-scroll when the mouse is close to an edge of the visible chart.
  if (e.clientX > b.right - 20) sc.scrollLeft += 12;
  else if (e.clientX < b.left + (lastLayout ? lastLayout.stickyW : 0) + 20) sc.scrollLeft -= 12;
  if (e.clientY > b.bottom - 20) sc.scrollTop += 10;
  else if (e.clientY < b.top + (lastLayout ? lastLayout.g.hdrH : 44) + 20) sc.scrollTop -= 10;
}

/** Drop: creates or re-connects the link (or explains why not). */
function endLinkDrag(e) {
  window.removeEventListener('pointermove', moveLinkDrag);
  window.removeEventListener('pointerup', endLinkDrag);
  window.removeEventListener('pointercancel', endLinkDrag);
  if (!drag) return;
  const dg = drag;
  drag = null;
  dg.line.remove();
  if (dg.target) dg.target.el.classList.remove('drop', 'nodrop');
  if (!dg.moved) {                                   // a plain click on an arrow tip: open the editor
    if (dg.mode === 'move' && e.type === 'pointerup') { suppressClick = true; openLinkDialog(dg.oldSucc, dg.pred); }
    return;
  }
  suppressClick = true;
  setTimeout(() => { suppressClick = false; }, 300);
  if (e.type !== 'pointerup') return;
  const t = barUnderPointer(e);
  if (!t) return;                                    // dropped on empty space: nothing happens
  const type = (dg.side === 'e' ? 'F' : 'S') + (t.side === 's' ? 'S' : 'F');
  const problem = applyLink(dg.pred, t.id, type, dg.mode === 'move' ? dg.lag : 0, dg.mode === 'move' ? dg.oldSucc : null);
  if (problem) showMessage('Link not possible', `<p>${esc(problem)}</p>`);
}

/** Wires up every event handler and shows the first screen. */
function init() {
  sampleProject('My Project');
  schedule();
  const sheet = $('#sheet');

  // ---- toolbar ----
  $('#bAddPhase').addEventListener('click', addPhase);
  $('#bAddTask').addEventListener('click', addTask);
  $('#bUndo').addEventListener('click', undo);
  $('#bRedo').addEventListener('click', redo);
  $('#zoom').addEventListener('change', (e) => setZoom(e.target.value));
  $('#bToday').addEventListener('click', () => scrollToDay(todayDay(), true));
  $('#search').addEventListener('input', (e) => { ui.filter = e.target.value; requestRender(); });
  const pn = $('#projName');
  pn.addEventListener('change', () => commit(() => { state.name = pn.value.trim() || 'Untitled project'; }));
  pn.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); pn.dispatchEvent(new Event('change')); pn.blur(); }
    if (e.key === 'Escape') { pn.value = state.name; pn.blur(); }
  });
  $$('#menu [data-act]').forEach((b) => b.addEventListener('click', () => menuAction(b.dataset.act)));
  document.addEventListener('click', (e) => { const m = $('#menu'); if (m.open && !m.contains(e.target)) m.open = false; });
  $('#fileInput').addEventListener('change', (e) => { const file = e.target.files && e.target.files[0]; if (file) importFile(file); });

  // ---- table editing (event delegation: one listener for all rows) ----
  sheet.addEventListener('change', (e) => {
    const el = e.target;
    const row = el.closest('.row');
    if (!row || !el.dataset.f) return;
    const id = row.dataset.row, f = el.dataset.f;
    if (row.classList.contains('phase')) {
      if (f === 'name') commit(() => { const p = findPhase(id); if (!p) return false; p.phase.name = el.value.trim() || 'Untitled phase'; });
      return;
    }
    const loc = findTask(id);
    if (!loc) return;
    const t = loc.task;
    switch (f) {
      case 'name': commit(() => { t.name = el.value.trim() || 'Untitled task'; }); break;
      case 'person': commit(() => { t.person = el.value.trim(); }); break;
      case 'start': {
        if (t.deps.length && !t.milestone) {
          // Linked task: typing a date sets "start no earlier than", an empty field removes it.
          if (!el.value.trim()) { commit(() => { delete t.snet; }); return; }
          const c = dispToDay(el.value);
          if (isNaN(c)) { invalidDate(el, dayToDisp(isoToDay(t.start))); return; }
          commit(() => { t.snet = dayToIso(c); });
          return;
        }
        const n = dispToDay(el.value);
        if (isNaN(n)) { invalidDate(el, dayToDisp(isoToDay(t.start))); return; }
        commit(() => { t.start = dayToIso(n); });
        break;
      }
      case 'end': {
        const n = dispToDay(el.value);
        if (isNaN(n)) { invalidDate(el, dayToDisp(taskEndDay(t))); return; }
        commit(() => { t.duration = Math.max(1, n - isoToDay(t.start) + 1); });   // end before start -> 1 day
        break;
      }
      case 'dur': commit(() => { t.duration = clampInt(el.value, 1, 100000, t.duration); }); break;
      case 'pct': commit(() => { t.percent = clampInt(el.value, 0, 100, t.percent); }); break;
      case 'done': commit(() => { t.done = el.checked; }); break;
    }
  });
  sheet.addEventListener('keydown', (e) => {
    const el = e.target;
    if (!el.matches('input:not([type=checkbox])')) return;
    if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); el.dispatchEvent(new Event('change', { bubbles: true })); }
    if (e.key === 'Escape') { el.value = el.defaultValue; }
  });
  sheet.addEventListener('click', (e) => {
    if (suppressClick) { suppressClick = false; return; }       // the click that ends a drag
    const lk = e.target.closest('[data-link]');
    if (lk) { const [succ, pred] = lk.dataset.link.split('|'); openLinkDialog(succ, pred); return; }
    const tg = e.target.closest('[data-toggle]');
    if (tg) { selectRow(tg.dataset.toggle); toggleCollapse(tg.dataset.toggle); return; }
    const mv = e.target.closest('[data-move]');
    if (mv) { moveRow(mv.closest('.row').dataset.row, mv.dataset.move); return; }
    const op = e.target.closest('[data-open]');
    if (op) { selectRow(op.dataset.open); openDetails(op.dataset.open, op.dataset.deps === '1'); return; }
    const row = e.target.closest('.row');
    if (row) selectRow(row.dataset.row);
  });
  sheet.addEventListener('pointerdown', startLinkDrag);
  // Show the link handles of the bar under the mouse (also while the mouse is on a handle).
  sheet.addEventListener('pointerover', (e) => {
    if (e.pointerType === 'touch' || drag) return;
    const b = e.target.closest('svg.tl .bar[data-open], svg.tl .hdl');
    const id = b ? (b.dataset.open || b.dataset.id) : null;
    $$('#sheet .hdl.show').forEach((h) => { if (h.dataset.id !== id) h.classList.remove('show'); });
    if (id) $$(`#sheet .hdl[data-id="${CSS.escape(id)}"]`).forEach((h) => h.classList.add('show'));
  });
  sheet.addEventListener('focusin', (e) => { const row = e.target.closest('.row'); if (row && ui.selected !== row.dataset.row) selectRow(row.dataset.row); });

  // ---- keyboard shortcuts ----
  document.addEventListener('keydown', (e) => {
    const mod = e.ctrlKey || e.metaKey;
    const key = e.key.toLowerCase();
    if (document.querySelector('dialog[open]')) {
      if (mod && key === 's') e.preventDefault();          // never open the browser's "Save page" over a dialog
      return;
    }
    const typing = e.target.matches('input:not([type=checkbox]):not([readonly]), textarea');
    if (mod && !e.altKey && key === 's') { e.preventDefault(); flushActiveEdit(); exportJSON(); return; }
    if (mod && !e.altKey && key === 'z' && !e.shiftKey) { if (typing) return; e.preventDefault(); undo(); return; }
    if (mod && !e.altKey && (key === 'y' || (key === 'z' && e.shiftKey))) { if (typing) return; e.preventDefault(); redo(); return; }
    if (e.altKey && !mod && e.code === 'KeyN') { e.preventDefault(); flushActiveEdit(); addTask(); }
  });

  // ---- page life-cycle ----
  // Warn before leaving with unsaved changes (the only safety net without auto-save).
  window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
  // Re-render on resize only if the column layout really changes. (On phones the
  // on-screen keyboard fires resize events; re-rendering then would close it.)
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (!lastLayout || JSON.stringify(colDefs()) !== JSON.stringify(lastLayout.C) || rowHeight() !== lastLayout.rh) render();
    }, 150);
  });

  render();
  scrollToDay(todayDay(), false);   // decision: open on the current week
  openWelcome();
}

init();
</script>
</body>
</html>
